name: Build Cinejoy Helper

on:
  push:
    paths:
      - 'cinejoy-okpro/helper/**'
      - '.github/workflows/build-cinejoy-helper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download QuickJS Java wrapper
        run: |
          mkdir -p build/lib build/classes build/dex
          curl -fL             https://repo.maven.apache.org/maven2/wang/harlon/quickjs/wrapper-java/3.2.3/wrapper-java-3.2.3.jar             -o build/lib/wrapper-java.jar

      - name: Locate Android SDK
        id: sdk
        shell: bash
        run: |
          PLATFORM=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -n 1)
          D8=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)
          test -n "$PLATFORM"
          test -n "$D8"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "d8=$D8" >> "$GITHUB_OUTPUT"

      - name: Compile helper
        run: |
          javac -encoding UTF-8 -source 8 -target 8             -cp "${{ steps.sdk.outputs.platform }}:build/lib/wrapper-java.jar"             -d build/classes             cinejoy-okpro/helper/src/com/github/catvod/js/Function.java

      - name: Build Android dex jar
        run: |
          "${{ steps.sdk.outputs.d8 }}"             --min-api 24             --lib "${{ steps.sdk.outputs.platform }}"             --classpath build/lib/wrapper-java.jar             --output build/dex             build/classes/com/github/catvod/js/Function.class
          (cd build/dex && zip -q -j ../../cinejoy-okpro/cinejoy_helper_v3.jar classes.dex)
          unzip -l cinejoy-okpro/cinejoy_helper_v3.jar

      - name: Commit helper jar
        run: |
          if [ -z "$(git status --porcelain -- cinejoy-okpro/cinejoy_helper_v3.jar)" ]; then
            echo "Helper jar unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinejoy-okpro/cinejoy_helper_v3.jar
          git commit -m "Build Cinejoy QuickJS helper"
          git pull --rebase origin main
          git push
