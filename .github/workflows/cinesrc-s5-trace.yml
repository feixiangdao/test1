name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract exact getStream call arguments
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0'
          curl -fsSL --max-time 30 -A "$UA" 'https://cinesrc.st/embed/movie/157336' -o /tmp/page.html
          grep -oE '<script[^>]+src="[^"]+"' /tmp/page.html | sed -E 's/.*src="([^"]+)"/\1/' | sort -u > /tmp/scripts.txt
          n=0
          while read -r p; do
            [ -z "$p" ] && continue
            n=$((n+1))
            curl -fsSL --max-time 30 -A "$UA" -e 'https://cinesrc.st/embed/movie/157336' "https://cinesrc.st$p" -o "/tmp/js$n.js" || true
          done < /tmp/scripts.txt
          python3 - <<'PY'
          import glob,re,os
          for fn in glob.glob('/tmp/js*.js'):
              txt=open(fn,encoding='utf-8',errors='replace').read()
              if '7e278c7b1a4440a99a81b5c121b5f93193ce0a3f64' not in txt:
                  continue
              print('FILE',fn,'LEN',len(txt))
              # d5 is the current getStream server reference in this bundle.
              for pat in [r'await\s+d5\(',r'\bd5\(',r'getStream']:
                  for m in re.finditer(pat,txt):
                      i=m.start()
                      print('\n---',pat,'@',i,'---')
                      print(txt[max(0,i-1800):min(len(txt),i+3200)])
          PY
