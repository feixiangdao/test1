name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official challenge worker protocol
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 30 'https://cinesrc.st/300726c-prod.js' -o /tmp/c.js
          curl -fsSL --max-time 30 'https://cinesrc.st/pow-worker-v3.js' -o /tmp/w.js
          python3 - <<'PY'
          import re
          for fn in ['/tmp/c.js','/tmp/w.js']:
              txt=open(fn,encoding='utf-8',errors='replace').read()
              print('FILE',fn,'LEN',len(txt))
              for kw in ['new Worker','Worker(','postMessage','onmessage','pow-worker-v3','WebAssembly','solve','nonce']:
                  pos=0;c=0
                  while True:
                      i=txt.find(kw,pos)
                      if i<0 or c>=12: break
                      print('\n---',kw,'@',i,'---')
                      print(txt[max(0,i-1200):min(len(txt),i+2200)])
                      pos=i+len(kw);c+=1
          PY