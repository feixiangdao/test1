name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract Febbox fallback implementation
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0'
          curl -fsSL --max-time 30 -A "$UA" 'https://cinesrc.st/embed/movie/157336' -o /tmp/page.html
          grep -oE '<script[^>]+src="[^"]+"' /tmp/page.html | sed -E 's/.*src="([^"]+)"/\1/' | sort -u > /tmp/scripts.txt
          n=0
          while read -r p; do
            [ -z "$p" ] && continue
            n=$((n+1))
            curl -fsSL --max-time 30 -A "$UA" -e 'https://cinesrc.st/embed/movie/157336' "https://cinesrc.st$p" -o "/tmp/js$n.js" || true
          done < /tmp/scripts.txt
          python3 - <<'PY'
          import glob,re,os
          keys=['fetchFebboxHLS','fetchFebboxMP4','febboxToken','febbox-hls','febbox-mp4','v2()']
          for fn in glob.glob('/tmp/js*.js'):
              txt=open(fn,encoding='utf-8',errors='replace').read()
              if not any(k in txt for k in keys): continue
              print('FILE',fn,'LEN',len(txt))
              seen=[]
              for kw in keys:
                  pos=0
                  while True:
                      i=txt.find(kw,pos)
                      if i<0: break
                      if all(abs(i-x)>2500 for x in seen):
                          seen.append(i)
                          print('\n---',kw,'@',i,'---')
                          print(txt[max(0,i-3500):min(len(txt),i+5000)])
                      pos=i+len(kw)
          PY