name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract CineSrc action IDs and challenge shapes
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cs
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Mobile Safari/537.36'
          curl -fsSL --max-time 30 -A "$UA" 'https://cinesrc.st/embed/movie/157336' -o /tmp/cs/page.html
          grep -oE '<script[^>]+src="[^"]+"' /tmp/cs/page.html | sed -E 's/.*src="([^"]+)"/\1/' | sort -u > /tmp/cs/scripts.txt
          n=0
          while read -r p; do
            [ -z "$p" ] && continue
            n=$((n+1))
            curl -fsSL --max-time 30 -A "$UA" -e 'https://cinesrc.st/embed/movie/157336' "https://cinesrc.st$p" -o "/tmp/cs/js$n.js" || true
          done < /tmp/cs/scripts.txt
          python3 - <<'PY'
          import glob,re
          for fn in glob.glob('/tmp/cs/js*.js'):
              txt=open(fn,encoding='utf-8',errors='replace').read()
              if 'getProviderList' not in txt and 'getStream' not in txt and '/api/c/bootstrap' not in txt:
                  continue
              print('\n=== FILE',fn,'LEN',len(txt),'===')
              for kw in ['getProviderList','getStream','/api/c/bootstrap','/api/c/issue','/api/c/stage2/issue','/api/c/pk','pow-worker-v3.js','donut.js']:
                  pos=0
                  while True:
                      i=txt.find(kw,pos)
                      if i<0: break
                      print('\n---',kw,'@',i,'---')
                      print(txt[max(0,i-1400):min(len(txt),i+2400)])
                      pos=i+len(kw)
                      if pos>i+5000: break
              # print server-reference-looking 40 hex ids near relevant files
              ids=sorted(set(re.findall(r'["\']([0-9a-f]{40})["\']',txt)))
              if ids: print('\nHEX40',ids)
          PY
          echo '=== CHALLENGE ENDPOINT SHAPES ==='
          Q=$(python3 - <<'PY'
          import base64,json
          b=json.dumps(["movie","157336",None,None],separators=(',',':')).encode()
          print(base64.urlsafe_b64encode(b).decode().rstrip('='))
          PY
          )
          echo "Q=$Q"
          curl -sS -D /tmp/cs/boot.h -o /tmp/cs/boot.json -X POST -H "x-cs-q: $Q" -H "User-Agent: $UA" 'https://cinesrc.st/api/c/bootstrap' || true
          echo '--- bootstrap headers ---'; cat /tmp/cs/boot.h
          echo '--- bootstrap body ---'; head -c 4000 /tmp/cs/boot.json; echo
          COOKIES=$(grep -i '^set-cookie:' /tmp/cs/boot.h | sed -E 's/^set-cookie:[[:space:]]*([^;]+).*/\1/I' | paste -sd'; ' -)
          echo "COOKIE_COUNT=$(grep -ic '^set-cookie:' /tmp/cs/boot.h || true)"
          for ep in issue stage2/issue pk; do
            echo "--- $ep ---"
            curl -sS --max-time 20 -H "x-cs-q: $Q" -H "Cookie: $COOKIES" -H "User-Agent: $UA" "https://cinesrc.st/api/c/$ep" | head -c 8000
            echo
          done
