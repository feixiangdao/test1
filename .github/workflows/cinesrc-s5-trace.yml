name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: End-to-end CineSrc movie with IMDb action URL
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json, requests, hashlib, base64, time

          ORIGIN="https://cinesrc.st"
          TMDB="157336"
          IMDB="tt0816692"
          PAGE=f"{ORIGIN}/embed/movie/{IMDB}"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.37 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.37"
          API="https://enc-dec.app/api"
          S=requests.Session()
          H={"Origin":ORIGIN,"Referer":ORIGIN+"/","Content-Type":"text/plain;charset=UTF-8","User-Agent":UA}

          def u32(x): return x & 0xffffffff
          def rotl(x,n):
              n &= 31
              return u32(x) if n==0 else u32((x<<n)|(x>>(32-n)))
          def imul(a,b): return ((a&0xffffffff)*(b&0xffffffff))&0xffffffff
          def read32(b,p): return u32(b[p]|(b[p+1]<<8)|(b[p+2]<<16)|(b[p+3]<<24))
          def write32(b,p,x):
              x=u32(x)
              b[p]=x&255;b[p+1]=(x>>8)&255;b[p+2]=(x>>16)&255;b[p+3]=(x>>24)&255
          def dec64(s):
              s=s.replace("-","+").replace("_","/")+"="*((-len(s))%4)
              return bytearray(base64.b64decode(s))
          def build(w,m):
              s=[0]*4096
              x=u32(w[m&3]^u32(imul(m,0x9e3779b1)-0x61c8864f)^0xa5a5a5a5); y=0x85ebca6b
              for i in range(4096):
                  x=u32(x+y+w[i&3]);x=u32(x^(x<<13));x=u32(x^(x>>17));x=u32(x^(x<<5))
                  s[i]=u32(x+imul(i^m,0xc2b2ae35)+rotl(w[(i+m)&3],i+m));y=u32(y-0x7a143595)
              return s
          def mix(w,s,m,n):
              lo=n&0xffffffff;hi=(n>>32)&0xffffffff
              a=u32(w[0]^imul(m+1,0x27d4eb2d)^lo);b=u32(w[2]^rotl(lo,m+5));c=u32(hi^(w[1]^0x165667b1));d=u32(w[3]^rotl(u32(lo^hi),m+11));y=2667
              for r in range(1,9):
                  v=s[(imul(c,2481)^rotl(b,r)^y^a)&4095];op=((r+m-1)&7)-1
                  if op==-1:a=rotl(u32(a+d+v),5);c=u32(imul(a^c,0x9e3779b1)+b)
                  elif op==0:b=rotl(u32(b^c^v),11);d=u32(imul(b^a,0x85ebca6b)+d)
                  elif op==1:c=rotl(u32(b+c+v),17);a=u32(imul(c^d,0xc2b2ae35)^a)
                  elif op==2:d=rotl(u32(a^d^v),23);b=u32(imul(d^c,0x27d4eb2d)+b)
                  elif op==3:a=u32(imul(a^v,0x165667b1)+rotl(b,7));d=u32(rotl(u32(a+c),13)^d)
                  elif op==4:c=u32(imul(u32(v+c),0xd3a2646c)^rotl(d,9));b=u32(rotl(c^a,19)+b)
                  elif op==5:b=u32(imul(b^v,0xfd7046c5)+rotl(a,3));c=u32(rotl(u32(b+d),15)^c)
                  else:d=u32(imul(u32(d+v),0xb55a4f09)^rotl(c,21));a=u32(rotl(d^b,27)+a)
                  y+=2667
              return lo,hi,a,c,b,d
          def diff(h,d):
              q=d>>3;r=d&7
              return all(h[i]==0 for i in range(q)) and (r==0 or (h[q]>>(8-r))==0)
          def solve1(data):
              b=dec64(data["w"]);d=b[5];m=b[6];w=[read32(b,8),read32(b,12),read32(b,16),read32(b,20)];s=build(w,m)
              msg=bytearray(42);msg[0:16]=b[8:24];msg[40]=2;msg[41]=m;n=0;t=time.time()
              while True:
                  lo,hi,a,c,b2,d2=mix(w,s,m,n)
                  for p,x in [(16,lo),(20,hi),(24,a),(28,c),(32,b2),(36,d2)]:write32(msg,p,x)
                  if diff(hashlib.sha256(msg).digest(),d):
                      print("STAGE1",d,hex(n),round((time.time()-t)*1000),"ms")
                      return f"m2.{n:x}"
                  n+=1
          def solve2(data):
              target=data["pack"][0][::-1];salt=data["pack"][3][::-1];r=data["pack"][4][::-1]
              decode=lambda s:base64.urlsafe_b64decode(s+"="*((-len(s))%4)).decode()
              body=decode(r.split(".")[1]);payload=decode(body.split(".",1)[1]);difficulty=json.loads(payload)["d"];width=(difficulty+3)//4;t=time.time()
              for c in range(1<<difficulty):
                  key=format(c,"x").zfill(width)
                  if hashlib.sha256((salt+key).encode()).hexdigest()==target:
                      print("STAGE2",difficulty,key,round((time.time()-t)*1000),"ms")
                      return key
              raise RuntimeError("no stage2")

          fields=["movie",TMDB,None,None]
          q=base64.urlsafe_b64encode(json.dumps(fields,separators=(",",":")).encode()).decode().rstrip("=")
          boot=S.post(ORIGIN+"/api/c/bootstrap",headers={**H,"x-cs-q":q},timeout=20).json()
          ch={**H,"x-cs-q":q,"x-cs-r":boot["r"],"x-cs-p":boot["p"]}
          c1=S.get(ORIGIN+"/api/c/issue",headers=ch,timeout=20).json()
          s1=solve1(c1)
          c2=S.get(ORIGIN+"/api/c/stage2/issue",headers=ch,timeout=20).json()
          s2=solve2(c2)
          challenge={"stage1":{"challenge":c1,"solution":s1},"stage2":{"challenge":c2,"solution":s2}}

          er=requests.post(API+"/enc-cinesrc",json={"url":PAGE,"agent":UA,"challenge_data":challenge},timeout=30)
          print("ENC",er.status_code,er.text[:300])
          er.raise_for_status();data=er.json()["result"]
          token=data["token"]+"::c3::"+boot["r"];key=data["key"]
          print("TOKEN",len(token),"KEY",len(key))
          print("ACTIONS",data["headers"])

          hp={**H,"Next-Action":data["headers"]["getProviderList"]}
          pr=requests.post(PAGE,headers=hp,data=json.dumps([]),timeout=20)
          print("PROVIDERS_HTTP",pr.status_code,pr.text[:250].replace("\n","\\n"))
          providers=json.loads(pr.text.splitlines()[1].split(":",1)[1])
          print("PROVIDERS",[(p["id"],p["name"]) for p in providers])

          hs={**H,"Next-Action":data["headers"]["getStream"]}
          success=False
          for p in providers:
              payload=[TMDB,"movie","$undefined","$undefined",token,p["id"]]
              sr=requests.post(PAGE,headers=hs,data=json.dumps(payload),timeout=30)
              body=sr.text
              print("STREAM",p["id"],sr.status_code,body[:180].replace("\n","\\n"))
              if sr.status_code!=200 or len(body.splitlines())<2:continue
              line=body.splitlines()[1]
              if "invalid_challenge" in line or "missing_challenge" in line:continue
              try:
                  encrypted=line.split(",",1)[1].split(":",1)[0]
              except Exception:
                  continue
              dr=requests.post(API+"/dec-cinesrc",json={"text":encrypted,"key":key},timeout=30)
              print("DEC",p["id"],dr.status_code,dr.text[:5000])
              if dr.ok:
                  obj=dr.json().get("result")
                  urls=(obj or {}).get("url",[]) if isinstance(obj,dict) else []
                  if urls:
                      for x in urls[:5]:
                          u=x.get("url") if isinstance(x,dict) else None
                          if not u:continue
                          try:
                              rr=requests.get(u,headers={"User-Agent":UA,"Referer":ORIGIN+"/"},timeout=20)
                              print("PROBE",p["id"],x.get("source"),rr.status_code,rr.headers.get("content-type"),rr.text[:40] if "text" in rr.headers.get("content-type","") or "mpegurl" in rr.headers.get("content-type","") else "binary")
                          except Exception as ex: print("PROBE_ERR",repr(ex))
                      success=True
                      break
          print("SUCCESS",success)
          if not success:raise SystemExit(2)
          PY
