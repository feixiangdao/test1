name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dump CineSrc PoW worker protocol
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 30 'https://cinesrc.st/pow-worker-v3.js' -o /tmp/w.js
          echo SIZE=$(wc -c < /tmp/w.js)
          cat /tmp/w.js