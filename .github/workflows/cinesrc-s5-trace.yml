name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture official crypto Worker protocol
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 30 'https://cinesrc.st/300726c-prod.js' -o /tmp/c.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ORIGIN='https://cinesrc.st',PAGE=ORIGIN+'/embed/movie/157336';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0.0.0 Safari/537.36';
          const listeners={};let api=null;const workerLog=[];
          function addEventListener(n,f){(listeners[n]||(listeners[n]=[])).push(f)}
          function removeEventListener(n,f){if(listeners[n])listeners[n]=listeners[n].filter(x=>x!==f)}
          function dispatchEvent(e){for(const f of (listeners[e.type]||[]).slice())try{f(e)}catch{};return true}
          class CE{constructor(type,opt){this.type=type;this.detail=opt&&opt.detail}}
          class FakeWorker{
            constructor(url){this.url=String(url);this.onmessage=null;this.onerror=null;workerLog.push({event:'new',url:this.url});}
            postMessage(msg){workerLog.push({event:'post',url:this.url,msg});}
            terminate(){workerLog.push({event:'terminate',url:this.url});}
            addEventListener(type,fn){if(type==='message')this.onmessage=fn;if(type==='error')this.onerror=fn;}
            removeEventListener(){}
          }
          const g={console:{log(){},error(){}},setTimeout,clearTimeout,setInterval,clearInterval,TextEncoder,TextDecoder,URL,URLSearchParams,
            atob:s=>Buffer.from(s,'base64').toString('binary'),btoa:s=>Buffer.from(s,'binary').toString('base64'),crypto:require('crypto').webcrypto,WebAssembly,Worker:FakeWorker,
            CustomEvent:CE,Event:CE,addEventListener,removeEventListener,dispatchEvent,fetch,
            location:{origin:ORIGIN,href:PAGE,pathname:'/embed/movie/157336',search:''},navigator:{userAgent:UA,language:'en-US',languages:['en-US','en']},performance:{now:()=>Date.now()}};
          g.window=g;g.self=g;g.globalThis=g;
          g.document={createElement:()=>({style:{},setAttribute(){},appendChild(){},remove(){}}),head:{appendChild(){}},body:{appendChild(){}},documentElement:{},querySelector:()=>null,querySelectorAll:()=>[],addEventListener,removeEventListener};
          addEventListener('_cs',e=>{if(e&&e.detail&&g[e.detail])api=g[e.detail]});
          const ctx=vm.createContext(g);vm.runInContext(fs.readFileSync('/tmp/c.js','utf8'),ctx,{timeout:10000});
          function b64url(s){return Buffer.from(s).toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
          const jar={};function addCookies(r){const a=typeof r.headers.getSetCookie==='function'?r.headers.getSetCookie():[];for(const x of a){const p=x.split(';')[0],i=p.indexOf('=');if(i>0)jar[p.slice(0,i)]=p.slice(i+1)}}
          function cookies(){return Object.keys(jar).map(k=>k+'='+jar[k]).join('; ')}
          async function main(){
            console.log('API',api&&Object.keys(api));
            const q=b64url(JSON.stringify(['movie','157336',null,null]));
            const boot=await fetch(ORIGIN+'/api/c/bootstrap',{method:'POST',headers:{'User-Agent':UA,'x-cs-q':q}});addCookies(boot);const bj=await boot.json();
            const native=fetch;
            async function wrapped(input,opt){
              let url=typeof input==='string'?input:String(input&&input.url||input);if(url.startsWith('/'))url=ORIGIN+url;
              const u=new URL(url,ORIGIN);opt=Object.assign({},opt||{});const h=new Headers(opt.headers||{});h.set('User-Agent',UA);if(cookies())h.set('Cookie',cookies());
              if(u.pathname==='/api/c/issue'||u.pathname==='/api/c/stage2/issue'){h.set('x-cs-r',bj.r);h.set('x-cs-q',q);if(u.pathname==='/api/c/issue')h.set('x-cs-p',bj.p)}
              opt.headers=h;const r=await native(url,opt);addCookies(r);console.log('FETCH',u.pathname,r.status);return r;
            }
            g.fetch=wrapped;ctx.fetch=wrapped;
            let done=false;
            Promise.resolve().then(()=>api.gc()).then(v=>{done=true;console.log('GC_OK',String(v).slice(0,300))}).catch(e=>{done=true;console.log('GC_ERR',e&&e.name,String(e&&e.message||e).slice(0,500))});
            await new Promise(r=>setTimeout(r,3000));
            console.log('DONE',done);
            console.log('WORKER_LOG='+JSON.stringify(workerLog));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE