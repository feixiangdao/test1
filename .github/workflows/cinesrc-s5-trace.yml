name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose CineSrc gc methods
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 30 'https://cinesrc.st/300726c-prod.js' -o /tmp/crypto.js
          curl -fsSL --max-time 30 'https://cinesrc.st/donut.js' -o /tmp/donut.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ORIGIN='https://cinesrc.st', PAGE=ORIGIN+'/embed/movie/157336';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const listeners={}; let api=null;
          function addEventListener(n,fn){(listeners[n]||(listeners[n]=[])).push(fn)}
          function removeEventListener(n,fn){if(listeners[n])listeners[n]=listeners[n].filter(x=>x!==fn)}
          function dispatchEvent(ev){for(const fn of (listeners[ev.type]||[]).slice())try{fn(ev)}catch{};return true}
          class CE{constructor(type,opt){this.type=type;this.detail=opt&&opt.detail}}
          const g={console:{log(){},error(){}},setTimeout,clearTimeout,setInterval,clearInterval,TextEncoder,TextDecoder,URL,URLSearchParams,
            atob:s=>Buffer.from(s,'base64').toString('binary'),btoa:s=>Buffer.from(s,'binary').toString('base64'),
            crypto:require('crypto').webcrypto,WebAssembly,CustomEvent:CE,Event:CE,
            addEventListener,removeEventListener,dispatchEvent,fetch,
            location:{origin:ORIGIN,href:PAGE,pathname:'/embed/movie/157336',search:''},
            navigator:{userAgent:UA,language:'en-US',languages:['en-US','en']},performance:{now:()=>Date.now()}};
          g.window=g;g.self=g;g.globalThis=g;
          g.document={createElement:()=>({style:{},setAttribute(){},appendChild(){},remove(){}}),head:{appendChild(){}},body:{appendChild(){}},documentElement:{},querySelector:()=>null,querySelectorAll:()=>[],addEventListener,removeEventListener};
          addEventListener('_cs',ev=>{if(ev&&ev.detail&&g[ev.detail])api=g[ev.detail]});
          const ctx=vm.createContext(g);
          vm.runInContext(fs.readFileSync('/tmp/crypto.js','utf8'),ctx,{timeout:10000});
          vm.runInContext(fs.readFileSync('/tmp/donut.js','utf8'),ctx,{timeout:10000});
          process.stdout.write('API_KEYS '+JSON.stringify(api&&Object.keys(api))+' DONUT '+JSON.stringify(g.__ss2_challenge&&Object.keys(g.__ss2_challenge))+'\n');

          function b64url(s){return Buffer.from(s).toString('base64').replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
          const jar={};
          function addCookies(res){
            const arr=typeof res.headers.getSetCookie==='function'?res.headers.getSetCookie():[];
            for(const x of arr){const p=x.split(';')[0],i=p.indexOf('=');if(i>0)jar[p.slice(0,i)]=p.slice(i+1)}
          }
          function cookie(){return Object.keys(jar).map(k=>k+'='+jar[k]).join('; ')}
          async function main(){
            const q=b64url(JSON.stringify(['movie','157336',null,null]));
            const boot=await fetch(ORIGIN+'/api/c/bootstrap',{method:'POST',headers:{'User-Agent':UA,'x-cs-q':q}});
            addCookies(boot); const bj=await boot.json();
            process.stdout.write('BOOT '+boot.status+' COOKIE_KEYS '+Object.keys(jar).join(',')+'\n');
            const native=fetch;
            async function wrapped(input,opt){
              let url=typeof input==='string'?input:String(input&&input.url||input); if(url.startsWith('/'))url=ORIGIN+url;
              const u=new URL(url,ORIGIN); opt=Object.assign({},opt||{});
              const h=new Headers(opt.headers||{});h.set('User-Agent',UA);h.set('Cookie',cookie());
              if(u.pathname==='/api/c/issue'||u.pathname==='/api/c/stage2/issue'){
                h.set('x-cs-r',bj.r);h.set('x-cs-q',q);if(u.pathname==='/api/c/issue')h.set('x-cs-p',bj.p);
              }
              opt.headers=h;
              const r=await native(url,opt);addCookies(r);
              process.stdout.write('FETCH '+u.pathname+' '+r.status+' COOKIES '+Object.keys(jar).length+'\n');
              return r;
            }
            g.fetch=wrapped;ctx.fetch=wrapped;
            try{const v=await api.gc();process.stdout.write('GC1_OK '+String(v).slice(0,120)+' LEN '+String(v).length+'\n')}
            catch(e){process.stdout.write('GC1_ERR name='+String(e&&e.name)+' msg='+String(e&&e.message||e).slice(0,800)+'\n')}
            try{const v=await g.__ss2_challenge.gc();process.stdout.write('GC2_OK '+String(v).slice(0,120)+' LEN '+String(v).length+'\n')}
            catch(e){process.stdout.write('GC2_ERR name='+String(e&&e.name)+' msg='+String(e&&e.message||e).slice(0,800)+'\n')}
          }
          main().catch(e=>{process.stdout.write('FATAL '+String(e&&e.message||e).slice(0,1000)+'\n');process.exit(1)});
          NODE
