name: CineSrc S5 Trace
on:
  push:
    paths:
      - '.github/workflows/cinesrc-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test CineSrc crypto script without browser DOM
        shell: bash
        run: |
          set -e
          curl -fsSL --max-time 30 'https://cinesrc.st/300726c-prod.js' -o /tmp/crypto.js
          curl -fsSL --max-time 30 'https://cinesrc.st/donut.js' -o /tmp/donut.js
          echo "CRYPTO_SIZE $(wc -c < /tmp/crypto.js)"
          echo "DONUT_SIZE $(wc -c < /tmp/donut.js)"
          echo '=== crypto api/browser signals ==='
          grep -oEi 'window\.[A-Za-z0-9_$]+|document\.[A-Za-z0-9_$]+|navigator\.[A-Za-z0-9_$]+|crypto\.[A-Za-z0-9_$]+|WebAssembly|CustomEvent|addEventListener|dispatchEvent|TextEncoder|TextDecoder|atob|btoa' /tmp/crypto.js | sort -u | head -200 || true
          echo '=== donut signals ==='
          grep -oEi 'window\.[A-Za-z0-9_$]+|document\.[A-Za-z0-9_$]+|navigator\.[A-Za-z0-9_$]+|crypto\.[A-Za-z0-9_$]+|WebAssembly|CustomEvent|addEventListener|dispatchEvent|TextEncoder|TextDecoder|atob|btoa' /tmp/donut.js | sort -u | head -200 || true
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const listeners={};
          function addEventListener(n,fn){(listeners[n]||(listeners[n]=[])).push(fn)}
          function removeEventListener(n,fn){if(listeners[n])listeners[n]=listeners[n].filter(x=>x!==fn)}
          function dispatchEvent(ev){for(const fn of (listeners[ev.type]||[]).slice())try{fn(ev)}catch(e){console.log('LISTENER_ERR',e.message)};return true}
          class CE{constructor(type,opt){this.type=type;this.detail=opt&&opt.detail}}
          const g={
            console,
            setTimeout,clearTimeout,setInterval,clearInterval,
            TextEncoder,TextDecoder,URL,URLSearchParams,
            atob:s=>Buffer.from(s,'base64').toString('binary'),
            btoa:s=>Buffer.from(s,'binary').toString('base64'),
            crypto:require('crypto').webcrypto,
            WebAssembly,
            CustomEvent:CE,
            Event:CE,
            addEventListener,removeEventListener,dispatchEvent,
            fetch,
            location:{origin:'https://cinesrc.st',href:'https://cinesrc.st/embed/movie/157336',pathname:'/embed/movie/157336',search:''},
            navigator:{userAgent:'Mozilla/5.0',language:'en-US',languages:['en-US','en']},
            performance:{now:()=>Date.now()},
          };
          g.window=g; g.self=g; g.globalThis=g;
          g.document={
            createElement:()=>({style:{},setAttribute(){},appendChild(){},remove(){}}),
            head:{appendChild(){}},body:{appendChild(){}},
            documentElement:{},
            querySelector:()=>null,querySelectorAll:()=>[],
            addEventListener,removeEventListener
          };
          const ctx=vm.createContext(g);
          try{
            vm.runInContext(fs.readFileSync('/tmp/crypto.js','utf8'),ctx,{timeout:10000});
            console.log('CRYPTO_LOADED');
            console.log('GLOBALS',Object.keys(g).filter(k=>/^__|^cs|cine/i.test(k)).slice(0,100));
          }catch(e){console.log('CRYPTO_ERR',e && e.stack || e)}
          try{
            vm.runInContext(fs.readFileSync('/tmp/donut.js','utf8'),ctx,{timeout:10000});
            console.log('DONUT_LOADED',!!g.__ss2_challenge, g.__ss2_challenge && Object.keys(g.__ss2_challenge));
          }catch(e){console.log('DONUT_ERR',e && e.stack || e)}
          setTimeout(()=>{
            console.log('AFTER_GLOBALS',Object.keys(g).filter(k=>/^__|^cs|cine/i.test(k)).slice(0,100));
            console.log('SS2',!!g.__ss2_challenge,g.__ss2_challenge&&Object.keys(g.__ss2_challenge));
          },1000);
          NODE
