name: Diagnose DahmerMovies
on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/diagnose-dahmermovies.js'
      - '.github/workflows/diagnose-dahmermovies.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node stellar-nuvio/diagnose-dahmermovies.js
