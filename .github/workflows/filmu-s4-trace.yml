name: FilmU S4 Trace
on:
  push:
    paths:
      - '.github/workflows/filmu-s4-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace FilmU bundles and endpoints
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/filmu
          curl -fsSL 'https://embed.filmu.in/movie/157336' -o /tmp/filmu/page.html
          echo '=== SCRIPT SRCS ==='
          grep -oE '<script[^>]+src="[^"]+"' /tmp/filmu/page.html | sed -E 's/.*src="([^"]+)"/\1/' | head -50 || true
          echo '=== LINK HREFS ==='
          grep -oE '<link[^>]+href="[^"]+"' /tmp/filmu/page.html | sed -E 's/.*href="([^"]+)"/\1/' | head -80 || true
          python3 - <<'PY'
          import re, urllib.parse, requests, os
          html=open('/tmp/filmu/page.html',encoding='utf-8').read()
          urls=[]
          for m in re.finditer(r'<script[^>]+src="([^"]+)"',html):
              urls.append(urllib.parse.urljoin('https://embed.filmu.in/movie/157336',m.group(1)))
          for i,u in enumerate(urls):
              try:
                  r=requests.get(u,timeout=20)
                  print('FETCH',i,r.status_code,u,len(r.content))
                  if r.ok:
                      fn=f'/tmp/filmu/js{i}.js'
                      open(fn,'wb').write(r.content)
              except Exception as e:
                  print('ERR',u,e)
          print('COUNT',len(urls))
          PY
          echo '=== ENDPOINT HITS ==='
          grep -RoiE 'https?://[^"''' )]+' /tmp/filmu/*.js 2>/dev/null | grep -Ei 'api|scrape|source|stream|server|singular|pulsar|allmovie|vid|player' | head -300 || true
          echo '=== KEYWORD CONTEXT ==='
          grep -RinE 'singular|pulsar|allmovieland|server|source|stream|movie|tmdb|imdb|api/' /tmp/filmu/*.js 2>/dev/null | head -400 || true
