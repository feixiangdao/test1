name: Flixer live ciphertext local parity
on:
  push:
    branches: [flixer-provider-lab-20261008]
    paths:
      - 'flixer-provider-lab/capture-live-fixture.mjs'
      - 'flixer-provider-lab/build-local.mjs'
      - 'flixer-provider-lab/local-protocol.js'
      - 'flixer-provider-lab/local-protocol.js'
      - 'flixer-provider-lab/local-environment.js'
      - 'flixer-provider-lab/pack-local.mjs'
      - 'flixer-provider-lab/test-local-bundle.mjs'
      - 'flixer-provider-lab/test-local-live.mjs'
      - 'flixer-provider-lab/test-quickjs-cipher.mjs'
      - '.github/workflows/flixer-live-parity.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --no-save binaryen@132.0.0 playwright hermes-parser quickjs-emscripten terser
          npx playwright install --with-deps chromium
      - name: Capture current Flixer encrypted fixture with headed Chromium
        env:
          FLIXER_HEADFUL: '1'
        run: xvfb-run -a node flixer-provider-lab/capture-live-fixture.mjs
      - name: Fetch current Flixer WASM
        run: |
          set -euo pipefail
          H=plsdontscrapemelove.flixer.su
          IP=$(curl -fsSL --retry 2 --max-time 8 "https://dns.google/resolve?name=$H&type=A&cd=true" | jq -r '.Answer // [] | map(select(.type == 1)) | .[0].data // empty')
          test -n "$IP"
          curl -fsSL --retry 2 --max-time 20 --resolve "$H:443:$IP" "https://$H/assets/wasm/img_data_bg.wasm" -o /tmp/flixer-img-data.wasm
          curl -fsSL --retry 2 --max-time 20 --resolve "$H:443:$IP" "https://$H/assets/wasm/img_data.js" -o /tmp/flixer-img-data.js
      - name: Verify live decryption using JS translation
        run: |
          node node_modules/binaryen/bin/wasm-opt /tmp/flixer-img-data.wasm --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --llvm-nontrapping-fptoint-lowering --llvm-memory-copy-fill-lowering -o /tmp/flixer-lowered.wasm
          node node_modules/binaryen/bin/wasm2js /tmp/flixer-lowered.wasm --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -o /tmp/flixer-wasm-translation.mjs
          node flixer-provider-lab/build-local.mjs
      - name: Pack and validate single-file Local Provider against current Alpha media
        run: |
          node flixer-provider-lab/pack-local.mjs
          node --check /tmp/flixer-local-candidate.js
          node -e 'const {parse}=require("hermes-parser");const fs=require("fs");const s=fs.readFileSync("/tmp/flixer-local-candidate.js","utf8");parse(s,{sourceType:"script"});console.log("LOCAL_BUNDLE_HERMES_PARSE_PASS",s.length)'
          node flixer-provider-lab/test-local-bundle.mjs
      - name: Decode same-version real HLS ciphertext in QuickJS
        run: node flixer-provider-lab/test-quickjs-cipher.mjs
      - name: Verify unsigned-secret-free direct Node network retrieval from local Provider
        run: node flixer-provider-lab/test-local-live.mjs
      - name: Publish verified single-file Local provider to development branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/flixer-local-only-20261008:refs/remotes/origin/flixer-local-only-20261008
          git switch -C flixer-local-only-20261008 origin/flixer-local-only-20261008
          mkdir -p flixer-local/providers
          node --input-type=module - <<'NODE'
          import {readFile,writeFile} from "node:fs/promises";
          import {minify} from "terser";
          const input=await readFile("/tmp/flixer-local-candidate.js","utf8");
          const out=await minify(input,{ecma:2018,module:false,toplevel:false,compress:{passes:2},mangle:{toplevel:false},format:{comments:false}});
          if(!out.code)throw Error("FLIXER_MINIFY_EMPTY");
          const bytes=Buffer.byteLength(out.code);
          if(bytes>=450000)throw Error("FLIXER_MINIFIED_TOO_LARGE_"+bytes);
          await writeFile("flixer-local/providers/flixer-local-live-alpha.js",out.code+"\n");
          console.log("FLIXER_PUBLISHED_LOCAL_MINIFIED_BYTES",bytes);
          NODE
          node --check flixer-local/providers/flixer-local-live-alpha.js
          FLIXER_SCRIPT_PATH=flixer-local/providers/flixer-local-live-alpha.js node flixer-local/check-quickjs.mjs | tee /tmp/flixer-mini-quickjs.log
          grep -q 'QUICKJS_KEY_RESULT.*length.*64' /tmp/flixer-mini-quickjs.log
          if grep -Eq 'QUICKJS_EVALUATION_ERROR|QUICKJS_HOST_EXCEPTION' /tmp/flixer-mini-quickjs.log; then exit 1; fi
          git add flixer-local/providers/flixer-local-live-alpha.js
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested standalone Flixer Local Alpha candidate"
            git push origin HEAD:refs/heads/flixer-local-only-20261008
          fi
