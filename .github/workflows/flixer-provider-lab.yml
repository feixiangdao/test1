name: Flixer provider lab
on:
  push:
    branches:
      - flixer-provider-lab-20261008
    paths:
      - flixer-provider-lab/**
      - .github/workflows/flixer-provider-lab.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Analyze browser WebAssembly boundary
        run: |
          node flixer-provider-lab/inspect-wasm.mjs
          ls -lh /tmp/flixer-img-data.wasm /tmp/flixer-tmdb-image-enhancer.js || true
          if command -v wasm2js >/dev/null; then wasm2js --version; fi
      - name: Evaluate modern Binaryen Wasm-to-JS translation
        run: |
          npm install --no-save binaryen@132.0.0
          echo MODERN_BIN_DIR
          ls -la node_modules/binaryen/bin/ | head -18
          node node_modules/binaryen/bin/wasm2js --version || true
          node node_modules/binaryen/bin/wasm-opt --version || true
          node node_modules/binaryen/bin/wasm-opt /tmp/flixer-img-data.wasm --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --llvm-nontrapping-fptoint-lowering --llvm-memory-copy-fill-lowering -o /tmp/flixer-lowered.wasm
          echo LOWERED_WASM
          wc -c /tmp/flixer-img-data.wasm /tmp/flixer-lowered.wasm
          node node_modules/binaryen/bin/wasm2js /tmp/flixer-lowered.wasm --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -o /tmp/flixer-wasm-translation.mjs
          echo MODERN_WASM2JS_OUTPUT_SIZE
          wc -c /tmp/flixer-wasm-translation.mjs
          node --check /tmp/flixer-wasm-translation.mjs
          echo WASM2JS_HEAD_BEGIN
          head -c 1300 /tmp/flixer-wasm-translation.mjs
          echo WASM2JS_HEAD_END
          echo WASM2JS_TAIL_BEGIN
          tail -c 1400 /tmp/flixer-wasm-translation.mjs
          echo WASM2JS_TAIL_END
          node --input-type=module -e 'const x=await import("file:///tmp/flixer-wasm-translation.mjs");console.log("WASM2JS_MODULE_EXPORTS",JSON.stringify(Object.keys(x).slice(0,35)))'
          node --input-type=module -e 'import fs from "node:fs";let s=fs.readFileSync("/tmp/flixer-wasm-translation.mjs","utf8");console.log("JS_COMPAT_PROFILE",JSON.stringify({bytes:s.length,hasNativeWasm:s.includes("WebAssembly."),hasBrowserDOM:/\\b(?:window|document|navigator)\\b/.test(s),hasNodeRequire:/\\brequire\\(/.test(s),usesBigInt:/\\bBigInt\\b/.test(s)}))'

      - name: Validate experimental provider and resolver
        if: false
        run: |
          node --check flixer-provider-lab/resolver.mjs
          node --check flixer-provider-lab/providers/flixer-local.js
          PORT=8833 MAX_WAIT_MS=9000 node flixer-provider-lab/resolver.mjs > /tmp/flixer-resolver.log 2>&1 &
          pid=$!
          trap 'cat /tmp/flixer-resolver.log || true; kill $pid || true' EXIT
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8833/health > /dev/null; then break; fi
            sleep 1
          done
          node --input-type=module -e 'const r = await fetch("http://127.0.0.1:8833/resolve/movie/9502"); const d = await r.json(); if (!r.ok || !d.streams?.some(s => s.url.endsWith(".m3u8"))) { console.error(d); process.exit(1); } console.log("Resolver accepted TMDB 9502 and returned HLS:",d.streams.length,"available variants:",d.variants?.length||0);'
      - name: Inspect Flixer player JavaScript
        if: false
        run: node flixer-provider-lab/analyze.mjs
      - name: Inspect Flixer movie player
        if: false
        run: node flixer-provider-lab/probe.mjs
