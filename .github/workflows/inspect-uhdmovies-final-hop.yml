name: Inspect UHDMovies Final Hop

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-uhdmovies-final-hop.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install cheerio-without-node-native@0.20.2 crypto-js@4.2.0 --no-save
      - name: Fetch provider
        run: |
          mkdir -p ./_probe/providers
          curl -fsSL https://raw.githubusercontent.com/yoruix/nuvio-providers/main/providers/uhdmovies.js -o ./_probe/providers/uhdmovies.js
      - name: Inspect final hop
        run: |
          node - <<'NODE'
          const cheerio=require('cheerio-without-node-native');
          const p=require('./_probe/providers/uhdmovies.js');
          function updateJar(jar,res){
            let arr=[]; try{arr=res.headers.getSetCookie?res.headers.getSetCookie():[]}catch(_){}
            for(const raw of arr){
              const first=raw.split(';')[0]; const p=first.indexOf('='); if(p<0)continue;
              const k=first.slice(0,p).trim(),v=first.slice(p+1).trim();
              if(!v||/deleted/i.test(v)) delete jar[k]; else jar[k]=v;
            }
          }
          function jarText(jar){return Object.entries(jar).map(([k,v])=>k+'='+v).join('; ')}
          function absolutize(u,base){try{return new URL(u,base).toString()}catch(_){return u}}
          async function walk(start){
            let url=start, method='GET', body=null, jar={}, referer='';
            for(let step=0;step<8;step++){
              const headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'};
              const cookie=jarText(jar); if(cookie)headers.Cookie=cookie;
              if(referer)headers.Referer=referer;
              if(method==='POST')headers['Content-Type']='application/x-www-form-urlencoded';
              const r=await fetch(url,{method,headers,body,redirect:'manual',signal:AbortSignal.timeout(12000)});
              updateJar(jar,r);
              const loc=r.headers.get('location');
              const ct=r.headers.get('content-type')||'';
              console.log('STEP',step,method,r.status,ct,'url',url,'loc',loc,'cookie',jarText(jar));
              if(loc){referer=url;url=absolutize(loc,url);method='GET';body=null;continue}
              if(!ct.toLowerCase().includes('text/html')){
                console.log('FINAL-NONHTML',url,r.status,ct);return url;
              }
              const t=await r.text();
              console.log('HTML',step,t.slice(0,2500).replace(/\n/g,'\\n'));
              const $=cheerio.load(t);
              const scripts=$('script').get().map(el=>$(el).html()||'').filter(x=>/_lp_|lp-|hop|token|countdown|location|replace\(|go=|setTimeout|setInterval/i.test(x));
              const anchors=$('a[href]').get().map(el=>({text:$(el).text().trim().slice(0,80),href:$(el).attr('href')})).filter(x=>/lp|go=|continue|download|next|redirect/i.test((x.text||'')+' '+(x.href||'')));
              const metas=$('meta[http-equiv="refresh"]').get().map(el=>$(el).attr('content')||'');
              console.log('SIGNALS',step,JSON.stringify({scripts:scripts.slice(0,12),anchors:anchors.slice(0,30),metas},null,2));
              const lpGo=t.match(/setAttribute\(\s*['"]href['"]\s*,\s*["']([^"']*\?lp_go=[^"']+)["']\s*\)/i);
              const lpCookie=t.match(/\bsc\(\s*["']([^"']+)["']\s*,\s*["']([^"']+)["']\s*,\s*\d+\s*\)/i);
              if(lpGo && lpCookie){
                const ck=lpCookie[1],cv=lpCookie[2].replace(/\\\//g,'/');
                jar[ck]=cv;
                const go=lpGo[1].replace(/\\\//g,'/');
                console.log('LP-GO',step,ck,go);
                referer=url;url=absolutize(go,url);method='GET';body=null;continue;
              }
              const forms=$('form').get().map(el=>{
                const $f=$(el), data={};
                $f.find('input[name]').each((_,inp)=>{data[$(inp).attr('name')]=$(inp).attr('value')||''});
                return {el,id:$f.attr('id')||'',action:$f.attr('action')||'',method:($f.attr('method')||'GET').toUpperCase(),data};
              });
              console.log('FORMS',step,forms.map(f=>({id:f.id,action:f.action,method:f.method,names:Object.keys(f.data)})));
              const chosen=forms.find(f=>Object.keys(f.data).some(k=>k.indexOf('_lp_')===0)||/^lp-/i.test(f.id));
              if(chosen){
                const form=$(chosen.el);
                const action=absolutize(form.attr('action')||url,url);
                const data=chosen.data;
                console.log('FORM',step,chosen.id,action,JSON.stringify(data));
                referer=url;url=action;method=chosen.method;
                if(method==='POST')body=new URLSearchParams(data).toString();
                else {const u=new URL(url);Object.entries(data).forEach(([k,v])=>u.searchParams.set(k,v));url=u.toString();body=null}
                continue;
              }
              const meta=$('meta[http-equiv="refresh"]').attr('content')||'';
              const mm=meta.match(/url\s*=\s*(.+)$/i);
              if(mm){referer=url;url=absolutize(mm[1].replace(/^['"]|['"]$/g,''),url);method='GET';body=null;continue}
              const js=t.match(/(?:window\.)?location(?:\.href)?\s*=\s*['"]([^'"]+)['"]|location\.replace\(\s*['"]([^'"]+)['"]\s*\)/i);
              const jsTarget=js&&(js[1]||js[2]);
              if(jsTarget && !/[{}]/.test(jsTarget)){referer=url;url=absolutize(jsTarget,url);method='GET';body=null;continue}
              console.log('STOP-NO-NEXT',url);return null;
            }
            return null;
          }
          (async()=>{
            const rows=await p.getStreams('550','movie');
            console.log('ROWS',rows.length);
            for(const [i,x] of rows.slice(0,3).entries()){
              console.log('ROW',i,JSON.stringify(x));
              try{const final=await walk(x.url);console.log('FINAL',i,final)}
              catch(e){console.log('ERR',i,e.stack||e.message)}
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
