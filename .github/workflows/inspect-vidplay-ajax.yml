name: Inspect VidPlay AJAX
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/inspect-ajax.cjs'
      - '.github/workflows/inspect-vidplay-ajax.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node vidplay-nuvio/inspect-ajax.cjs
