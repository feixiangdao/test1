name: Nuvio offline provider static checks
on:
  push:
    paths:
      - 'novipnoad-site-diagnostic/offline-probe.js'
      - 'novipnoad-site-diagnostic/offline-runtime/manifest.json'
      - 'tests/check_nuvio_offline_probe.py'
      - 'tests/check_nuvio_offline_runtime.cjs'
      - 'tests/check_nuvio_provider_manifests.py'
      - 'tests/nuvio_manifest_projects.json'
      - 'tests/check_all_enabled_nuvio_syntax.cjs'
      - 'tests/check_all_enabled_nuvio_exports.cjs'
      - 'tests/check_all_enabled_nuvio_missing_id.cjs'
      - 'tests/check_nuvio_provider_entrypoints.cjs'
      - 'tests/check_yflix_s1_mock.cjs'
      - 'tests/check_nuvio_network_failures.cjs'
      - 'tests/check_novipnoad_secret_redaction.cjs'
      - 'novipnoad-nuvio/**'
      - 'yesmovies-nuvio/**'
      - 'yflix-nuvio/**'
      - 'noctratv-nuvio/**'
      - 'stellar-nuvio/**'
      - 'cinejoy-nuvio/**'
      - 'onlyflix-nuvio/**'
      - 'cinevibe-nuvio/**'
      - 'kisskh-nuvio/**'
      - 'vidplay-nuvio/**'
      - 'flixbaba-nuvio/**'
      - '.github/workflows/nuvio-offline-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and zero-network diagnostics
        run: python3 tests/check_nuvio_offline_probe.py
      - name: Validate production provider manifests
        run: python3 tests/check_nuvio_provider_manifests.py
      - name: Parse every enabled Provider JS without execution
        run: node tests/check_all_enabled_nuvio_syntax.cjs
      - name: Load every enabled Provider module without I/O
        run: node tests/check_all_enabled_nuvio_exports.cjs
      - name: Audit missing TMDB ID across all enabled providers
        run: node tests/check_all_enabled_nuvio_missing_id.cjs
      - name: Exercise provider entrypoints without network
        run: node tests/check_nuvio_provider_entrypoints.cjs
      - name: Verify provider network failure isolation
        run: node tests/check_nuvio_network_failures.cjs
      - name: Verify NOVIPNOAD synthetic secrets never leak in offline errors
        run: node tests/check_novipnoad_secret_redaction.cjs
      - name: Check JavaScript syntax
        run: node --check novipnoad-site-diagnostic/offline-probe.js
      - name: Mock YFlix S1 success and failure responses
        run: node tests/check_yflix_s1_mock.cjs
      - name: Exercise offline getStreams output
        run: node tests/check_nuvio_offline_runtime.cjs
      - name: Publish verification scope
        if: always()
        run: |
          {
            echo '## Nuvio automated regression checks'
            echo ''
            echo '- Manifest and enabled source path checks: 11 Nuvio projects.'
            echo '- JavaScript syntax parse for every enabled Provider (no execution).'
            echo '- Isolated module-load check and getStreams export validation for every enabled Provider.'
            echo '- Offline module loading and missing-identifier handling.'
            echo '- Network unavailable: 6 scrapers x movie/TV = 12 scenarios.'
            echo '- NOVIPNOAD synthetic Cookie and API key are not revealed in offline diagnostics.'
            echo '- YFlix S1: deterministic mocked HTTP response cases.'
            echo '- Offline Runtime Probe: two synthetic rows.'
            echo ''
            echo '**Limitations:** No Android emulator control, live media access, or playback verification.'
            echo 'Review the individual job steps for pass/fail results.'
          } >> "$GITHUB_STEP_SUMMARY"
