name: Probe CineFreak and CTGMovies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-cinefreak-ctgmovies.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch providers
        run: |
          mkdir -p ./_probe
          curl -fsSL https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/main/providers/cinefreak.js -o ./_probe/cinefreak.js
          curl -fsSL https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/main/providers/ctgmovies.js -o ./_probe/ctgmovies.js
      - name: Probe providers
        run: |
          node - <<'NODE'
          const providers={
            cinefreak:require('./_probe/cinefreak.js'),
            ctgmovies:require('./_probe/ctgmovies.js')
          };
          async function verify(label,row){
            if(!row||!row.url)return;
            try{
              const h={...(row.headers||{})};
              if(!h['User-Agent']&&!h['user-agent'])h['User-Agent']='Mozilla/5.0 (Linux; Android 14) Chrome/141 Mobile Safari/537.36';
              h.Range='bytes=0-2047';
              const r=await fetch(row.url,{headers:h,redirect:'manual',signal:AbortSignal.timeout(8000)});
              const ct=r.headers.get('content-type')||'';
              const loc=r.headers.get('location')||'';
              let prefix='',bytes=0;
              if(r.status===200||r.status===206){
                const b=Buffer.from(await r.arrayBuffer());
                bytes=b.length;
                prefix=b.subarray(0,96).toString('utf8').replace(/\s+/g,' ');
              }
              console.log('MEDIA',label,r.status,ct,new URL(row.url).host,'loc',loc?new URL(loc,row.url).host:'','bytes',bytes,'prefix',prefix);
            }catch(e){console.log('MEDIAERR',label,e.message)}
          }
          async function one(name,label,id,type,s,e){
            const p=providers[name];
            try{
              const rows=await Promise.race([
                p.getStreams(id,type,s,e),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider timeout')),30000))
              ]);
              console.log('ROWS',name,label,(rows||[]).length,(rows||[]).slice(0,8).map(x=>({
                name:x.name,title:x.title,quality:x.quality,
                host:(()=>{try{return new URL(x.url).host}catch(_){return''}})()
              })));
              for(const x of (rows||[]).slice(0,3))await verify(name+' '+label,x);
            }catch(e){console.log('ERR',name,label,e.message)}
          }
          (async()=>{
            const tests=[
              ['Fight Club','550','movie'],
              ['Inception','27205','movie'],
              ['GOT S1E1','1399','tv',1,1],
              ['Squid Game S1E1','93405','tv',1,1]
            ];
            for(const name of Object.keys(providers)){
              for(const t of tests)await one(name,...t);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
