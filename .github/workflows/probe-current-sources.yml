name: Probe Current Stellar Sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/probe-current-sources.js'
      - '.github/workflows/probe-current-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node stellar-nuvio/probe-current-sources.js
