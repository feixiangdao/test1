name: Probe DVDPlay Coverage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-dvdplay-coverage.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone current Nuvio providers
        run: |
          git clone --depth 1 --branch main https://github.com/yoruix/nuvio-providers.git /tmp/nuvio-providers
          cd /tmp/nuvio-providers
          npm install --ignore-scripts
      - name: Probe coverage and direct Pixeldrain media
        working-directory: /tmp/nuvio-providers
        run: |
          node - <<'NODE'
          const p=require('./providers/dvdplay.js');
          global.URL_VALIDATION_ENABLED=false;
          async function one(type,id,s,e,label){
            const rows=await p.getStreams(id,type,s,e);
            const direct=rows.filter(x=>{try{
              const h=new URL(x.url).host.toLowerCase();
              return h.includes('pixeldrain.net')||h.includes('pixeldrain.dev')||h.includes('cloudflarestorage.com')||h.includes('googleusercontent.com');
            }catch(_){return false}});
            console.log('COVERAGE',label,'all='+rows.length,'direct='+direct.length,direct.slice(0,10).map(x=>({name:x.name,quality:x.quality,host:new URL(x.url).host})));
            let good=0;
            for(const x of direct.slice(0,4)){
              try{
                const r=await fetch(x.url,{headers:{Range:'bytes=0-4095','User-Agent':'Mozilla/5.0'},redirect:'manual',signal:AbortSignal.timeout(15000)});
                const b=Buffer.from(await r.arrayBuffer()),ct=r.headers.get('content-type')||'';
                const ok=(r.ok||r.status===206)&&(/video\//i.test(ct)||/application\/octet-stream/i.test(ct)||b.length>=4096);
                if(ok)good++;
                console.log('DIRECT MEDIA',label,x.quality,r.status,ct,new URL(x.url).host,'OK='+ok,'bytes='+b.length);
              }catch(err){console.log('DIRECT ERR',label,err.message)}
            }
            console.log('DIRECT GOOD',label,good);
          }
          (async()=>{
            await one('movie','550',null,null,'Fight Club');
            await one('movie','27205',null,null,'Inception');
            await one('movie','597',null,null,'Titanic');
            await one('movie','155',null,null,'The Dark Knight');
            await one('tv','1399',1,1,'GOT S1E1');
            await one('tv','1396',1,1,'Breaking Bad S1E1');
            await one('tv','93405',1,1,'Squid Game S1E1');
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
