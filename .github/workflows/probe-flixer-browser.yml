name: Probe Flixer in Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - 'flixer-nuvio/probe-flixer-browser.js'
      - '.github/workflows/probe-flixer-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium playback API smoke test
        run: xvfb-run -a node flixer-nuvio/probe-flixer-browser.js
