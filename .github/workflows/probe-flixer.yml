name: Probe Flixer Reachability
on:
  workflow_dispatch:
  push:
    paths:
      - 'flixer-nuvio/probe-flixer.js'
      - 'flixer-nuvio/probe-flixer-deep.js'
      - '.github/workflows/probe-flixer.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Flixer public site
        run: node flixer-nuvio/probe-flixer.js
      - name: Inspect Flixer published frontend scripts
        run: node flixer-nuvio/probe-flixer-deep.js
