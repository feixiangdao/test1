name: Probe Additional Direct Providers 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-more-direct-providers-2.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone providers
        run: |
          git clone --depth 1 --branch main https://github.com/yoruix/nuvio-providers.git /tmp/nuvio-providers
          cd /tmp/nuvio-providers
          npm install --ignore-scripts
      - name: Probe candidates
        working-directory: /tmp/nuvio-providers
        run: |
          node - <<'NODE'
          const specs=[
            ['4khdhub','./providers/4khdhub.js'],
            ['showbox','./providers/showbox.js'],
            ['mycima','./providers/mycima.js'],
            ['movieblast','./providers/movieblast.js']
          ];
          async function media(name,label,x){
            if(!x||!x.url)return;
            try{
              const r=await fetch(x.url,{headers:{...(x.headers||{}),Range:'bytes=0-4095','User-Agent':'Mozilla/5.0'},redirect:'manual',signal:AbortSignal.timeout(12000)});
              const b=Buffer.from(await r.arrayBuffer()),ct=r.headers.get('content-type')||'';
              const p=b.subarray(0,140).toString('utf8').replace(/\s+/g,' ');
              const ok=(r.ok||r.status===206)&&(/#EXTM3U/.test(p)||/<MPD/i.test(p)||/video\//i.test(ct)||/application\/(octet-stream|x-matroska)/i.test(ct)||b.length>=4096);
              console.log('MEDIA',name,label,x.name||'',x.quality||'',r.status,ct,new URL(x.url).host,'OK='+ok,'bytes='+b.length,p);
            }catch(e){console.log('MEDIAERR',name,label,e.message)}
          }
          async function one(name,path){
            let p;try{p=require(path)}catch(e){console.log('LOADERR',name,e.message);return}
            const fn=p.getStreams||p.getShowboxStreams||p.getMycimaStreams;
            console.log('EXPORTS',name,Object.keys(p));
            if(typeof fn!=='function')return;
            for(const q of [['movie','550',null,null,'Fight Club'],['movie','27205',null,null,'Inception'],['tv','1399',1,1,'GOT S1E1'],['tv','93405',1,1,'Squid Game S1E1']]){
              try{
                const rows=await fn(q[1],q[0],q[2],q[3]);
                console.log('ROWS',name,q[4],(rows||[]).length,(rows||[]).slice(0,10).map(x=>({name:x.name,title:x.title,quality:x.quality,host:(()=>{try{return new URL(x.url).host}catch(_){return''}})()})));
                for(const x of (rows||[]).slice(0,4))await media(name,q[4],x);
              }catch(e){console.log('ERR',name,q[4],e.message)}
            }
          }
          (async()=>{for(const s of specs)await one(s[0],s[1])})().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
