name: Quick NetMirror Probe
on:
  push:
    paths:
      - 'stellar-nuvio/probe-netmirror-playlist.js'
      - 'stellar-nuvio/providers/netmirror.js'
      - 'stellar-nuvio/test-netmirror.js'
      - 'stellar-nuvio/live-netmirror.js'
      - '.github/workflows/probe-netmirror-quick.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: NetMirror helper
        working-directory: stellar-nuvio
        run: node test-netmirror.js
      - name: NetMirror live provider
        working-directory: stellar-nuvio
        run: node live-netmirror.js
