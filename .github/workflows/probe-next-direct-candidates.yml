name: Probe Next Direct Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-next-direct-candidates.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch DesiFlix
        run: |
          mkdir -p ./_probe
          curl -fsSL https://raw.githubusercontent.com/NuvioPlugin/All-in-One-Nuvio/main/providers/desiflix.js -o ./_probe/desiflix.js
      - name: Probe DesiFlix
        run: |
          node - <<'NODE'
          const p=require('./_probe/desiflix.js');
          async function one(label,id,type,s,e){
            try{
              const rows=await Promise.race([
                p.getStreams(id,type,s,e),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider timeout')),25000))
              ]);
              console.log('ROWS',label,(rows||[]).length,(rows||[]).slice(0,8).map(x=>({
                name:x.name,quality:x.quality,
                host:(()=>{try{return new URL(x.url).host}catch(_){return''}})()
              })));
              for(const x of (rows||[]).slice(0,3)){
                try{
                  const h={...(x.headers||{}),Range:'bytes=0-2047'};
                  const r=await fetch(x.url,{headers:h,redirect:'manual',signal:AbortSignal.timeout(7000)});
                  const ct=r.headers.get('content-type')||'';
                  let prefix='',bytes=0;
                  if(r.status===200||r.status===206){
                    const b=Buffer.from(await r.arrayBuffer());bytes=b.length;
                    prefix=b.subarray(0,80).toString('utf8').replace(/\s+/g,' ');
                  }
                  console.log('MEDIA',label,r.status,ct,new URL(x.url).host,'bytes',bytes,'prefix',prefix);
                }catch(err){console.log('MEDIAERR',label,err.message)}
              }
            }catch(e){console.log('ERR',label,e.message)}
          }
          (async()=>{
            await one('Fight Club','550','movie');
            await one('GOT S1E1','1399','tv',1,1);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
