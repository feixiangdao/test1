name: Probe NiakVIO VidFast

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-niak-vidfast.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch VidFast bundle
        run: |
          mkdir -p ./_probe
          curl -fsSL https://raw.githubusercontent.com/niakw/NiakVIO/main/providers/vidfast--nuvio--9962970b984ff02a.js -o ./_probe/vidfast.js
      - name: Probe VidFast
        run: |
          node - <<'NODE'
          globalThis.SCRAPER_SETTINGS={};
          globalThis.SCRAPER_ID='vidfast';
          globalThis.TMDB_API_KEY='68e094699525b18a70bab2f86b1fa706';
          global.SCRAPER_SETTINGS=globalThis.SCRAPER_SETTINGS;
          global.SCRAPER_ID=globalThis.SCRAPER_ID;
          global.TMDB_API_KEY=globalThis.TMDB_API_KEY;
          const p=require('./_probe/vidfast.js');
          const fn=p.getStreams||p.default?.getStreams||globalThis.getStreams||global.getStreams;
          async function one(label,id,type,s,e){
            const rows=await Promise.race([fn(id,type,s,e),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),45000))]);
            console.log('ROWS',label,(rows||[]).length,(rows||[]).slice(0,10).map(x=>({name:x.name,title:x.title,quality:x.quality,type:x.type,url:x.url,headers:x.headers})));
            for(const x of (rows||[]).slice(0,4)){
              try{
                const h={...(x.headers||{}),...(x.behaviorHints?.proxyHeaders?.request||{}),Range:'bytes=0-4095'};
                const r=await fetch(x.url,{headers:h,redirect:'manual',signal:AbortSignal.timeout(12000)});
                const ct=r.headers.get('content-type')||'';
                let b=Buffer.alloc(0);
                if(r.status===206||/mpegurl|video|octet|text|json/i.test(ct))b=Buffer.from(await r.arrayBuffer());
                console.log('CHECK',label,r.status,ct,new URL(x.url).host,'bytes',b.length,'prefix',b.subarray(0,100).toString('utf8').replace(/\s+/g,' '));
              }catch(err){console.log('CHECKERR',label,err.message)}
            }
          }
          (async()=>{
            await one('Interstellar','157336','movie');
            await one('Breaking Bad S1E1','1396','tv',1,1);
            await one('Fight Club','550','movie');
            await one('GOT S1E1','1399','tv',1,1);
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
