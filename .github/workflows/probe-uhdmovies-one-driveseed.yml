name: Probe UHDMovies One DriveSeed Chain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-uhdmovies-one-driveseed.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install cheerio-without-node-native@0.20.2 --no-save
      - name: Probe one chain
        run: |
          node - <<'NODE'
          const cheerio=require('cheerio-without-node-native');
          const UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/141 Mobile Safari/537.36';
          const start='https://driveseed.org/r?key=QWNZTTJuWUtPV2w3SU0yT1pIbk9GOGxKM0g1dUFLOEN6UWs3TWZ6S1J3QT0=&id=M0lFejRUQnhWZlVuMUVjMnJKOUpxZGd3bzVENVF4VVo4d1lob01LUVZsNU1iSFA0WmRQajg3T09ZTmRVOGpWTQ==';
          async function txt(url,opt={}){
            const r=await fetch(url,{headers:{'User-Agent':UA,...(opt.headers||{})},redirect:opt.redirect||'follow',signal:AbortSignal.timeout(12000)});
            const t=await r.text(); console.log('GET',url,'=>',r.status,r.url,r.headers.get('content-type'),'len',t.length); return {r,t};
          }
          (async()=>{
            let page=start;
            const a=await txt(start,{headers:{Referer:start}});
            const m=a.t.match(/replace\("([^"]+)"\)/);
            if(m){page=new URL(m[1],start).toString(); console.log('REPLACE',page)}
            const b=page===start?a:await txt(page,{headers:{Referer:start}});
            const $=cheerio.load(b.t);
            console.log('TITLE',$('title').text());
            console.log('QUALITY',$('li.list-group-item').first().text());
            const links=[];
            $('div.text-center > a').each((_,el)=>links.push({text:$(el).text().trim(),href:$(el).attr('href')}));
            console.log('BUTTONS',JSON.stringify(links,null,2));
            for(const l of links.slice(0,8)){
              if(!l.href)continue;
              const u=new URL(l.href,page).toString();
              try{
                const r=await fetch(u,{method:'HEAD',headers:{'User-Agent':UA,Referer:page},redirect:'manual',signal:AbortSignal.timeout(10000)});
                console.log('HEAD',l.text,r.status,r.headers.get('location'),r.headers.get('content-type'),r.headers.get('content-length'),u);
              }catch(e){console.log('HEADERR',l.text,e.message)}
            }
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
