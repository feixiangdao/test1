name: VidPlay V1 alternate public player chain
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/probe-alt-vidsrc.cjs'
      - '.github/workflows/probe-vidplay-alternate.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node vidplay-nuvio/probe-alt-vidsrc.cjs
