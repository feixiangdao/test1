name: VidPlay WASM stability and fallback feasibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/probe-wasm-stability.cjs'
      - '.github/workflows/probe-vidplay-wasm-stability.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node vidplay-nuvio/probe-wasm-stability.cjs
