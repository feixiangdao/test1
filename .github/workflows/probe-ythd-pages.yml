name: Probe VidPlay YTHD current player pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/probe-ythd-pages.cjs'
      - '.github/workflows/probe-ythd-pages.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node vidplay-nuvio/probe-ythd-pages.cjs
