name: Probe ZXC Routes

on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/probe-zxc-route.js'
      - '.github/workflows/probe-zxc-route.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node stellar-nuvio/probe-zxc-route.js
