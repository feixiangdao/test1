name: Quick Screen UHD MoviesMod MoviesDrive

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/quick-screen-direct-3.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install cheerio-without-node-native@0.20.2 crypto-js@4.2.0 --no-save
      - name: Fetch providers
        run: |
          mkdir -p ./_probe/providers
          for f in uhdmovies moviesmod moviesdrive; do
            curl -fsSL "https://raw.githubusercontent.com/yoruix/nuvio-providers/main/providers/$f.js" -o "./_probe/providers/$f.js"
          done
      - name: Quick probe
        run: |
          node - <<'NODE'
          async function check(name){
            try{
              const p=require('./_probe/providers/'+name+'.js');
              const fn=p.getStreams||p.default?.getStreams;
              const rows=await Promise.race([
                fn('550','movie',null,null),
                new Promise((_,rej)=>setTimeout(()=>rej(new Error('provider timeout')),45000))
              ]);
              console.log('ROWS',name,(rows||[]).length,(rows||[]).slice(0,8).map(x=>({name:x.name,quality:x.quality,host:(()=>{try{return new URL(x.url).host}catch(_){return''}})(),title:x.title})));
              for(const x of (rows||[]).slice(0,3)){
                try{
                  const r=await fetch(x.url,{headers:{...(x.headers||{}),Range:'bytes=0-4095','User-Agent':'Mozilla/5.0'},redirect:'manual',signal:AbortSignal.timeout(10000)});
                  const b=Buffer.from(await r.arrayBuffer());
                  console.log('MEDIA',name,x.quality||'',r.status,r.headers.get('content-type'),new URL(x.url).host,'bytes',b.length);
                }catch(e){console.log('MEDIAERR',name,e.message)}
              }
            }catch(e){console.log('ERR',name,e.message)}
          }
          (async()=>{for(const n of ['uhdmovies','moviesmod','moviesdrive'])await check(n)})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
