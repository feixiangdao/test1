name: Research MZone Session

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/research-mzone-session.js'
      - '.github/workflows/research-mzone-session.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe MZone compatibility session
        working-directory: noctratv-nuvio
        run: node research-mzone-session.js
