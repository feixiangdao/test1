name: Research MZone playback v4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-mzone-v4.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract MZone v4 session code
        run: |
          node - <<'NODE'
          const urls=[
            'https://noctratv.com/assets/index-B_JGO8C1.js',
            'https://noctratv.com/assets/pStreamBackend-BO-fiiV-.js'
          ];
          const needles=[
            '/api/player/v4/native',
            '/api/player/v4/ca',
            'mzone-playback-v3:',
            'playbackSessionId',
            'runtimeSessionId',
            'sessionBound',
            'mzoneRouteKey'
          ];
          (async()=>{
            for(const url of urls){
              const r=await fetch(url);
              const s=await r.text();
              console.log('\nASSET '+url+' bytes='+s.length);
              for(const needle of needles){
                let pos=0,n=0;
                while((pos=s.indexOf(needle,pos))>=0 && n<6){
                  n++;
                  const lo=Math.max(0,pos-2600),hi=Math.min(s.length,pos+4200);
                  console.log('\n=== '+needle+' #'+n+' @'+pos+' ===');
                  console.log(s.slice(lo,hi));
                  pos+=needle.length;
                }
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
