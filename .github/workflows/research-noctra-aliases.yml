name: Research NoctraTV aliases

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/research-source-aliases.js'
      - 'noctratv-nuvio/research-tokyo-backends.js'
      - 'noctratv-nuvio/research-tokyo-alias-api.js'
      - '.github/workflows/research-noctra-aliases.yml'

jobs:
  aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe current NoctraTV frontend aliases
        working-directory: noctratv-nuvio
        run: |
          node research-source-aliases.js
          node research-tokyo-backends.js
          node research-tokyo-alias-api.js
