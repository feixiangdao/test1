name: Research Noctra Source Aliases

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/research-source-aliases.js'
      - '.github/workflows/research-noctra-aliases.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan NoctraTV bundles
        working-directory: noctratv-nuvio
        run: node research-source-aliases.js
