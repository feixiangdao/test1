name: Research Noctra ZStream family endpoints
# probe-revision: 2026-10-07

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-noctra-zstream-family-endpoints.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect family dispatch
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36';
          const urls=[
            'https://noctratv.com/assets/pStreamBackend-BO-fiiV-.js',
            'https://noctratv.com/assets/vortexApiSource-B-QupYve.js',
            'https://noctratv.com/assets/index-B_JGO8C1.js'
          ];
          async function txt(u){
            const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'application/javascript,*/*'}});
            if(!r.ok)throw new Error(u+' HTTP '+r.status);
            return r.text();
          }
          function show(s,k){
            const low=s.toLowerCase();
            const pats=[
              'case"'+k+'"',"case '"+k+"'",
              '==="'+k+'"',"== '"+k+"'",
              'family:"'+k+'"',"family:'"+k+"'",
              k+':', '"'+k+'":', "'"+k+"':",
              '/'+k+'/', k+'Resolve', k+'-'
            ];
            const seen=new Set();
            for(const p of pats){
              let at=0,n=0;
              while((at=low.indexOf(p.toLowerCase(),at))>=0&&n<12){
                n++;
                const lo=Math.max(0,at-5000),hi=Math.min(s.length,at+10000);
                const frag=s.slice(lo,hi);
                const key=lo+':'+hi;
                if(!seen.has(key)){
                  seen.add(key);
                  const domains=[...new Set((frag.match(/https?:\\?\/\\?\/[^"'\x60\s)]+/g)||[]).map(x=>x.replace(/\\\//g,'/')))];
                  console.log('\n### '+k+' PATTERN '+p+' @'+at);
                  if(domains.length)console.log('URLS '+domains.join(' | '));
                  console.log(frag.replace(/\s+/g,' '));
                }
                at+=Math.max(1,p.length);
              }
            }
          }
          (async()=>{
            for(const u of urls){
              let s;try{s=await txt(u)}catch(e){console.log('ERR '+u+' '+e.message);continue}
              console.log('\nASSET '+u+' bytes='+s.length);
              for(const k of ['apollo','vienna','chase'])show(s,k);
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
