name: Research Noctra ZStream label map
# probe-revision: 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-noctra-zstream-label-map.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect current Noctra ZStream label mapping
        run: |
          node - <<'NODE'
          const PAGE='https://noctratv.com/watch/movie/238';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36';
          async function txt(u){
            const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'text/html,*/*'}});
            if(!r.ok)throw new Error(u+' HTTP '+r.status);
            return r.text();
          }
          function abs(x,b){try{return new URL(x,b).href}catch{return''}}
          (async()=>{
            const html=await txt(PAGE);
            const set=new Set([...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/ig)].map(m=>abs(m[1],PAGE)));
            [
              'https://noctratv.com/assets/pStreamBackend-BO-fiiV-.js',
              'https://noctratv.com/assets/index-B_JGO8C1.js',
              'https://noctratv.com/assets/vortexApiSource-B-QupYve.js'
            ].forEach(x=>set.add(x));
            for(const u of set){
              let s;try{s=await txt(u)}catch(e){console.log('ERR '+u+' '+e.message);continue}
              const low=s.toLowerCase();
              if(!['apollo','vienna','chase','zstream-apollo','zstream-vienna','zstream-chase'].some(k=>low.includes(k)))continue;
              console.log('\nASSET '+u+' bytes='+s.length);
              for(const k of ['zstream-apollo','zstream-vienna','zstream-chase','apollo','vienna','chase','aspera','aurora','artemis']){
                let at=0,n=0;
                while((at=low.indexOf(k.toLowerCase(),at))>=0 && n<12){
                  n++;
                  const lo=Math.max(0,at-3500),hi=Math.min(s.length,at+7000);
                  console.log('\n=== '+k+' #'+n+' @'+at+' ===');
                  console.log(s.slice(lo,hi).replace(/\s+/g,' '));
                  at+=k.length;
                }
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
