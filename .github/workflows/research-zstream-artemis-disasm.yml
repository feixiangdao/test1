name: Research ZStream Artemis disasm

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-artemis-disasm.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Disassemble Artemis keyless resolver
        run: |
          set -e
          curl -L --fail --retry 2             -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          echo '=== symbols ==='
          nm -nm /tmp/ZStreamNativeSources | egrep 'resolveArtemisKeyless|artemisKeylessHost|zs_.*Resolve' || true
          echo '=== strings context ==='
          strings -a -t x /tmp/ZStreamNativeSources | egrep -C 25 'ArtemisKeylessNative|X-AR-Sig|X-PS-Sig|/android\?|tmdbId|_pk|seasonId|episodeId' || true
          echo '=== disassembly snippets ==='
          otool -tvV /tmp/ZStreamNativeSources > /tmp/dis.txt
          for sym in resolveArtemisKeyless artemisKeylessHost; do
            echo "--- $sym ---"
            grep -n -A220 -B20 "$sym" /tmp/dis.txt | head -260 || true
          done
