name: Research ZStream Artemis signatures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-artemis-signatures.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Dump Artemis signature block and response key bytes
        run: |
          set -e
          curl -L --fail --retry 2             -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          otool -tvV /tmp/ZStreamNativeSources > /tmp/dis.txt
          echo '=== SIGNATURE BLOCK ==='
          awk '$1 >= "000000000001f8a0" && $1 <= "000000000001f980" {print}' /tmp/dis.txt
          echo '=== RESPONSE KEY BYTES ==='
          xxd -g 1 -s 0x130870 -l 0x90 /tmp/ZStreamNativeSources
