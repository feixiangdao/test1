name: Research ZStream Artemis binary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-artemis.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Artemis strings
        run: |
          curl -L --fail --retry 2             -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          strings -a -n 4 /tmp/ZStreamNativeSources > /tmp/s.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/s.txt').read_text(errors='ignore').splitlines()
          needles=['ArtemisKeylessNative','resolveArtemisKeyless','androidMinVersion','X/','streamType":"hls"']
          for nd in needles:
              hits=[i for i,x in enumerate(s) if nd.lower() in x.lower()]
              print('\n###',nd,'hits',len(hits))
              for i in hits[:12]:
                  print('--- line',i+1,'---')
                  for j in range(max(0,i-80),min(len(s),i+81)):
                      print(f'{j+1:7d} {s[j]}')
          PY
