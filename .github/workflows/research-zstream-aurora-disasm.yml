name: Research ZStream Aurora disasm

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-aurora-disasm.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Disassemble Aurora resolver
        run: |
          set -e
          curl -L --fail --retry 2 -o /tmp/ZStreamNativeSources 'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          nm -nm /tmp/ZStreamNativeSources | egrep 'auroraResolve|AuroraNative|zs_.*Resolve' || true
          strings -a -t x /tmp/ZStreamNativeSources | egrep -C 35 'AuroraNative|aurora\.fontaine\.lol|traffic\?ui=|shelf|slot|variant|tmdbId|title|year|token' || true
          echo '=== S_K_TOKEN region ==='
          nm -nm /tmp/ZStreamNativeSources | grep 'S_K_TOKEN' || true
          xxd -g 1 -s 0x130c30 -l 0xc0 /tmp/ZStreamNativeSources || true
          otool -tvV /tmp/ZStreamNativeSources | grep -n -B12 -A20 '130c56\|0xc56' || true
          echo '=== S_K_TOKEN xrefs ==='
          otool -tvV /tmp/ZStreamNativeSources > /tmp/all-dis.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/all-dis.txt').read_text(errors='ignore').splitlines()
          for target in (0x34734,0x884ac):
              print('\n### XREF',hex(target))
              idx=next((i for i,x in enumerate(s) if x.startswith(f'{target:016x}')),None)
              print('IDX',idx)
              if idx is not None:
                  for line in s[max(0,idx-100):idx+180]:
                      print(line)
          PY
          echo '=== symbols around xrefs ==='
          nm -nm /tmp/ZStreamNativeSources | awk '$1 >= "0000000000034000" && $1 <= "0000000000036000" {print} $1 >= "0000000000087000" && $1 <= "000000000008a000" {print}' || true
          echo '=== aurora xor constants 130700 ==='
          xxd -g 1 -s 0x130700 -l 0x80 /tmp/ZStreamNativeSources || true
          echo '=== aurora raw constants ==='
          xxd -g 1 -s 0x130880 -l 0x120 /tmp/ZStreamNativeSources || true
          echo '=== cstring around aurora constants ==='
          strings -a -t x /tmp/ZStreamNativeSources | awk '$1 >= "130800" && $1 <= "130a50" {print}' || true
          otool -tvV /tmp/ZStreamNativeSources > /tmp/dis.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/dis.txt').read_text(errors='ignore').splitlines()
          start=next((i for i,x in enumerate(s) if x.startswith('0000000000021628')),None)
          end=next((i for i,x in enumerate(s) if start is not None and i>start and x.startswith('0000000000027938')),None)
          print('AURORA_BODY_LINES',start,end)
          if start is not None:
              for line in s[start:min(end or len(s),start+1800)]:
                  print(line)
          print('AURORA_SECURITY_BLOCK')
          for line in s:
              if line.startswith('000000000002'):
                  try:
                      a=int(line[:16],16)
                  except:
                      continue
                  if 0x21f50 <= a <= 0x227a0:
                      print(line)
          PY
