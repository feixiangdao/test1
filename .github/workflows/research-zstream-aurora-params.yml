name: Research ZStream Aurora params

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-aurora-params.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Dump Aurora parameter and signature setup
        run: |
          set -e
          curl -L --fail --retry 2 -o /tmp/ZStreamNativeSources 'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          otool -tvV /tmp/ZStreamNativeSources > /tmp/dis.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/dis.txt').read_text(errors='ignore').splitlines()
          ranges=[(0x21628,0x22020),(0x224f8,0x22718)]
          for lo,hi in ranges:
              print(f'=== RANGE {lo:x}-{hi:x} ===')
              for line in lines:
                  if not line.startswith('000000000002'): continue
                  try:a=int(line[:16],16)
                  except:continue
                  if lo<=a<=hi: print(line)
          PY
