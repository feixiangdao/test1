name: Research ZStream Aurora signature

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-aurora-signature.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Dump Aurora signature block
        run: |
          set -e
          curl -L --fail --retry 2 -o /tmp/ZStreamNativeSources 'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          otool -tvV /tmp/ZStreamNativeSources > /tmp/dis.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/dis.txt').read_text(errors='ignore').splitlines()
          for line in lines:
              if not line.startswith('000000000002'):
                  continue
              try:a=int(line[:16],16)
              except:continue
              if 0x22000 <= a <= 0x22820:
                  print(line)
          PY
