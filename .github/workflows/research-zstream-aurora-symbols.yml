name: Research ZStream Aurora Swift symbols

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-aurora-symbols.yml'

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Aurora Swift symbols and metadata
        run: |
          set -e
          curl -L --fail --retry 2 -o /tmp/ZStreamNativeSources 'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          echo '=== nm demangled Aurora/Fontaine ==='
          nm -nm /tmp/ZStreamNativeSources | swift-demangle | egrep -i 'Aurora|Fontaine|NativeSources|StreamSource|availableSources|credential|shelf|slot|variant|token' | head -800 || true
          echo '=== reflection/strings ==='
          strings -a /tmp/ZStreamNativeSources | egrep -i -C 8 'Aurora|Fontaine|credential|shelf|slot|preferredVariant|variantId|token|availableSources' | head -1600 || true
