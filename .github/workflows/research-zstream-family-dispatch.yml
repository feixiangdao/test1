name: Research ZStream family dispatch
# probe-revision: 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-family-dispatch.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current Noctra ZStream dispatch
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36';
          async function txt(u){
            const r=await fetch(u,{headers:{'User-Agent':UA,Accept:'text/javascript,text/html,*/*'}});
            if(!r.ok)throw new Error(u+' HTTP '+r.status);
            return r.text();
          }
          function abs(x,b){try{return new URL(x,b).href}catch{return''}}
          function contexts(s,needle){
            const out=[]; let p=0;
            while(out.length<12){
              const i=s.toLowerCase().indexOf(needle.toLowerCase(),p);
              if(i<0)break;
              const lo=Math.max(0,i-3500),hi=Math.min(s.length,i+9000);
              out.push(s.slice(lo,hi));
              p=i+needle.length;
            }
            return out;
          }
          (async()=>{
            const page='https://noctratv.com/watch/movie/238';
            const html=await txt(page);
            const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/ig)].map(m=>abs(m[1],page));
            const assets=new Set(scripts);
            for(const u of scripts){
              let s='';try{s=await txt(u)}catch{continue}
              for(const m of s.matchAll(/["'](\.\/[^"']+\.js)["']/g))assets.add(abs(m[1],u));
              for(const m of s.matchAll(/["'](assets\/[^"']+\.js)["']/g))assets.add(abs('/'+m[1],'https://noctratv.com/'));
            }
            for(const u of [...assets]){
              if(!/vortexApiSource|pStreamBackend/i.test(u))continue;
              let s;try{s=await txt(u)}catch(e){console.log('ERR '+u+' '+e.message);continue}
              console.log('\nASSET '+u+' bytes='+s.length);
              for(const n of ['apollo','vienna','chase']){
                const cs=contexts(s,n);
                console.log('MATCHES '+n+' '+cs.length);
                cs.forEach((frag,i)=>{
                  const urls=[...new Set((frag.match(/https?:\\?\/\\?\/[^"'\x60\\s)]+/g)||[]).map(x=>x.replace(/\\\//g,'/')))];
                  console.log('\n=== '+n+' #'+(i+1)+' ===');
                  if(urls.length)console.log('URLS '+urls.join(' | '));
                  console.log(frag.replace(/\s+/g,' '));
                });
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
