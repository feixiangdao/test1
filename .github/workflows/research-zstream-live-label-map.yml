name: Research ZStream live label map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-live-label-map.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect zstream.mov frontend bundles
        run: |
          node - <<'NODE'
          const BASE='https://zstream.mov/';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36';
          async function txt(u){
            const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'text/html,application/javascript,*/*'}});
            if(!r.ok)throw new Error(u+' HTTP '+r.status);
            return r.text();
          }
          function abs(x,b){try{return new URL(x,b).href}catch{return''}}
          (async()=>{
            const html=await txt(BASE);
            console.log('HOME bytes='+html.length);
            const assets=new Set();
            for(const m of html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/ig)) assets.add(abs(m[1],BASE));
            for(const m of html.matchAll(/["']([^"']+\.(?:js|mjs)(?:\?[^"']*)?)["']/ig)){
              const u=abs(m[1],BASE); if(u&&new URL(u).hostname===new URL(BASE).hostname)assets.add(u);
            }
            console.log('ASSETS '+assets.size);
            for(const u of assets){
              let s; try{s=await txt(u)}catch(e){console.log('ERR '+u+' '+e.message);continue}
              const low=s.toLowerCase();
              const keys=['apollo','vienna','chase','artemis','aspera','aurora','aphrodite','stellar','nesterov','tokyo'];
              if(!keys.some(k=>low.includes(k)))continue;
              console.log('\nASSET '+u+' bytes='+s.length);
              for(const k of keys){
                let from=0,n=0;
                while((from=low.indexOf(k,from))>=0&&n<15){
                  n++;
                  const lo=Math.max(0,from-3000),hi=Math.min(s.length,from+6500);
                  console.log('\n=== '+k+' #'+n+' @'+from+' ===');
                  console.log(s.slice(lo,hi).replace(/\s+/g,' '));
                  from+=k.length;
                }
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
