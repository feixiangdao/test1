name: Research ZStream live sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-live-sources.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract current source configuration
        run: |
          node - <<'NODE'
          const BASE='https://zstream.mov/';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36';
          async function txt(u){
            const r=await fetch(u,{headers:{'User-Agent':UA,'Accept':'text/html,application/javascript,*/*'}});
            if(!r.ok)throw new Error(u+' HTTP '+r.status);
            return r.text();
          }
          function abs(x,b){try{return new URL(x,b).href}catch{return''}}
          (async()=>{
            const html=await txt(BASE);
            const assets=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/ig)].map(m=>abs(m[1],BASE));
            for(const u of [...new Set(assets)]){
              let s;try{s=await txt(u)}catch(e){continue}
              const low=s.toLowerCase();
              if(!['artemis','aspera','aurora'].some(k=>low.includes(k)))continue;
              console.log('ASSET '+u+' bytes='+s.length);
              for(const k of ['artemis','aspera','aurora']){
                let from=0,n=0;
                while((from=low.indexOf(k,from))>=0&&n<20){
                  n++;
                  const lo=Math.max(0,from-1200),hi=Math.min(s.length,from+2500);
                  const frag=s.slice(lo,hi).replace(/\s+/g,' ');
                  if(/source|scrape|provider|mediaTypes|movie|show|tv|stream/i.test(frag)){
                    console.log('\n=== '+k+' #'+n+' ===');
                    console.log(frag);
                  }
                  from+=k.length;
                }
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
