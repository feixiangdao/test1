name: Research ZStream native mapping

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native-mapping.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download native framework
        run: |
          curl -L --fail --retry 2             -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          strings -a -n 4 /tmp/ZStreamNativeSources > /tmp/zstrings.txt
          nl -ba /tmp/zstrings.txt > /tmp/zlines.txt
      - name: Show source neighborhoods
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/zstrings.txt').read_text(errors='ignore').splitlines()
          needles=[
            'AsperaSource','AuroraSource','ArtemisSource','Magnolia',
            'asperaResolve','auroraResolve','magnoliaResolve',
            '123animehub.cc','api.wingsdatabase.com','db.wingsdatabase.com',
            'db.speedracelight.com','aurora.fontaine.lol',
            'tokyo.fontaine.lol','enc-dec.app/api/enc-vidlink'
          ]
          for needle in needles:
              idx=[i for i,x in enumerate(lines) if needle.lower() in x.lower()]
              print('\n###',needle,'hits',len(idx))
              for n,i in enumerate(idx[:8],1):
                  lo=max(0,i-35); hi=min(len(lines),i+36)
                  print(f'--- hit {n} line {i+1} ---')
                  for j in range(lo,hi):
                      print(f'{j+1:7d} {lines[j]}')
          PY
      - name: Native symbols
        run: |
          (llvm-nm --defined-only /tmp/ZStreamNativeSources 2>/dev/null || nm /tmp/ZStreamNativeSources 2>/dev/null || true)             | grep -iE 'aspera|aurora|artemis|magnolia|cosmic|shibuya|stellar|nesterov|tokyo|aphrodite'             | head -n 1200
