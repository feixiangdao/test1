name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect current ani.pm frontend routes
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://ani.pm/'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.read().decode('utf-8','ignore')
          html=get('https://ani.pm/')
          print('=== ANI HOME LEN',len(html),'===')
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              u=urllib.parse.urljoin('https://ani.pm/',m.group(1))
              if u not in scripts:scripts.append(u)
          print('SCRIPTS',len(scripts))
          for u in scripts: print(u)
          marks=['/api/anime/','servers','providerTitles','routeId','episode','sources','stream','sub','dub','kind','src/']
          for u in scripts:
              try:
                  js=get(u)
              except Exception as e:
                  print('FETCHERR',u,repr(e)); continue
              hits=[]
              low=js.lower()
              for mark in marks:
                  start=0
                  while True:
                      i=low.find(mark.lower(),start)
                      if i<0:break
                      a=max(0,i-260); b=min(len(js),i+520)
                      hits.append(js[a:b].replace('\n',' '))
                      start=i+len(mark)
                      if len(hits)>=40:break
                  if len(hits)>=40:break
              if hits:
                  print('\n=== JS',u,'LEN',len(js),'===')
                  seen=set()
                  for h in hits:
                      if h in seen:continue
                      seen.add(h)
                      print(h)
          PY
