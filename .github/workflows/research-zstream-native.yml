name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Print WatchPlaylistPanel export map
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          u='https://ani.pm/assets/WatchPlaylistPanel-DJKjgIQ0.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://ani.pm/'})
          js=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','ignore')
          print(js[-5000:])
          for name in ['Vr','Ur','Hr','Br','zn']:
              for m in re.finditer(r'(?<![A-Za-z0-9_$])'+name+r'(?![A-Za-z0-9_$])',js):
                  print('\nCTX',name,m.start())
                  print(js[max(0,m.start()-400):m.start()+700])
          PY
