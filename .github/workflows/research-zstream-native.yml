name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe current ani.pm playback bootstrap
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          for U in             'https://ani.pm/api/anime/playback-bootstrap/settlar/6351?ep=1&lang=sub'             'https://ani.pm/api/anime/playback-bootstrap/settlar/frieren-beyond-journeys-end-6351?ep=1&lang=sub'             'https://ani.pm/api/anime/playback-bootstrap/settlar/6351?ep=1&lang=dub'             'https://ani.pm/api/anime/playback-bootstrap/settlar/frieren-beyond-journeys-end-6351?ep=1&lang=dub'
          do
            echo "=== $U ==="
            curl -sS -L --max-time 25 -A "$UA"               -H 'Accept: application/json' -H 'Referer: https://ani.pm/'               -w '\nHTTP_STATUS:%{http_code}\n' "$U" | head -c 30000
            echo
          done
