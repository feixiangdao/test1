name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Clone public ZStream iOS mirror
        run: |
          git clone --depth 1 -b development https://github.com/aaslam12/ZStream-iOS-Mirror-Dev.git /tmp/zstream
      - name: Probe Tokyo live APIs
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          echo '=== TMDB proxy Frieren ==='
          curl -L --max-time 20 -A "$UA" -H 'Referer: https://player.videasy.to/'             'https://db.speedracelight.com/3/tv/209867?append_to_response=external_ids&language=en' | head -c 5000
          echo
          echo '=== ani.pm catalog english ==='
          curl -L --max-time 20 -A "$UA" -H 'Referer: https://ani.pm/'             --get --data-urlencode "q=Frieren: Beyond Journey's End" --data 'page=1'             'https://ani.pm/api/anime/catalog' | head -c 12000
          echo
          echo '=== ani.pm catalog native ==='
          curl -L --max-time 20 -A "$UA" -H 'Referer: https://ani.pm/'             --get --data-urlencode 'q=Sousou no Frieren' --data 'page=1'             'https://ani.pm/api/anime/catalog' | head -c 12000
          echo
          echo '=== ani.pm servers english ==='
          curl -L --max-time 20 -A "$UA" -H 'Referer: https://ani.pm/'             --get --data-urlencode "title=Frieren: Beyond Journey's End" --data 'ep=1'             'https://ani.pm/api/anime/src/servers' | head -c 16000
          echo
          echo '=== ani.pm servers native ==='
          curl -L --max-time 20 -A "$UA" -H 'Referer: https://ani.pm/'             --get --data-urlencode 'title=Sousou no Frieren' --data 'ep=1'             'https://ani.pm/api/anime/src/servers' | head -c 16000
          echo
