name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Map AnimeDetails imported resolver functions
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://ani.pm/'})
              with urllib.request.urlopen(req,timeout=20) as r:return r.read().decode('utf-8','ignore')
          detail=get('https://ani.pm/assets/AnimeDetails-CNwua4lV.js')
          index=get('https://ani.pm/assets/index-CJ_Rq2xX.js')
          print('=== DETAIL HEAD ===')
          print(detail[:12000])
          m=re.search(r'import\{(.+?)\}from"\./index-CJ_Rq2xX\.js"',detail)
          if not m:
              print('IMPORT MAP NOT FOUND');raise SystemExit
          body=m.group(1)
          mapping={}
          for part in body.split(','):
              part=part.strip()
              mm=re.match(r'([^ ]+) as ([^ ]+)$',part)
              if mm:mapping[mm.group(2)]=mm.group(1)
              else:mapping[part]=part
          for local in ['zt','Ds','Os','Ps','Ae']:
              print('MAP',local,'<=',mapping.get(local))
          targets=[mapping.get(x) for x in ['zt','Ds','Os','Ps','Ae'] if mapping.get(x)]
          print('=== INDEX TARGET CONTEXT ===')
          for t in targets:
              pats=[r'function\s+'+re.escape(t)+r'\s*\(',r'(?:const|let|var)\s+'+re.escape(t)+r'\s*=']
              pos=-1
              for p in pats:
                  mm=re.search(p,index)
                  if mm:pos=mm.start();break
              if pos<0:
                  # fallback first token occurrence
                  mm=re.search(r'(?<![A-Za-z0-9_$])'+re.escape(t)+r'(?![A-Za-z0-9_$])',index)
                  pos=mm.start() if mm else -1
              print('\nTARGET',t,'POS',pos)
              if pos>=0:print(index[max(0,pos-2500):min(len(index),pos+7000)])
          print('=== EXPORT TAIL ===')
          print(index[-30000:])
          PY
