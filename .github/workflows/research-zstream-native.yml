name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Tokyo TMDB metadata proxy
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          for ID in 209867 85937 95479 1429
          do
            echo "=== TV $ID ==="
            curl -sS -L --max-time 20               -A "$UA" -H 'Referer: https://player.videasy.to/' -H 'Accept: application/json'               -w '\nHTTP_STATUS:%{http_code}\n'               "https://db.speedracelight.com/3/tv/$ID?append_to_response=external_ids&language=en" | head -c 12000
            echo
          done
