name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe ani.pm formal and preview sessions
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          BASE='https://ani.pm'
          def req(url):
              r=urllib.request.Request(url,headers={
                  'User-Agent':UA,'Referer':BASE+'/','Accept':'application/json'
              })
              with urllib.request.urlopen(r,timeout=35) as x:
                  return x.status,x.read().decode('utf-8','ignore')
          s,b=req(BASE+'/api/anime/playback-bootstrap/settlar/6351?ep=1&lang=sub')
          j=json.loads(b); sel=j.get('settlarSelection','')
          print('BOOT',s,'selection_len',len(sel),'effective',j.get('effectiveLanguage'))
          params=urllib.parse.urlencode({
              'selection':sel,'provider':'anipm','ep':'1','channel':'sub','telemetry':'0'
          })
          for path in ['/api/anime/settlar/session?'+params,
                       '/api/anime/settlar/preview-session?'+params]:
              print('\n===',path.split('?')[0],'===')
              try:
                  st,body=req(BASE+path)
                  print('HTTP',st,'LEN',len(body))
                  print(body[:50000])
              except Exception as e:
                  print('ERR',repr(e))
          PY
