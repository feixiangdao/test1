name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public ZStream native binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/ZStreamNativeSources \
            https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources
          file /tmp/ZStreamNativeSources
          sha256sum /tmp/ZStreamNativeSources

      - name: Extract ordered resolver string contexts
        run: |
          set -euo pipefail
          strings -a -n 3 /tmp/ZStreamNativeSources > /tmp/strings.txt
          nl -ba /tmp/strings.txt > /tmp/numbered.txt

          echo "=== key string contexts ==="
          for needle in \
            'https://zstream.mov' \
            '/api/b/movie/' \
            '/api/b/tv/' \
            'tokyo.fontaine.lol' \
            'aurora.fontaine.lol' \
            'api.wingsdatabase.com' \
            'db.wingsdatabase.com' \
            'db.speedracelight.com' \
            'enc-dec.app/api/enc-vidlink' \
            '123animehub.cc' \
            'ani.pm/api/anime' \
            'anineko.to' \
            'aphrodite-' \
            'stellar-' \
            'nesterov-' \
            'tokyo-' \
            'forbidden (stale version or origin check)'; do
            echo
            echo "##### CONTEXT: $needle #####"
            grep -n -F -m 5 "$needle" /tmp/strings.txt | while IFS=: read -r line rest; do
              start=$(( line > 35 ? line-35 : 1 ))
              end=$(( line+55 ))
              sed -n "${start},${end}p" /tmp/numbered.txt
            done || true
          done

          echo "=== JSON-ish/provider-ish strings ==="
          grep -E '\{"|provider|source|server|variant|quality|language|url|headers|cookie|token|secret|signature|nonce|key' /tmp/strings.txt \
            | grep -viE 'boringssl|swift|certificate|cipher|ssl|x509' \
            | head -n 1600 || true

          echo "=== all resolver-related domains/paths ==="
          grep -Eio 'https?://[^[:space:]"<>]+|([a-z0-9-]+\.)+[a-z]{2,}(/[^[:space:]"<>]*)?|/[A-Za-z0-9_.?=&%:-]{3,}' /tmp/strings.txt \
            | grep -viE 'apple\.com|github\.com|ietf\.org|openssl|boringssl|swift' \
            | sort -u | head -n 1800 || true
