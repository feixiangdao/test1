name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Tokyo metadata fallback and HLS headers
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          ANI='https://ani.pm'
          TMDB='439c478a771f35c05022f9feabcca01c'
          def get(url,headers=None):
              h={'User-Agent':UA,'Accept':'*/*'}
              if headers:h.update(headers)
              q=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(q,timeout=35) as r:
                  return r.status,r.geturl(),dict(r.headers),r.read()
          print('=== TMDB FALLBACK ===')
          try:
              st,final,h,b=get('https://api.themoviedb.org/3/tv/209867?api_key='+TMDB+'&language=en-US')
              j=json.loads(b)
              print('TMDB_HTTP',st,'name',j.get('name'),'original_name',j.get('original_name'),'original_language',j.get('original_language'),'genres',[x.get('name') for x in j.get('genres',[])])
          except Exception as e: print('TMDB_ERR',repr(e))

          st,_,_,b=get(ANI+'/api/anime/playback-bootstrap/settlar/6351?ep=1&lang=sub',{'Referer':ANI+'/','Accept':'application/json'})
          boot=json.loads(b); sel=boot['settlarSelection']
          qs=urllib.parse.urlencode({'selection':sel,'provider':'anipm','ep':'1','channel':'sub','telemetry':'0'})
          st,_,_,b=get(ANI+'/api/anime/settlar/session?'+qs,{'Referer':ANI+'/','Accept':'application/json'})
          emb=json.loads(b)['embedUrl']; tok=urllib.parse.parse_qs(urllib.parse.urlparse(emb).query)['t'][0]
          api='https://embed.settlar.io/api/embed/session?t='+urllib.parse.quote(tok,safe='')
          st,_,_,b=get(api,{'Referer':emb,'Accept':'application/json'})
          sess=json.loads(b)
          print('SESSION_KEYS',sorted(sess.keys()))
          for k,v in sess.items():
              if k=='source':continue
              if isinstance(v,(str,int,float,bool)) or v is None:
                  print('FIELD',k,repr(v)[:1000])
              elif isinstance(v,list):
                  print('FIELD',k,'LIST',len(v),repr(v[:3])[:3000])
              elif isinstance(v,dict):
                  print('FIELD',k,'DICT_KEYS',list(v.keys())[:80],repr(v)[:3000])
          src=sess['source']
          print('SOURCE',src)

          tests=[
              ('headerless',{}),
              ('ua-only',{'User-Agent':UA}),
              ('embed-ref',{'Referer':emb}),
              ('embed-origin-ref',{'Referer':emb,'Origin':'https://embed.settlar.io'})
          ]
          for label,hh in tests:
              try:
                  st,final,h,b=get(src,hh)
                  txt=b.decode('utf-8','ignore')
                  print('HLS_TEST',label,st,h.get('Content-Type'),'m3u8',txt.startswith('#EXTM3U'),'len',len(b))
              except Exception as e:
                  print('HLS_TEST',label,'ERR',repr(e))
          PY
