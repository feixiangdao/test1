name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  strings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone public ZStream iOS mirror
        run: |
          git clone --depth 1 https://github.com/aaslam12/ZStream-iOS-Mirror-Dev.git /tmp/zstream
      - name: Inspect native framework strings
        run: |
          BIN="/tmp/zstream/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources"
          test -f "$BIN"
          echo "=== URLs / domains ==="
          strings -a "$BIN" | grep -Eai 'https?://|[A-Za-z0-9.-]+\.(com|net|org|app|dev|ru|lol|gdn|ch|cc|xyz|to|tv|sbs)' | sort -u | head -n 1000 || true
          echo "=== Resolver keywords ==="
          strings -a "$BIN" | grep -Eai 'tokyo|stellar|nesterov|aphrodite|aspera|artemis|aurora|fontaine|magnolia|shibuya|cosmic|tmdb|season|episode|resolve|stream|subtitle|source|shelf|slot|variant' | sort -u | head -n 2000 || true
