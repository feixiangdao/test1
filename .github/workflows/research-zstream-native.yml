name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe Settlar final HLS API
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          ANI='https://ani.pm'
          def get(url,referer,accept='*/*'):
              q=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':referer,'Accept':accept})
              with urllib.request.urlopen(q,timeout=35) as r:
                  return r.status,r.geturl(),dict(r.headers),r.read()
          st,_,_,b=get(ANI+'/api/anime/playback-bootstrap/settlar/6351?ep=1&lang=sub',ANI+'/', 'application/json')
          sel=json.loads(b)['settlarSelection']
          qs=urllib.parse.urlencode({'selection':sel,'provider':'anipm','ep':'1','channel':'sub','telemetry':'0'})
          st,_,_,b=get(ANI+'/api/anime/settlar/session?'+qs,ANI+'/', 'application/json')
          emb=json.loads(b)['embedUrl']
          tok=urllib.parse.parse_qs(urllib.parse.urlparse(emb).query)['t'][0]
          api='https://embed.settlar.io/api/embed/session?t='+urllib.parse.quote(tok,safe='')
          st,final,h,b=get(api,emb,'application/json')
          print('SESSION_HTTP',st,'FINAL',final,'CT',h.get('Content-Type'),'LEN',len(b))
          print(b.decode('utf-8','ignore')[:30000])
          j=json.loads(b)
          src=j.get('source','')
          print('KIND',j.get('kind'),'SOURCE',src)
          if src:
              st,final,h,b=get(src,emb,'application/vnd.apple.mpegurl,*/*')
              print('HLS_HTTP',st,'FINAL',final,'CT',h.get('Content-Type'),'LEN',len(b))
              txt=b.decode('utf-8','ignore')
              print('HLS_HEAD',txt[:5000])
              print('IS_M3U8',txt.startswith('#EXTM3U'))
          PY
