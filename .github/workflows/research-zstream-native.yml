name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect WatchPlaylistPanel selection resolver
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          url='https://ani.pm/assets/WatchPlaylistPanel-DJKjgIQ0.js'
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://ani.pm/'})
          with urllib.request.urlopen(req,timeout=25) as r:
              js=r.read().decode('utf-8','ignore')
          print('LEN',len(js))
          print('=== HEAD ===')
          print(js[:18000])
          print('=== EXPORT TAIL ===')
          print(js[-12000:])
          for mark in ['selection','embedUrl','expiresAt','anipm','provider','fetch(','post(','/api/','/anime/','server','stream','direct','m3u8','resolve']:
              low=js.lower(); pos=0; seen=set()
              print('\n#####',mark,'#####')
              while True:
                  i=low.find(mark.lower(),pos)
                  if i<0:break
                  s=js[max(0,i-900):min(len(js),i+1800)].replace('\n',' ')
                  if s not in seen:
                      seen.add(s);print(s)
                  pos=i+len(mark)
                  if len(seen)>=20:break
          PY
