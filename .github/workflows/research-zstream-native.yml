name: Research ZStream Native

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-native.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect ani.pm playback chunks
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          urls=[
            'https://ani.pm/assets/animePlay-Do_s27ou.js',
            'https://ani.pm/assets/detailPlayer-BeRKClZ7.js',
            'https://ani.pm/assets/AnimeDetails-CNwua4lV.js',
            'https://ani.pm/assets/animeMedia-DmLn3mLM.js'
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://ani.pm/'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.read().decode('utf-8','ignore')
          marks=['playback-bootstrap','/anime/src/','provider','providers','streams','sources','server','anipm-server','m3u8','headers','lang','episode','url','embed','direct']
          for u in urls:
              try: js=get(u)
              except Exception as e:
                  print('FETCHERR',u,repr(e));continue
              print('\n###',u,'LEN',len(js))
              low=js.lower(); seen=set(); hits=[]
              for mark in marks:
                  pos=0
                  while True:
                      i=low.find(mark.lower(),pos)
                      if i<0:break
                      s=js[max(0,i-500):min(len(js),i+1000)].replace('\n',' ')
                      if s not in seen:seen.add(s);hits.append(s)
                      pos=i+len(mark)
                      if len(hits)>=120:break
                  if len(hits)>=120:break
              for h in hits:print(h)
          PY
