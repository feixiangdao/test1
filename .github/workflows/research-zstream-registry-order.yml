# rerun-20261006
name: Research ZStream registry order

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-registry-order.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect native source registry order
        run: |
          set -e
          curl -L --fail --retry 2 -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          strings -a -n 3 /tmp/ZStreamNativeSources > /tmp/s.txt
          nl -ba /tmp/s.txt > /tmp/n.txt

          echo '=== NATIVE SOURCE REGISTRY 97980-98120 ==='
          sed -n '97980,98120p' /tmp/n.txt

          echo '=== RESOLVER SYMBOLS ==='
          grep -inE 'Resolve:type:season:episode:|Resolve:shelf:slot:type:' /tmp/s.txt | head -n 120

          echo '=== SOURCE NAME NEIGHBORHOODS ==='
          for k in aphrodite artemis aspera aurora magnolia nesterov stellar tokyo; do
            echo "--- $k ---"
            grep -in -C 10 "$k" /tmp/s.txt | head -n 120 || true
          done
