# rerun-20261006
name: Research ZStream SourceInfo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-zstream-sourceinfo.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Dump exact SourceInfo/native string ranges
        run: |
          set -e
          curl -L --fail --retry 2             -o /tmp/ZStreamNativeSources             'https://raw.githubusercontent.com/aaslam12/ZStream-iOS-Mirror-Dev/development/ZStreamNativeSources.xcframework/ios-arm64/ZStreamNativeSources.framework/ZStreamNativeSources'
          strings -a -n 2 /tmp/ZStreamNativeSources | nl -ba > /tmp/n.txt
          echo '=== SOURCEINFO 97980-98050 ==='
          sed -n '97980,98050p' /tmp/n.txt
          echo '=== NATIVE PROTOCOL 95380-95570 ==='
          sed -n '95380,95570p' /tmp/n.txt
