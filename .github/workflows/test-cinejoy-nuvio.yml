name: Test Cinejoy Nuvio

on:
  workflow_dispatch:
  push:
    paths:
      - 'cinejoy-nuvio/**'
      - '.github/workflows/test-cinejoy-nuvio.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check providers
        run: |
          set -e
          for f in cinejoy-nuvio/providers/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Test Jellyfin Direct
        run: node cinejoy-nuvio/test-jellyfin-direct.js
      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = require('./cinejoy-nuvio/manifest.json');
          if (!Array.isArray(m.scrapers) || m.scrapers.length !== 12) {
            throw new Error(`Expected 12 scrapers, got ${m.scrapers && m.scrapers.length}`);
          }
          const ids = new Set();
          for (const s of m.scrapers) {
            if (!s.id || ids.has(s.id)) throw new Error(`Duplicate/missing id: ${s.id}`);
            ids.add(s.id);
            if (!s.filename) throw new Error(`Missing filename: ${s.id}`);
            if (!fs.existsSync('cinejoy-nuvio/' + s.filename)) throw new Error(`Missing file: ${s.filename}`);
          }
          console.log(m.scrapers.map(x => `${x.enabled ? 'ON ' : 'OFF'} ${x.name}`).join('\n'));
          NODE
