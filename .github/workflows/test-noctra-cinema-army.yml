name: Test NoctraTV Cinema Army

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/cinema-army-*.js'
      - 'noctratv-nuvio/manifest.json'
      - '.github/workflows/test-noctra-cinema-army.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check noctratv-nuvio/providers/cinema-army-cookiebakers.js
          node --check noctratv-nuvio/providers/cinema-army-dcloud.js
      - name: Focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{if(done)return;done=true;console.log(label+' timeout');resolve([])},ms);
              Promise.resolve(p).then(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)})
                .catch(e=>{if(done)return;done=true;clearTimeout(timer);console.log(label+' error '+(e&&e.message?e.message:e));resolve([])});
            });
          }
          async function run(file,label){
            const p=require('./providers/'+file);
            for(const [name,args] of [['movie',[238,'movie']],['tv',[1399,'tv',1,1]]]){
              const rows=await timeout(p.getStreams(...args),45000,label+' '+name);
              console.log(label+' '+name+': streams='+(rows||[]).length);
              (rows||[]).slice(0,8).forEach((x,i)=>{
                let host='';try{host=new URL(x.url).hostname}catch{}
                console.log('  '+(i+1)+'. '+x.name+' quality='+x.quality+' host='+host);
              });
            }
          }
          (async()=>{
            await run('cinema-army-cookiebakers.js','Cookiebakers');
            await run('cinema-army-dcloud.js','Dcloud');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
