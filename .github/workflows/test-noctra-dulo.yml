name: Test NoctraTV Dulo

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/dulo-auto.js'
      - 'noctratv-nuvio/manifest.json'
      - '.github/workflows/test-noctra-dulo.yml'

jobs:
  dulo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check noctratv-nuvio/providers/dulo-auto.js
      - name: Focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{
                if(done)return;
                done=true;
                console.log(label+' timeout');
                resolve([]);
              },ms);
              Promise.resolve(p).then(v=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                resolve(v);
              }).catch(e=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                console.log(label+' error '+(e&&e.message?e.message:e));
                resolve([]);
              });
            });
          }
          (async()=>{
            const p=require('./providers/dulo-auto.js');
            for(const [kind,args] of [
              ['movie',[238,'movie']],
              ['movie2',[550,'movie']],
              ['tv',[1399,'tv',1,1]]
            ]){
              const rows=await timeout(p.getStreams(...args),45000,'Dulo '+kind);
              console.log('Dulo '+kind+': streams='+(rows||[]).length);
              for(const x of (rows||[]).slice(0,5)){
                let host='',path='';try{const u=new URL(x.url);host=u.hostname;path=u.pathname}catch{}
                console.log('  '+x.name+' q='+(x.quality||'')+' type='+(x.type||'')+' host='+host+' path='+path);
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
