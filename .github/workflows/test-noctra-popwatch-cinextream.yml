name: Test NoctraTV PopWatch CineXtream

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-noctra-popwatch-cinextream.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact CineXtream MZone source IDs
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('./providers/streamvault.js','utf8');
          s=s.replace(/var SOURCES=\[[\s\S]*?\];/,
          `var SOURCES=[
            {id:"site-popwatch-cinextream-hable",label:"Hable",movie:true,tv:false},
            {id:"site-popwatch-cinextream-nest",label:"Nest",movie:true,tv:true},
            {id:"site-popwatch-cinextream-orion",label:"Orion",movie:true,tv:true},
            {id:"site-popwatch-cinextream-light",label:"Light",movie:true,tv:true},
            {id:"site-popwatch-cinextream-space",label:"Space",movie:true,tv:true},
            {id:"site-popwatch-cinextream-luna",label:"Luna",movie:true,tv:true},
            {id:"site-popwatch-cinextream-kuro",label:"Kuro",movie:true,tv:false}
          ];`);
          s=s.replace(/NoctraTV · StreamVault · /g,'NoctraTV · PopWatch · CineXtream · ');
          s=s.replace(/noctra-streamvault/g,'noctra-popwatch-cinextream');
          s=s.replace(/\[Noctra\/StreamVault\]/g,'[Noctra/PopWatch/CineXtream]');
          fs.writeFileSync('/tmp/cinextream.cjs',s);
          const p=require('/tmp/cinextream.cjs');
          async function run(label,args){
            const rows=await Promise.race([
              Promise.resolve(p.getStreams(...args)),
              new Promise(r=>setTimeout(()=>r([]),60000))
            ]).catch(e=>{console.log('ERR '+e.message);return[]});
            console.log(label+': streams='+(rows||[]).length);
            for(const x of (rows||[]).slice(0,10)){
              let host='',pathname='';try{const u=new URL(x.url);host=u.hostname;pathname=u.pathname}catch{}
              console.log('  '+x.name+' q='+x.quality+' type='+(x.type||'')+' host='+host+' path='+pathname);
            }
          }
          (async()=>{
            await run('CineXtream movie',[550,'movie']);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
