name: Test NoctraTV PopWatch m4uhd

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/popwatch-videasy-m4uhd.js'
      - '.github/workflows/test-noctra-popwatch-m4uhd.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check noctratv-nuvio/providers/popwatch-videasy-m4uhd.js
      - name: Focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{if(done)return;done=true;console.log(label+' timeout');resolve([])},ms);
              Promise.resolve(p).then(v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)})
                .catch(e=>{if(done)return;done=true;clearTimeout(timer);console.log(label+' error '+(e&&e.message?e.message:e));resolve([])});
            });
          }
          (async()=>{
            const p=require('./providers/popwatch-videasy-m4uhd.js');
            for(const [kind,args] of [['movie',[238,'movie']],['tv',[1399,'tv',1,1]]]){
              const rows=await timeout(p.getStreams(...args),45000,'m4uhd '+kind);
              console.log('m4uhd '+kind+': streams='+(rows||[]).length);
              for(const x of (rows||[]).slice(0,8)){
                let host='';try{host=new URL(x.url).hostname}catch{}
                console.log('  '+x.name+' q='+(x.quality||'')+' host='+host);
              }
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
