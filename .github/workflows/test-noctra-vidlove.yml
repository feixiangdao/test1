name: Test NoctraTV VidLove

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/vidlove.js'
      - 'noctratv-nuvio/manifest.json'
      - '.github/workflows/test-noctra-vidlove.yml'

jobs:
  vidlove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check noctratv-nuvio/providers/vidlove.js
      - name: Focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{
                if(done)return; done=true;
                console.log(label+' timeout'); resolve([]);
              },ms);
              Promise.resolve(p).then(v=>{
                if(done)return; done=true; clearTimeout(timer); resolve(v);
              }).catch(e=>{
                if(done)return; done=true; clearTimeout(timer);
                console.log(label+' error '+(e&&e.message?e.message:e)); resolve([]);
              });
            });
          }
          const p=require('./providers/vidlove.js');
          async function run(label,args){
            const rows=await timeout(p.getStreams(...args),50000,label);
            console.log(label+': streams='+(rows||[]).length);
            for(const x of (rows||[]).slice(0,10)){
              let host='',path='';try{const u=new URL(x.url);host=u.hostname;path=u.pathname}catch{}
              console.log('  '+x.name+' q='+x.quality+' type='+(x.type||'')+' host='+host+' path='+path);
            }
            return (rows||[]).length;
          }
          (async()=>{
            const a=await run('VidLove movie',[238,'movie']);
            const b=await run('VidLove tv',[1399,'tv',1,1]);
            if(a<1&&b<1)throw new Error('VidLove returned zero validated streams for both focused samples');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
