name: Test NoctraTV ZStream aliases

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/zstream-aliases.js'
      - 'noctratv-nuvio/manifest.json'
      - '.github/workflows/test-noctra-zstream-aliases.yml'

jobs:
  aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check noctratv-nuvio/providers/zstream-aliases.js
      - name: Focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{
                if(done)return;
                done=true;
                console.log(label+' timeout');
                resolve([]);
              },ms);
              Promise.resolve(p).then(v=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                resolve(v);
              }).catch(e=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                console.log(label+' error '+(e&&e.message?e.message:e));
                resolve([]);
              });
            });
          }
          async function run(){
            const p=require('./providers/zstream-aliases.js');
            for(const [name,args] of [
              ['movie',[238,'movie']],
              ['tv',[1399,'tv',1,1]]
            ]){
              const rows=await timeout(p.getStreams(...args),50000,'ZStream aliases '+name);
              console.log('ZStream aliases '+name+': streams='+(rows||[]).length);
              (rows||[]).slice(0,10).forEach((x,i)=>console.log('  '+(i+1)+'. '+x.name+' '+x.url));
            }
          }
          run().catch(e=>{console.error(e);process.exitCode=1});
          NODE
