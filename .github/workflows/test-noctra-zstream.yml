name: Test NoctraTV ZStream

on:
  workflow_dispatch:
  push:
    paths:
      - 'noctratv-nuvio/providers/zstream-*.js'
      - 'noctratv-nuvio/manifest.json'
      - '.github/workflows/test-noctra-zstream.yml'

jobs:
  zstream:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install crypto-js
        run: npm install --no-save crypto-js@4
      - name: ZStream syntax
        run: |
          node --check noctratv-nuvio/providers/zstream-aphrodite.js
          node --check noctratv-nuvio/providers/zstream-stellar.js
          node --check noctratv-nuvio/providers/zstream-tokyo.js
      - name: ZStream focused live probe
        working-directory: noctratv-nuvio
        run: |
          node - <<'NODE'
          async function timeout(p,ms,label){
            return new Promise(resolve=>{
              let done=false;
              const timer=setTimeout(()=>{
                if(done)return;
                done=true;
                console.log(label+' timeout');
                resolve([]);
              },ms);
              Promise.resolve(p).then(v=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                resolve(v);
              }).catch(e=>{
                if(done)return;
                done=true;
                clearTimeout(timer);
                console.log(label+' error '+(e&&e.message?e.message:e));
                resolve([]);
              });
            });
          }
          async function run(file,label,cases){
            const p=require('./providers/'+file);
            let total=0;
            for(const [name,args] of cases){
              const rows=await timeout(p.getStreams(...args),55000,label+' '+name);
              const n=(rows||[]).length;
              total+=n;
              console.log(label+' '+name+': streams='+n);
              (rows||[]).slice(0,5).forEach((x,i)=>console.log('  '+(i+1)+'. '+x.name+' '+x.url));
            }
            return total;
          }
          (async()=>{
            await run('zstream-aphrodite.js','Aphrodite',[
              ['movie',[238,'movie']],['tv',[1399,'tv',1,1]]
            ]);
            await run('zstream-stellar.js','Stellar',[
              ['movie',[238,'movie']],['tv',[1399,'tv',1,1]]
            ]);
            console.log('Vidy candidate city probe');
            const st=require('./providers/zstream-stellar.js');
            for(const src of ['Miami','Boise','Orlando','Atlanta','Tampa','Portland']){
              try{
                const r=await timeout(st._resolveOne('movie',238,null,null,src),20000,'city '+src);
                const v=r&&r.url?await timeout(st._verifyResolved(r),12000,'verify '+src):null;
                console.log('CITY '+src+' source='+(r&&r.source?r.source:'none')+' playable='+(v?1:0));
              }catch(e){
                console.log('CITY '+src+' error '+(e&&e.message?e.message:e));
              }
            }
            const tokyo=await run('zstream-tokyo.js','Tokyo',[
              ['Frieren S01E01',[209867,'tv',1,1]]
            ]);
            if(tokyo<1)throw new Error('Tokyo focused anime probe returned zero streams');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
