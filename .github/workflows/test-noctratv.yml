name: Test NoctraTV Provider

on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/providers/noctratv.js'
      - 'stellar-nuvio/live-noctratv.js'
      - '.github/workflows/test-noctratv.yml'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check stellar-nuvio/providers/noctratv.js
      - name: NoctraTV verified live probe
        working-directory: stellar-nuvio
        run: node live-noctratv.js
