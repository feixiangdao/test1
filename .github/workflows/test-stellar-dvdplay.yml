name: Test Stellar DVDPlay Strict

on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/providers/dvdplay.js'
      - '.github/workflows/test-stellar-dvdplay.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe strict matches
        run: |
          node - <<'NODE'
          const p=require('./stellar-nuvio/providers/dvdplay.js');
          async function one(label,id,type,s,e){
            const rows=await p.getStreams(id,type,s,e);
            console.log('ROWS',label,rows.length,rows.slice(0,20).map(x=>({name:x.name,quality:x.quality,host:(()=>{try{return new URL(x.url).host}catch(_){return''}})(),title:x.title})));
            for(const x of rows.slice(0,6)){
              try{
                const r=await fetch(x.url,{method:'HEAD',headers:{...(x.headers||{}),'User-Agent':'Mozilla/5.0'},redirect:'manual',signal:AbortSignal.timeout(10000)});
                console.log('HEAD',label,x.quality||'',r.status,r.headers.get('content-type'),r.headers.get('content-length'),new URL(x.url).host);
              }catch(err){console.log('HEADERR',label,err.message)}
            }
          }
          (async()=>{
            await one('Fight Club','550','movie');
            await one('Inception','27205','movie');
            await one('GOT S1E1','1399','tv',1,1);
            await one('GOT S6E1','1399','tv',6,1);
            await one('GOT S8E1','1399','tv',8,1);
            await one('Squid Game S1E1','93405','tv',1,1);
            await one('Squid Game S3E1','93405','tv',3,1);
          })().catch(e=>{console.error(e.stack||e);process.exitCode=1});
          NODE
