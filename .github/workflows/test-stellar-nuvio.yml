name: Test Stellar Nuvio

on:
  workflow_dispatch:
  push:
    paths:
      - 'stellar-nuvio/**'
      - '.github/workflows/test-stellar-nuvio.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install crypto-js for MovieBox tests
        run: npm install --no-save crypto-js

      - name: Syntax check providers
        run: |
          for f in stellar-nuvio/providers/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('stellar-nuvio/manifest.json','utf8'));
          if(m.name!=='Stellar Local') throw new Error('unexpected manifest name');
          if(!Array.isArray(m.scrapers)||m.scrapers.length===0) throw new Error('manifest has no scrapers');

          const ids=new Set();
          const manifestFiles=new Set();
          for(const s of m.scrapers){
            if(ids.has(s.id)) throw new Error('duplicate id '+s.id);
            ids.add(s.id);
            if(!s.filename || !/^providers\/.+\.js$/.test(s.filename)) throw new Error('invalid filename for '+s.id);
            const p='stellar-nuvio/'+s.filename;
            if(!fs.existsSync(p)) throw new Error('missing '+p);
            manifestFiles.add(s.filename.replace(/^providers\//,''));
          }

          // Deliberately retained research candidate: present in providers/ for syntax checks,
          // but not exposed to users until reliability is good enough.
          const allowedUnregistered=new Set(['hdhub4u.js']);
          const providerFiles=fs.readdirSync('stellar-nuvio/providers').filter(x=>x.endsWith('.js'));
          const unexpected=providerFiles.filter(x=>!manifestFiles.has(x)&&!allowedUnregistered.has(x));
          if(unexpected.length) throw new Error('unregistered provider files: '+unexpected.join(','));

          console.log('Stellar Local manifest OK; active='+m.scrapers.length+' candidateExtras='+providerFiles.filter(x=>allowedUnregistered.has(x)).join(','));
          NODE

      - name: MovieBox helper tests
        working-directory: stellar-nuvio
        run: node test-moviebox-mobile.js

      - name: CastleTV helper tests
        working-directory: stellar-nuvio
        run: node test-castletv.js

      - name: VAPlayer helper tests
        working-directory: stellar-nuvio
        run: node test-vaplayer.js

      - name: Cineby helper tests
        working-directory: stellar-nuvio
        run: node test-cineby.js

      - name: Movix helper tests
        working-directory: stellar-nuvio
        run: node test-movix.js

      - name: NetMirror helper tests
        working-directory: stellar-nuvio
        run: node test-netmirror.js

      # Everything below depends on third-party sites/CDNs. A temporary upstream
      # outage should be visible in the log, but must not make syntax/manifest CI red.
      - name: Diagnose NoctraTV embed
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node diagnose-noctratv.js

      - name: NoctraTV live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-noctratv.js
      - name: PurStream live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-purstream.js

      - name: MovieBox signed live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-moviebox-mobile.js

      - name: CastleTV live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-castletv.js

      - name: VAPlayer live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-vaplayer.js

      - name: Diagnose VidRock
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node diagnose-vidrock.js

      - name: Cineby live local-style probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-cineby.js

      - name: Mapple live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-mapple.js

      - name: Movix live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-movix.js

      - name: NetMirror live probe
        continue-on-error: true
        working-directory: stellar-nuvio
        run: node live-netmirror.js