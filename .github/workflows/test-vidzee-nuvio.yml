name: Test VidZee Nuvio

on:
  workflow_dispatch:
  push:
    paths:
      - 'vidzee-nuvio/**'
      - '.github/workflows/test-vidzee-nuvio.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check vidzee-nuvio/providers/vidzee.js
      - name: Test VidZee Direct
        run: node vidzee-nuvio/test-vidzee.js
      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = require('./vidzee-nuvio/manifest.json');
          if (!Array.isArray(m.scrapers) || m.scrapers.length !== 1) {
            throw new Error(`Expected 1 scraper, got ${m.scrapers && m.scrapers.length}`);
          }
          const s = m.scrapers[0];
          if (s.id !== 'vidzee-direct') throw new Error('Unexpected scraper id');
          if (!fs.existsSync('vidzee-nuvio/' + s.filename)) throw new Error('Provider file missing');
          console.log(m.name, m.version, s.name);
          NODE
