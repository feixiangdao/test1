name: VidPlay V1 safe API contract
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/inspect-api-contract.cjs'
      - '.github/workflows/vidplay-api-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: node vidplay-nuvio/inspect-api-contract.cjs
