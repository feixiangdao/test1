name: VidPlay V1 old Nuvio native binary fallback
on:
  workflow_dispatch:
  push:
    paths:
      - 'vidplay-nuvio/providers/vidplay.js'
      - 'vidplay-nuvio/probe-old-runtime.cjs'
      - '.github/workflows/vidplay-legacy-binary.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node vidplay-nuvio/probe-old-runtime.cjs
