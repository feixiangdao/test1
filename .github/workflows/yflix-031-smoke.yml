name: YFlix 031 Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-031-smoke.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Load providers and call movie
        shell: bash
        run: |
          set -e
          for n in 1 2 4; do
            curl -fsSL "https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server$n.js" -o "/tmp/s$n.js"
            node -c "/tmp/s$n.js"
          done
          node - <<'NODE'
          async function run(n){
            const p=require('/tmp/s'+n+'.js');
            const rows=await p.getStreams('157336','movie');
            console.log('S'+n,'count=',rows.length,'first=',rows[0]&&rows[0].name);
          }
          Promise.resolve().then(()=>run(1)).then(()=>run(2)).then(()=>run(4)).catch(e=>{console.error(e);process.exit(1)});
          NODE
