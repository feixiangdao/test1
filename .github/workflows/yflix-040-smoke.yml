name: YFlix 041 Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-040-smoke.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate final S2 filtering and S4 expanded HLS
        shell: bash
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server2.js -o /tmp/s2.js
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server4.js -o /tmp/s4.js
          node -c /tmp/s2.js
          node -c /tmp/s4.js
          node - <<'NODE'
          async function probe(row){
            const r=await fetch(row.url,{headers:row.headers||{},signal:AbortSignal.timeout(15000)});
            const t=await r.text();
            console.log('PROBE',row.name,r.status,r.headers.get('content-type'),t.slice(0,100).replace(/\n/g,'\\n'));
            if(!r.ok||!t.includes('#EXTM3U')) throw new Error('bad HLS '+r.status);
          }
          async function run(){
            const s2=require('/tmp/s2.js'),s4=require('/tmp/s4.js');
            const m2=await s2.getStreams('157336','movie');
            const t2=await s2.getStreams('108978','tv',1,1);
            console.log('S2_MOVIE',m2.map(x=>x.name));
            console.log('S2_TV',t2.map(x=>x.name));
            const m4=await s4.getStreams('157336','movie');
            const t4=await s4.getStreams('108978','tv',1,1);
            console.log('S4_MOVIE',m4.map(x=>x.name));
            console.log('S4_TV',t4.map(x=>x.name));
            if(!m4.length||m4[0].type==='diagnostic') throw new Error('S4 movie no playable row');
            if(!t4.length||t4[0].type==='diagnostic') throw new Error('S4 tv no playable row');
            await probe(m4[0]);
            await probe(t4[0]);
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
