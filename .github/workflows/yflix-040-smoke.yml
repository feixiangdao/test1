name: YFlix 040 Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-040-smoke.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe every S2/S4 HLS
        shell: bash
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server2.js -o /tmp/s2.js
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server4.js -o /tmp/s4.js
          node -c /tmp/s2.js
          node -c /tmp/s4.js
          node - <<'NODE'
          function abs(base, ref){ try{return new URL(ref,base).toString()}catch(e){return ref} }
          async function probe(row){
            try{
              const h=row.headers||{};
              const r=await fetch(row.url,{headers:h,signal:AbortSignal.timeout(15000)});
              const text=await r.text();
              let result={name:row.name,url:row.url,status:r.status,ct:r.headers.get('content-type')||'',head:text.slice(0,80).replace(/\n/g,'\\n')};
              if(r.ok&&text.includes('#EXTM3U')){
                const lines=text.replace(/\r/g,'').split('\n');
                let next='';
                for(const line0 of lines){
                  const line=line0.trim();
                  if(line&&!line.startsWith('#')){next=abs(row.url,line);break;}
                }
                if(next){
                  try{
                    const r2=await fetch(next,{headers:h,signal:AbortSignal.timeout(12000)});
                    result.nextStatus=r2.status;
                    result.nextCt=r2.headers.get('content-type')||'';
                  }catch(e){result.nextError=String(e.message||e)}
                }
              }
              return result;
            }catch(e){return{name:row.name,url:row.url,error:String(e.message||e)}}
          }
          async function run(){
            const s2=require('/tmp/s2.js'),s4=require('/tmp/s4.js');
            const m2=await s2.getStreams('157336','movie');
            console.log('S2_MOVIE_COUNT',m2.length);
            for(const x of m2) console.log('S2_MOVIE_PROBE',JSON.stringify(await probe(x)));
            const t2=await s2.getStreams('108978','tv',1,1);
            console.log('S2_TV_COUNT',t2.length);
            for(const x of t2.slice(0,12)) console.log('S2_TV_PROBE',JSON.stringify(await probe(x)));
            const m4=await s4.getStreams('157336','movie');
            console.log('S4_MOVIE_COUNT',m4.length);
            for(const x of m4) console.log('S4_MOVIE_PROBE',JSON.stringify(await probe(x)));
            const t4=await s4.getStreams('108978','tv',1,1);
            console.log('S4_TV_COUNT',t4.length);
            for(const x of t4) console.log('S4_TV_PROBE',JSON.stringify(await probe(x)));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
