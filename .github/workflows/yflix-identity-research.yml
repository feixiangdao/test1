name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe FilmU/VidBolt first-party Quasar and VidBolt PlayerPage
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re,json,urllib.parse
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0"})
          endpoints=[
            ("filmu-movie-tmdb","https://embed.filmu.in/api/quasar?type=movie&id=157336&title=Interstellar&year=2014"),
            ("filmu-movie-imdb","https://embed.filmu.in/api/quasar?type=movie&id=tt0816692&title=Interstellar&year=2014"),
            ("filmu-tv-tmdb","https://embed.filmu.in/api/quasar?type=tv&id=108978&title=Reacher&year=2022&season=1&episode=1"),
            ("filmu-tv-imdb","https://embed.filmu.in/api/quasar?type=tv&id=tt9288030&title=Reacher&year=2022&season=1&episode=1"),
            ("vidbolt-movie-tmdb","https://vidbolt.xyz/api/quasar?type=movie&id=157336&title=Interstellar&year=2014"),
            ("vidbolt-movie-imdb","https://vidbolt.xyz/api/quasar?type=movie&id=tt0816692&title=Interstellar&year=2014")
          ]
          for name,url in endpoints:
            print("\n### API",name)
            try:
              r=S.get(url,timeout=35,headers={"Referer":url.split("/api/")[0]+"/movie/157336","Accept":"application/json"})
              print("STATUS",r.status_code,"CTYPE",r.headers.get("content-type"),"LEN",len(r.text))
              print(r.text[:8000])
            except Exception as e:
              print("ERR",repr(e))

          url="https://vidbolt.xyz/assets/assets/PlayerPage-CxGTx3In.js"
          print("\n### VIDBOLT PLAYER",url)
          r=S.get(url,timeout=30,headers={"Referer":"https://vidbolt.xyz/movie/157336"})
          print("STATUS",r.status_code,"CTYPE",r.headers.get("content-type"),"LEN",len(r.text))
          text=r.text
          keys=["quasar","callisto","/api/","/scrape/","tmdbId","imdbId","movy","orion","source"]
          for key in keys:
            hits=[m.start() for m in re.finditer(re.escape(key.lower()),text.lower())]
            if not hits: continue
            print("\nKEY",key,"COUNT",len(hits))
            for idx in hits[:15]:
              a=max(0,idx-650); b=min(len(text),idx+1250)
              print(text[a:b].replace("\n"," ")[:2200])
          refs=sorted(set(re.findall(r'["\']([^"\']+\.js)["\']',text)))
          print("\nJSREFS",refs[:100])
          PY
