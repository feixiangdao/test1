name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PlayerPage chunks
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re,urllib.parse
          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0"})
          targets=[
            ("filmu","https://embed.filmu.in/movie/157336"),
            ("vidbolt","https://vidbolt.xyz/movie/157336")
          ]
          needles=[
            "singularity","allmovieland","/api/proxy","api.themoviedb.org",
            "external_ids","imdb_id","/scrape/","quasar","callisto","movy.lol",
            "auth_key","expire=","tmdb","imdb","fetch(","axios"
          ]
          for name,url in targets:
            print("\n###",name)
            page=S.get(url,timeout=20)
            srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',page.text,re.I)
            host=urllib.parse.urlparse(page.url).netloc
            entry=None
            for src in srcs:
              u=urllib.parse.urljoin(page.url,src)
              if urllib.parse.urlparse(u).netloc==host:
                entry=u
            print("ENTRY",entry)
            text=S.get(entry,timeout=20,headers={"Referer":page.url}).text
            refs=set()
            for m in re.findall(r'["\'](\.?/?[^"\']+\.js)["\']',text):
              refs.add(urllib.parse.urljoin(entry,m))
            for m in re.findall(r'import\(["\']([^"\']+\.js)["\']\)',text):
              refs.add(urllib.parse.urljoin(entry,m))
            refs=sorted(refs)
            print("REFS",len(refs))
            for u in refs:
              if urllib.parse.urlparse(u).netloc!=host: continue
              try:
                rr=S.get(u,timeout=20,headers={"Referer":page.url})
              except Exception:
                continue
              low=rr.text.lower()
              if not any(n.lower() in low for n in needles): continue
              print("\nBUNDLE",u,"LEN",len(rr.text))
              for needle in needles:
                pos=0; count=0
                while True:
                  idx=low.find(needle.lower(),pos)
                  if idx<0 or count>=12: break
                  a=max(0,idx-500); b=min(len(rr.text),idx+900)
                  print("\n--",needle,"@",idx,"--")
                  print(rr.text[a:b].replace("\n"," ")[:1600])
                  pos=idx+len(needle); count+=1
          PY
