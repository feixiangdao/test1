name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fast VidRock source list
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,urllib.parse,json
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0"})
          KEY="09eb429913afb6b1cc90f23746f41fb3279aed77726c625c40672b81444c0bac"
          bases=["https://backend-api2-bxhuur-7f7bc0-15-235-147-53.sslip.io","https://showbox.filmu.in"]
          cases=[
            ("Interstellar","movie","tt0816692",157336,"Interstellar",2014,None,None),
            ("ReacherS01E01","tv","tt9288030",108978,"Reacher",2022,1,1)
          ]
          for label,kind,imdb,tmdb,title,year,s,e in cases:
            print("\n###",label)
            q=f"tmdbId={tmdb}&title={urllib.parse.quote(title)}&year={year}"
            if s:q+=f"&season={s}&episode={e}"
            path=f"/scrape/VidRock/{kind}/{imdb}?{q}"
            for base in bases:
              try:
                r=S.get(base+path,timeout=18,headers={"x-api-key":KEY,"Accept":"application/json"})
                print("BACKEND",base,"STATUS",r.status_code,"LEN",len(r.text))
                if r.status_code==200:
                  j=r.json()
                  print("COUNT",len(j.get("sources") or []))
                  for row in (j.get("sources") or [])[:50]:
                    print(json.dumps({
                      "name":row.get("name"),"quality":row.get("quality"),"type":row.get("type"),
                      "url":row.get("url"),"workerProxyUrl":row.get("workerProxyUrl"),
                      "headers":row.get("headers")
                    },ensure_ascii=False))
                else: print(r.text[:500])
              except Exception as ex: print("ERR",base,repr(ex))
          PY
