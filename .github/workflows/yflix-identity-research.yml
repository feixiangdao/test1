name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect and probe VidBolt Nebula Echo
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re,json,urllib.parse
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0"})
          for name,url in [
            ("Nebula","https://vidbolt.xyz/assets/vidr-_MrUkJWh.js"),
            ("Echo","https://vidbolt.xyz/assets/localapiscraper-B_Gz3ANy.js")
          ]:
            r=S.get(url,timeout=30,headers={"Referer":"https://vidbolt.xyz/movie/157336"})
            print("\nMODULE",name,r.status_code,len(r.text))
            print(r.text[:12000])

          # Extract all server ids/names once, compactly.
          t=S.get("https://vidbolt.xyz/assets/EmbeddedOnlyEmbedPage-CxGTx3In.js",timeout=30).text
          print("\nSERVERS")
          for m in re.finditer(r'\{id:"([^"]+)",name:"([^"]+)",desc:"([^"]*)",cc:"([^"]*)",tag:"([^"]*)",status:"([^"]+)"',t):
            print(m.groups())
          PY
