name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact resolver functions
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0"})

          def contexts(name,url,needles,span=2600):
            print("\n###",name,url)
            r=S.get(url,timeout=30,headers={"Referer":url.split("/assets/")[0]+"/movie/157336"})
            print("STATUS",r.status_code,"CTYPE",r.headers.get("content-type"),"LEN",len(r.text))
            t=r.text
            low=t.lower()
            for needle in needles:
              hits=[m.start() for m in re.finditer(re.escape(needle.lower()),low)]
              print("\nNEEDLE",needle,"COUNT",len(hits))
              for idx in hits[:8]:
                a=max(0,idx-span); b=min(len(t),idx+span)
                print("CTX",idx)
                print(t[a:b].replace("\n"," "))

          contexts(
            "VIDBOLT",
            "https://vidbolt.xyz/assets/EmbeddedOnlyEmbedPage-CxGTx3In.js",
            ['id:"orion"','id:"callisto"','id:"quasar"','name:"Orion"','name:"Callisto"','name:"Quasar"','import("./callisto','callisto-Ud7vipgB']
          )
          contexts(
            "VIDBOLT_CALLISTO",
            "https://vidbolt.xyz/assets/callisto-Ud7vipgB.js",
            ['fetch(','/scrape/','http','movie','tv','tmdb','imdb','source']
          )
          contexts(
            "FILMU_SERVERS",
            "https://embed.filmu.in/assets/servers-B7U1aDDl.js",
            ['function it(','async function it(','const it=','id:"bastion"','id:"evera-citadel"','id:"evera-primevids"','id:"evera-nova"','id:"evera-orion"']
          )
          PY
