name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compact resolver extraction and FilmU direct probes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re,json,urllib.parse
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0"})

          print("=== VIDBOLT MODULES ===")
          for name,url in [
            ("orion","https://vidbolt.xyz/assets/darkmatter-HpTILE1p.js"),
            ("callisto","https://vidbolt.xyz/assets/callisto-Ud7vipgB.js"),
            ("playapi","https://vidbolt.xyz/assets/playapi-Dh80i7LV.js"),
            ("scraperUrl","https://vidbolt.xyz/assets/scraperUrl-DC5Xrq2-.js")
          ]:
            r=S.get(url,timeout=30,headers={"Referer":"https://vidbolt.xyz/movie/157336"})
            print("\nMODULE",name,"STATUS",r.status_code,"LEN",len(r.text),"CTYPE",r.headers.get("content-type"))
            t=r.text
            # Print all string literals that look like endpoints/domains/paths.
            vals=[]
            for s in re.findall(r'["\']([^"\']{1,500})["\']',t):
              sl=s.lower()
              if ("http" in sl or "/api/" in sl or "/scrape/" in sl or "/stream" in sl or
                  "movie" in sl or "series" in sl or "tv" in sl or "tmdb" in sl or "imdb" in sl):
                if s not in vals: vals.append(s)
            print("LITERALS")
            for s in vals[:120]: print(repr(s))
            # chunks are small; print source capped at 12000 chars.
            print("SOURCE",t[:12000])

          print("\n=== FILMU BOX DIRECT ===")
          key="09eb429913afb6b1cc90f23746f41fb3279aed77726c625c40672b81444c0bac"
          base="https://box.filmu.in"
          extractors=["RiveStream","Bastion","Allmovieland","Vaplayer","Videasy","FShareTV"]
          for ext in extractors:
            url=f"{base}/scrape/{ext}/movie/tt0816692?title=Interstellar&tmdbId=157336&imdbId=tt0816692&year=2014"
            try:
              r=S.get(url,timeout=35,headers={"x-api-key":key,"Accept":"application/json","Referer":"https://embed.filmu.in/movie/157336"})
              print("\nBOX",ext,r.status_code,"LEN",len(r.text),r.text[:4000])
            except Exception as e:
              print("\nBOX",ext,"ERR",repr(e))
          PY
