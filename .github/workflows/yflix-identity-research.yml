name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract actual resolver APIs
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re
          S=requests.Session(); S.headers.update({"User-Agent":"Mozilla/5.0"})
          urls=[
            ("filmu-servers","https://embed.filmu.in/assets/servers-B7U1aDDl.js"),
            ("filmu-embed","https://embed.filmu.in/assets/EmbedPage-DKo4EtSL.js"),
            ("vidbolt-player","https://vidbolt.xyz/assets/PlayerPage-CxGTx3In.js"),
            ("vidbolt-entry","https://vidbolt.xyz/assets/index-CWZT0e_1.js")
          ]
          keys=["singularity","quasar","callisto","scrape","/api/","tmdbId","imdbId","imdb_id","allmovieland","movy","proxy"]
          for name,url in urls:
            print("\n###",name,url)
            r=S.get(url,timeout=30,headers={"Referer":url.rsplit("/assets/",1)[0]+"/"})
            print("STATUS",r.status_code,"LEN",len(r.text),"CTYPE",r.headers.get("content-type"))
            text=r.text
            low=text.lower()
            for key in keys:
              hits=[m.start() for m in re.finditer(re.escape(key.lower()),low)]
              if not hits: continue
              print("\nKEY",key,"COUNT",len(hits))
              for idx in hits[:12]:
                a=max(0,idx-700); b=min(len(text),idx+1200)
                print(text[a:b].replace("\n"," ")[:2200])
            lits=re.findall(r'["\']([^"\']{1,260})["\']',text)
            interesting=[]
            for s in lits:
              sl=s.lower()
              if any(x in sl for x in ["/api/","/scrape/","singularity","quasar","callisto","allmovieland","movy"]):
                if s not in interesting: interesting.append(s)
            print("\nINTERESTING_LITERALS",len(interesting))
            for s in interesting[:120]: print(s)
          PY
