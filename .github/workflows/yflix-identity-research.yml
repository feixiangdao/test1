name: YFlix Identity Research
on:
  push:
    paths:
      - '.github/workflows/yflix-identity-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enumerate FilmU servers and VidBolt chunk refs
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import requests,re
          S=requests.Session();S.headers.update({"User-Agent":"Mozilla/5.0"})
          u="https://embed.filmu.in/assets/servers-B7U1aDDl.js"
          t=S.get(u,timeout=30).text
          print("FILMU_LEN",len(t))
          pairs=[]
          for m in re.finditer(r'id:"([^"]+)",name:"([^"]+)"',t):
            p=m.groups()
            if p not in pairs:pairs.append(p)
          print("SERVER_PAIRS",pairs)
          for pat,label in [
            (r'scraperName:"([^"]+)"',"SCRAPER_NAMES"),
            (r'subKey:"([^"]+)"',"SUBKEYS"),
            (r'extractor:"([^"]+)"',"EXTRACTORS"),
            (r'it\([^\)]{0,500},"([^"]+)"\)',"IT_EXTRACTORS"),
            (r'v\("([^"]+)"',"V_LITERAL_CALLS"),
            (r'/scrape/\$\{e\}',"SCRAPE_GENERIC")
          ]:
            vals=[]
            for m in re.finditer(pat,t):
              v=m.group(1) if m.groups() else m.group(0)
              if v not in vals: vals.append(v)
            print(label,vals)
          for needle in ['id:"bastion"','id:"quasar"','id:"citadel"','id:"primevids"','id:"singularity"','FilmU Vortex']:
            i=t.find(needle)
            print("\nNEEDLE",needle,"POS",i)
            if i>=0: print(t[max(0,i-1200):min(len(t),i+5000)].replace("\n"," "))

          vu="https://vidbolt.xyz/assets/index-CWZT0e_1.js"
          v=S.get(vu,timeout=30).text
          print("\nVIDBOLT_ENTRY_LEN",len(v))
          for m in re.finditer(r'([A-Za-z0-9_./-]+\.js)',v):
            s=m.group(1)
            if "Page" in s or "server" in s.lower() or "asset" in s.lower():
              print("REF",s)
          PY
