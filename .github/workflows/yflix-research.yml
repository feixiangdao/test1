name: YFlix Research
on:
  push:
    paths:
      - '.github/workflows/yflix-research.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run YFlix provider smoke tests
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server1.js -o /tmp/yflix.js
          node - <<'NODE'
          const p=require('/tmp/yflix.js');
          async function run(){
            const m=await p.getStreams('157336','movie');
            console.log('MOVIE_COUNT',m.length);
            console.log('MOVIE_FIRST',JSON.stringify(m.slice(0,3).map(x=>({name:x.name,quality:x.quality,type:x.type,url:x.url.slice(0,90),headers:x.headers}))));
            const t=await p.getStreams('108978','tv',1,1);
            console.log('TV_COUNT',t.length);
            console.log('TV_FIRST',JSON.stringify(t.slice(0,3).map(x=>({name:x.name,quality:x.quality,type:x.type,url:x.url.slice(0,90),headers:x.headers}))));
            if(!m.length || !t.length) process.exit(2);
            if(!m.some(x=>x.type==='hls')) process.exit(3);
            if(!t.some(x=>x.type==='mp4')) process.exit(4);
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
