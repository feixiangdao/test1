name: YFlix Research
on:
  push:
    paths:
      - '.github/workflows/yflix-research.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect first-party YFlix and PlayAPI bundles only
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          pages=[
            ('YFLIX','https://www.yflix.in/movies/watch/interstellar-157336'),
            ('PLAYAPI','https://player.playapi.eu.cc/movie/157336'),
          ]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','replace')
          def compact(s): return re.sub(r'\\s+',' ',s)
          for label,page in pages:
              print('===== '+label+' =====')
              html=get(page)
              host=urllib.parse.urlparse(page).netloc
              srcs=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',html,re.I)
              first=[]
              for src in srcs:
                  u=urllib.parse.urljoin(page,src)
                  if urllib.parse.urlparse(u).netloc==host: first.append(u)
              print('FIRST_PARTY_SCRIPTS',first)
              for u in first:
                  js=get(u)
                  print('SCRIPT',u,'BYTES',len(js))
                  needles=['Multi Source','Multi Dubbed','Multi Audio','BackUp','Original','playapi.eu.cc','m3u8','vidsrc','vidlink','vidfast','vidzee','moviebox','streamdata','vaplayer','server','stream','source','api.php','fetch(']
                  seen=set()
                  for needle in needles:
                      low=js.lower(); nl=needle.lower(); start=0; count=0
                      while count<8:
                          i=low.find(nl,start)
                          if i<0: break
                          frag=compact(js[max(0,i-220):min(len(js),i+520)])
                          if frag not in seen:
                              seen.add(frag)
                              print('HIT['+needle+']',frag[:780])
                          count+=1; start=i+len(nl)
                  urls=sorted(set(re.findall(r'https?://[^"\\\'\x60\\\\\\s<>]+',js)))
                  useful=[x for x in urls if not any(k in x for k in ['google','cloudflare','w3.org','schema.org','reactjs.org','github.com'])]
                  print('URLS',useful[:100])
          PY
