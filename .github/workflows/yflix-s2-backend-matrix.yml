name: YFlix S2 Backend Matrix
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-backend-matrix.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe current VidBolt/FilmU backends
        shell: bash
        run: |
          node - <<'NODE'
          const BASE='https://showbox.filmu.in';
          const KEY='09eb429913afb6b1cc90f23746f41fb3279aed77726c625c40672b81444c0bac';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const providers=['VidRock','Flaxmovies','VidFastFirst','VidFastPro','Vidflix','ShowBox','Peachify','VidRift','FSonic','CineStream'];
          const cases=[
            {label:'MOVIE',kind:'movie',id:'tt0816692',tmdb:'157336',title:'Interstellar',year:'2014'},
            {label:'TV',kind:'tv',id:'tt9288030',tmdb:'108978',title:'Reacher',year:'2022',season:'1',episode:'1'}
          ];
          async function api(provider,c){
            const q=new URLSearchParams({tmdbId:c.tmdb,title:c.title,year:c.year});
            if(c.season)q.set('season',c.season);
            if(c.episode)q.set('episode',c.episode);
            const u=BASE+'/scrape/'+provider+'/'+c.kind+'/'+c.id+'?'+q.toString();
            try{
              const r=await fetch(u,{headers:{'x-api-key':KEY,'accept':'application/json','user-agent':UA},signal:AbortSignal.timeout(16000)});
              const tx=await r.text();
              let j=null; try{j=JSON.parse(tx)}catch{}
              const rows=(j?.sources||[]);
              console.log('API',c.label,provider,r.status,'count='+rows.length,'len='+tx.length);
              for(const [i,x] of rows.slice(0,14).entries()){
                console.log('ROW',c.label,provider,i,JSON.stringify({
                  name:x?.name,quality:x?.quality,type:x?.type,
                  url:x?.url,workerProxyUrl:x?.workerProxyUrl,
                  headers:x?.headers
                }).slice(0,2200));
              }
            }catch(e){
              console.log('API_ERR',c.label,provider,String(e?.message||e));
            }
          }
          async function run(){
            for(const c of cases){
              for(const p of providers) await api(p,c);
            }
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
