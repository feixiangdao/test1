name: YFlix S2 Core Matrix
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-core-matrix.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe real VidBolt core scraper routes
        shell: bash
        run: |
          node - <<'NODE'
          const BASE='https://scraper.vidbolt.xyz';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const cases=[
            {label:'MOVIE',kind:'movie',tmdb:'157336',imdb:'tt0816692',title:'Interstellar',year:'2014'},
            {label:'TV',kind:'tv',tmdb:'108978',imdb:'tt9288030',title:'Reacher',year:'2022',season:'1',episode:'1'}
          ];
          function route(p,c){
            const id=c.imdb;
            const q=new URLSearchParams();
            if(p==='Callisto'){
              q.set('title',c.title);q.set('tmdbId',c.tmdb);q.set('year',c.year);
            } else if(p==='FastVa'){
              q.set('tmdbId',c.tmdb);q.set('imdbId',c.imdb);
            } else if(p==='Ninetta'){
              q.set('title',c.title);q.set('year',c.year);q.set('tmdbId',c.tmdb);
            } else if(p==='Saffron'){
              q.set('tmdbId',c.tmdb);q.set('imdbId',c.imdb);q.set('title',c.title);q.set('year',c.year);
            } else if(p==='Naija'){
              q.set('title',c.title);q.set('year',c.year);q.set('tmdbId',c.tmdb);q.set('imdbId',c.imdb);
            } else if(p==='Nova'){
              q.set('tmdbId',c.tmdb);
            } else if(p==='Quasar'){
              q.set('tmdbId',c.tmdb);
            }
            if(c.season){q.set('season',c.season);q.set('episode',c.episode);}
            return BASE+'/scrape/'+p+'/'+c.kind+'/'+encodeURIComponent(id)+'?'+q.toString();
          }
          async function one(p,c){
            const u=route(p,c);
            try{
              const r=await fetch(u,{headers:{accept:'application/json','user-agent':UA,referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(18000)});
              const tx=await r.text();
              let j={};try{j=JSON.parse(tx)}catch{}
              const rows=Array.isArray(j.sources)?j.sources:[];
              return {label:c.label,p,status:r.status,count:rows.length,body:rows.length?undefined:tx.slice(0,220),rows:rows.slice(0,12).map(x=>({
                name:x?.name,quality:x?.quality,type:x?.type,language:x?.language,
                durationSec:x?.durationSec,url:x?.url,workerProxyUrl:x?.workerProxyUrl,headers:x?.headers
              }))};
            }catch(e){return{label:c.label,p,error:String(e?.message||e)}}
          }
          async function run(){
            const providers=['Callisto','FastVa','Ninetta','Saffron','Naija','Nova','Quasar'];
            const jobs=[];
            for(const c of cases)for(const p of providers)jobs.push(one(p,c));
            const all=await Promise.all(jobs);
            for(const x of all)console.log('RESULT',JSON.stringify(x).slice(0,18000));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
