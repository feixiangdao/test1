name: YFlix S2 Fast Matrix
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-fast-matrix.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe VidBolt same-origin proxy backends
        shell: bash
        run: |
          node - <<'NODE'
          const BASE='https://vidbolt.xyz';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const providers=['VidRock','Flaxmovies','VidFastFirst','VidFastPro','Vidflix','ShowBox','Peachify','VidRift','FSonic','CineStream'];
          const cases=[
            {label:'MOVIE',kind:'movie',id:'tt0816692',tmdb:'157336',title:'Interstellar',year:'2014'},
            {label:'TV',kind:'tv',id:'tt9288030',tmdb:'108978',title:'Reacher',year:'2022',season:'1',episode:'1'}
          ];
          async function one(provider,c){
            const q=new URLSearchParams({tmdbId:c.tmdb,title:c.title,year:c.year});
            if(c.season)q.set('season',c.season);
            if(c.episode)q.set('episode',c.episode);
            const path='/scrape/'+provider+'/'+c.kind+'/'+c.id+'?'+q.toString();
            const u=BASE+'/api/proxy?path='+encodeURIComponent(path);
            try{
              const r=await fetch(u,{
                headers:{'accept':'application/json','user-agent':UA,'referer':BASE+'/'+c.kind+'/'+c.tmdb},
                signal:AbortSignal.timeout(15000)
              });
              const tx=await r.text();
              let j={}; try{j=JSON.parse(tx)}catch{}
              const rows=Array.isArray(j.sources)?j.sources:[];
              return {label:c.label,provider,status:r.status,count:rows.length,body:rows.length?undefined:tx.slice(0,240),rows:rows.slice(0,10).map(x=>({
                name:x?.name,quality:x?.quality,type:x?.type,url:x?.url,workerProxyUrl:x?.workerProxyUrl,headers:x?.headers
              }))};
            }catch(e){return{label:c.label,provider,error:String(e?.message||e)}}
          }
          async function run(){
            const jobs=[];
            for(const c of cases)for(const p of providers)jobs.push(one(p,c));
            const all=await Promise.all(jobs);
            for(const x of all)console.log('RESULT',JSON.stringify(x).slice(0,14000));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
