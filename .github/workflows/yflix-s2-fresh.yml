name: YFlix S2 v052 Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-fresh.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate stable S2 subset
        shell: bash
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server2-v052.js -o /tmp/s2.js
          node -c /tmp/s2.js
          node - <<'NODE'
          const p=require('/tmp/s2.js');
          async function probe(x){
            const h=Object.assign({},x.headers||{}, {Range:'bytes=0-0'});
            const r=await fetch(x.url,{headers:h,signal:AbortSignal.timeout(12000)});
            console.log('PROBE',x.name,r.status,r.headers.get('content-type')||'',r.headers.get('content-range')||'');
            if(r.status!==206) throw new Error('not range-playable '+x.name+' '+r.status);
          }
          async function run(){
            const m=await p.getStreams('157336','movie');
            console.log('MOVIE',m.length,m.map(x=>x.name));
            if(m.length!==0) throw new Error('movie must stay hidden');
            const t=await p.getStreams('108978','tv',1,1);
            console.log('TV',t.length,t.map(x=>x.name));
            if(t.length<1) throw new Error('TV has no stable stream');
            if(t.some(x=>!/Vidlink/.test(x.name))) throw new Error('unexpected TV family');
            if(t.some(x=>!/480p|360p/.test(x.name))) throw new Error('unexpected TV quality');
            for(const x of t) await probe(x);
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
