name: YFlix S2 Fresh Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-fresh.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan VidBolt backend matrix
        shell: bash
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const BASE='https://scraper.vidbolt.xyz/scrape';
          const providers=[
            'Callisto','FastVa','Ninetta','Quasar','Saffron','Naija','Nova',
            'Darkmatter','DarkMatter','MovieBoxV2','Vaplayer','FourKHDHub',
            'PlayAPI','Allmovieland','NetNaija','Vidlink','PrimeVids','Videasy'
          ];
          function qs(obj){return Object.entries(obj).filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&')}
          async function one(p,type){
            const imdb=type==='movie'?'tt0816692':'tt9288030';
            const tmdb=type==='movie'?'157336':'108978';
            const title=type==='movie'?'Interstellar':'Reacher';
            const year=type==='movie'?'2014':'2022';
            const q={tmdbId:tmdb,imdbId:imdb,title,year};
            if(type==='tv'){q.season=1;q.episode=1}
            const u=BASE+'/'+encodeURIComponent(p)+'/'+type+'/'+encodeURIComponent(imdb)+'?'+qs(q);
            try{
              const r=await fetch(u,{headers:{Accept:'application/json','User-Agent':UA,Referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(12000)});
              const tx=await r.text();
              let j=null; try{j=JSON.parse(tx)}catch{}
              const rows=j&&Array.isArray(j.sources)?j.sources:(j&&Array.isArray(j.streams)?j.streams:[]);
              return {p,type,status:r.status,count:rows.length,rows:rows.slice(0,8),head:tx.slice(0,180)};
            }catch(e){return {p,type,error:String(e?.message||e),count:0,rows:[]}}
          }
          async function probe(row){
            const url=String(row?.url||'');
            if(!/^https?:/.test(url)) return {skip:'no-url'};
            const h=Object.assign({},row.headers||{});
            const isHls=String(row.type||'').toLowerCase().includes('m3u8')||url.includes('.m3u8')||url.includes('/proxy/m3u8/');
            try{
              if(isHls){
                const r=await fetch(url,{headers:h,signal:AbortSignal.timeout(10000)});
                const tx=await r.text();
                return {kind:'hls',status:r.status,ok:r.ok&&tx.startsWith('#EXTM3U'),ct:r.headers.get('content-type')||'',head:tx.slice(0,80)};
              }
              h.Range='bytes=0-0';
              const r=await fetch(url,{headers:h,signal:AbortSignal.timeout(10000)});
              const ab=await r.arrayBuffer();
              return {kind:'file',status:r.status,ok:r.status===206||r.status===200,len:ab.byteLength,ct:r.headers.get('content-type')||'',cr:r.headers.get('content-range')||''};
            }catch(e){return {error:String(e?.message||e)}}
          }
          async function main(){
            const jobs=[];
            for(const p of providers){jobs.push(one(p,'movie'));jobs.push(one(p,'tv'))}
            const rs=await Promise.all(jobs);
            for(const x of rs){
              console.log('\nRESULT',x.p,x.type,'STATUS',x.status,'COUNT',x.count,'ERR',x.error||'');
              if(!x.count){console.log('HEAD',x.head||'');continue}
              for(let i=0;i<Math.min(x.rows.length,4);i++){
                const row=x.rows[i];
                console.log('ROW',i,JSON.stringify({name:row.name,quality:row.quality,type:row.type,language:row.language,url:row.url,headers:row.headers}).slice(0,2500));
                console.log('PROBE',i,JSON.stringify(await probe(row)));
              }
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
