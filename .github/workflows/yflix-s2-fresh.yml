name: YFlix S2 Fresh Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-fresh.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract real VidBolt dynamic chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import re, requests, urllib.parse, json
          UA='Mozilla/5.0'
          base='https://vidbolt.xyz/assets/'
          main=requests.get(base+'index-CWZT0e_1.js',headers={'User-Agent':UA},timeout=20).text
          print('MAIN_LEN',len(main))
          # print relevant import map / dynamic chunk names
          names=sorted(set(re.findall(r'["\']([^"\']+\.js)["\']',main)))
          for n in names:
              if any(k in n.lower() for k in ['embed','provider','scraper','movie','player','server','stream','dark','callisto','quasar','vidlink','vaplayer','ninetta','saffron','nova','naija','fast']):
                  print('CHUNKNAME',n)
          print('ALL_CHUNKS')
          for n in names: print(n)

          # Resolve relative to /assets/ but strip accidental assets/ prefix
          todo=[]
          for n in names:
              z=n
              if z.startswith('./'): z=z[2:]
              if z.startswith('assets/'): z=z[len('assets/'):]
              if z.endswith('.js'):
                  todo.append(urllib.parse.urljoin(base,z))
          # Always include known embedded chunk from current main.
          for m in re.finditer(r'EmbeddedOnlyEmbedPage-[A-Za-z0-9_-]+\.js',main):
              todo.append(base+m.group(0))
          seen=set()
          for u in todo:
              if u in seen: continue
              seen.add(u)
              try:r=requests.get(u,headers={'User-Agent':UA,'Referer':'https://vidbolt.xyz/movie/157336'},timeout=20)
              except Exception as e:
                  print('FETCHERR',u,e);continue
              if not r.ok or len(r.text)<100:
                  continue
              txt=r.text
              score=sum(1 for k in ['scrape/','getMovie','getTv','sources','provider','Quasar','Callisto','Vidlink','Vaplayer','MovieBox'] if k.lower() in txt.lower())
              if score<2: continue
              print('\n=== FILE',u,'LEN',len(txt),'SCORE',score,'===')
              vals=set()
              for m in re.finditer(r'["\']([^"\']{2,500})["\']',txt):
                  s=m.group(1)
                  if any(k in s.lower() for k in ['scrape/','provider','quasar','callisto','vidlink','vaplayer','moviebox','ninetta','saffron','naija','nova','fastva','darkmatter','allmovieland','playapi']):
                      vals.add(s)
              for s in sorted(vals):
                  print('STR',s[:700])
              for term in ['scrape/','Quasar','Callisto','Vidlink','Vaplayer','MovieBox','providers','scrapers']:
                  low=txt.lower();t=term.lower();pos=0;c=0
                  while c<8:
                      i=low.find(t,pos)
                      if i<0: break
                      print('CTX['+term+']',re.sub(r'\s+',' ',txt[max(0,i-600):i+1600])[:2200])
                      pos=i+len(t);c+=1
          PY
