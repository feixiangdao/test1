name: YFlix S2 Fresh Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-fresh.yml'
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Quasar direct upstreams
        shell: bash
        run: |
          node - <<'NODE'
          const API='https://scraper.vidbolt.xyz/scrape/Quasar/movie/tt0816692?tmdbId=157336';
          const UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36';
          function b64urlDecode(s){
            s=s.replace(/-/g,'+').replace(/_/g,'/');
            while(s.length%4)s+='=';
            return Buffer.from(s,'base64').toString('utf8');
          }
          function decodeProxy(u){
            try{
              const x=new URL(u);
              const parts=x.pathname.split('/').filter(Boolean);
              const i=parts.findIndex(v=>v==='segment'||v==='m3u8');
              if(i<0||!parts[i+1]) return null;
              const upstream=b64urlDecode(parts[i+1]);
              let headers={};
              const hs=x.searchParams.get('headers');
              if(hs){try{headers=JSON.parse(hs)}catch{}}
              const q=x.searchParams.get('q');
              let final=upstream;
              if(q){
                // segment proxy q can contain query-string material or u=<url>&headers=...
                const p=new URLSearchParams(q);
                if(p.get('u')) final=p.get('u');
                else final=upstream+(upstream.includes('?')?'&':'?')+q;
              }
              return {final,headers};
            }catch{return null}
          }
          async function probeFile(url,headers){
            try{
              const h=Object.assign({},headers||{}, {Range:'bytes=0-1048575'});
              const r=await fetch(url,{headers:h,signal:AbortSignal.timeout(15000)});
              const ab=await r.arrayBuffer();
              return {status:r.status,len:ab.byteLength,ct:r.headers.get('content-type')||'',cr:r.headers.get('content-range')||'',head:Buffer.from(ab).subarray(0,16).toString('hex')};
            }catch(e){return {error:String(e?.message||e)}}
          }
          async function probeHls(url,headers){
            try{
              const r=await fetch(url,{headers:headers||{},signal:AbortSignal.timeout(15000)});
              const tx=await r.text();
              return {status:r.status,ok:r.ok&&tx.startsWith('#EXTM3U'),ct:r.headers.get('content-type')||'',head:tx.slice(0,120)};
            }catch(e){return {error:String(e?.message||e)}}
          }
          async function main(){
            const r=await fetch(API,{headers:{Accept:'application/json','User-Agent':UA,Referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(20000)});
            const j=await r.json();
            const rows=j.sources||[];
            for(const x of rows){
              const n=String(x.name||'');
              if(!/streamflix|interstellar \(2014\)|vaplayer/i.test(n)) continue;
              const d=decodeProxy(String(x.url||''));
              if(!d) continue;
              const hh=Object.assign({},d.headers||{},x.headers||{});
              console.log('\nROW',n);
              console.log('UPSTREAM',d.final);
              console.log('HEADERS',JSON.stringify(hh));
              const isHls=String(x.type||'').toLowerCase()==='m3u8'||String(d.final).includes('.m3u8');
              console.log('DIRECT_PROBE',JSON.stringify(isHls?await probeHls(d.final,hh):await probeFile(d.final,hh)));
            }
            // Explicit StreamFlix direct URL seen in current Quasar response
            const sf='https://cf.streamflixserver.site/movies/2014/itenstelr.mkv';
            console.log('\nEXPLICIT_STREAMFLIX',sf,JSON.stringify(await probeFile(sf,{'User-Agent':UA})));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
