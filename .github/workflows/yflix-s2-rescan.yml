name: YFlix S2 052 Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify final S2 behavior
        shell: bash
        run: |
          set -e
          curl -fsSL 'https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server2-v052.js' -o /tmp/s2.js
          node -c /tmp/s2.js
          node - <<'NODE'
          async function probe(x){
            const h=Object.assign({},x.headers||{}, {Range:'bytes=0-0'});
            try{
              const r=await fetch(x.url,{headers:h,signal:AbortSignal.timeout(15000)});
              return {name:x.name,status:r.status,ct:r.headers.get('content-type')||'',cr:r.headers.get('content-range')||''};
            }catch(e){return {name:x.name,error:String(e.message||e)}}
          }
          async function main(){
            const p=require('/tmp/s2.js');
            const m=await p.getStreams('157336','movie');
            console.log('MOVIE_COUNT',m.length,m.map(x=>x.name));
            if(m.length!==0)throw new Error('movie should be hidden');
            const t=await p.getStreams('108978','tv',1,1);
            console.log('TV_COUNT',t.length,t.map(x=>x.name));
            if(!t.length)throw new Error('TV expected live Vidlink');
            for(const x of t){
              if(!/Vidlink/.test(x.name))throw new Error('unexpected source '+x.name);
              const q=await probe(x);
              console.log('PROBE',JSON.stringify(q));
              if(q.status!==206)throw new Error('range failed '+x.name+' '+q.status);
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE