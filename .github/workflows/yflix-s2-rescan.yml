name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test Quasar cache busting
        shell: bash
        run: |
          node - <<'NODE'
          const BASE='https://scraper.vidbolt.xyz/scrape/Quasar/movie/tt0816692';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const variants=[
            ['base','tmdbId=157336'],
            ['cb','tmdbId=157336&cb=202610080300'],
            ['fresh','tmdbId=157336&fresh=1'],
            ['nocache','tmdbId=157336&nocache=202610080300'],
            ['title','tmdbId=157336&title=Interstellar&year=2014']
          ];
          function expireOf(u){const m=String(u||'').match(/[?&]expire=(\d{10,13})/);return m?Number(m[1]):0;}
          async function firstProbe(rows){
            const x=rows.find(r=>String(r?.type||'').toLowerCase()==='m3u8'&&String(r?.name||'').includes('Interstellar'));
            if(!x)return {found:false};
            try{
              const r=await fetch(x.url,{headers:x.headers||{},signal:AbortSignal.timeout(12000)});
              const tx=await r.text();
              return {found:true,status:r.status,head:tx.slice(0,100),expire:expireOf(x.url),url:x.url};
            }catch(e){return {found:true,error:String(e?.message||e),expire:expireOf(x.url),url:x.url}}
          }
          async function one(label,q){
            try{
              const u=BASE+'?'+q;
              const r=await fetch(u,{headers:{Accept:'application/json','User-Agent':UA,Referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(20000)});
              const tx=await r.text();
              let j={};try{j=JSON.parse(tx)}catch{}
              const rows=Array.isArray(j.sources)?j.sources:[];
              const ex=rows.filter(x=>String(x?.type||'').toLowerCase()==='m3u8').map(x=>expireOf(x.url)).filter(Boolean);
              console.log('VARIANT',label,'STATUS',r.status,'COUNT',rows.length,'EXPIRES',JSON.stringify(ex.slice(0,6)),'CACHED',j.cached);
              console.log('PROBE',label,JSON.stringify(await firstProbe(rows)));
            }catch(e){console.log('ERR',label,String(e?.message||e))}
          }
          (async()=>{for(const v of variants)await one(v[0],v[1]);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
