name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe VidRock via VidBolt proxy
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          probe(){
            label="$1"; path="$2";
            echo "--- $label ---"
            code=$(curl -sS -L --max-time 35 -A "$UA" -e 'https://vidbolt.xyz/movie/157336' -H 'Accept: application/json' -G --data-urlencode "path=$path" -o /tmp/out.json -w '%{http_code}' 'https://vidbolt.xyz/api/proxy' || true)
            echo "HTTP $code SIZE $(wc -c < /tmp/out.json 2>/dev/null || echo 0)"
            head -c 24000 /tmp/out.json || true
            echo
          }
          probe 'VidRock movie' '/scrape/VidRock/movie/tt0816692?tmdbId=157336&title=Interstellar&year=2014'
          probe 'VidRock TV' '/scrape/VidRock/tv/tt9288030?tmdbId=108978&title=Reacher&year=2022&season=1&episode=1'