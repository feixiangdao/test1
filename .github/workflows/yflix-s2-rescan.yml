name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Resolve Oasis AnimeSalt global
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          mkdir -p /tmp/oasis
          for f in index-CWZT0e_1.js EmbeddedOnlyEmbedPage-CxGTx3In.js oasis-Bg0zIFi7.js; do
            curl -fsSL --max-time 25 -A "$UA" -e 'https://vidbolt.xyz/movie/157336' "https://vidbolt.xyz/assets/$f" -o "/tmp/oasis/$f" || true
          done
          echo '=== fetchAnimeSalt occurrences ==='
          grep -Rin 'fetchAnimeSalt' /tmp/oasis || true
          echo '=== AnimeSalt URLs / identifiers ==='
          grep -RhoiE 'https?://[^"'"'"' ]+|AnimeSalt|animesalt|fetchAnimeSalt[A-Za-z0-9_]*' /tmp/oasis | sort -u | head -300 || true
          echo '=== Oasis module ==='
          cat /tmp/oasis/oasis-Bg0zIFi7.js || true