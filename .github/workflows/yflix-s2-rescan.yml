name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Orion identity by HLS runtime
        shell: bash
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          function abs(base,ref){try{return new URL(ref,base).toString()}catch{return ref}}
          function sum(txt){let total=0,count=0,m;const re=/#EXTINF:([0-9.]+)/g;while((m=re.exec(String(txt||'')))){total+=Number(m[1])||0;count++;}return {total,count}}
          async function dur(url,headers={},depth=0){
            if(depth>3)return {ok:false,error:'nesting'};
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
            const t=await r.text();
            if(!r.ok||!t.startsWith('#EXTM3U'))return {ok:false,status:r.status,head:t.slice(0,100)};
            const s=sum(t);
            if(s.count)return {ok:true,status:r.status,seconds:s.total,minutes:s.total/60,count:s.count};
            const lines=t.replace(/\r/g,'').split('\n');
            let next='';
            for(const ln of lines){const x=ln.trim();if(x&&!x.startsWith('#')){next=abs(url,x);break;}}
            if(!next)return {ok:false,error:'no child'};
            return dur(next,headers,depth+1);
          }
          async function getModule(){
            const r=await fetch('https://vidbolt.xyz/assets/darkmatter-HpTILE1p.js',{headers:{'User-Agent':UA,Referer:'https://vidbolt.xyz/movie/157336'}});
            return r.text();
          }
          function keyAfter(text,marker){
            const i=text.indexOf(marker); if(i<0)return '';
            const tail=text.slice(i,i+1200);
            const m=tail.match(/["']([A-Za-z0-9_-]{20,})["']/g)||[];
            for(const q of m){const v=q.slice(1,-1);if(!v.includes('https')&&!v.includes('Mozilla'))return v}
            return '';
          }
          async function main(){
            const mod=await getModule();
            const movieKey=keyAfter(mod,'api.movy.lol');
            const tvKey=keyAfter(mod,'animecurx.tech');
            console.log('KEYS_FOUND',movieKey.length,tvKey.length);
            const movieApi='https://api.movy.lol/api/source/157336?api_key='+encodeURIComponent(movieKey)+'&apikey='+encodeURIComponent(movieKey);
            const tvApi='https://img.animecurx.tech/api/tv/108978/1/1?api_key='+encodeURIComponent(tvKey)+'&apikey='+encodeURIComponent(tvKey);
            for(const [label,api,base] of [['MOVIE',movieApi,'https://api.movy.lol'],['TV',tvApi,'https://img.animecurx.tech']]){
              try{
                const r=await fetch(api,{headers:{Accept:'application/json','User-Agent':UA},signal:AbortSignal.timeout(15000)});
                const text=await r.text();
                console.log('API',label,r.status,'LEN',text.length);
                if(!r.ok)continue;
                const j=JSON.parse(text);
                console.log('META',label,JSON.stringify({name:j.name,title:j.title,tmdbId:j.tmdbId,imdbId:j.imdbId,quality:j.quality,m3u8_path:j.m3u8_path,sources:(j.sources||[]).length}).slice(0,1500));
                const rows=Array.isArray(j.sources)?j.sources.slice():[];
                if(j.m3u8_path&&!rows.length)rows.push({url:j.m3u8_path,quality:'1080p',type:'m3u8'});
                for(let i=0;i<Math.min(rows.length,4);i++){
                  const x=rows[i]; let u=String(x.url||'');
                  if(u&&!/^https?:/i.test(u))u=base.replace(/\/$/,'')+'/'+u.replace(/^\//,'');
                  if(!u)continue;
                  const p=await dur(u,x.headers||{}).catch(e=>({ok:false,error:String(e.message||e)}));
                  console.log('STREAM',label,i,JSON.stringify({quality:x.quality,type:x.type,url:u.slice(0,180),duration:p}));
                }
              }catch(e){console.log('ERR',label,String(e.message||e));}
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE