name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test Quasar alternate path cache keys
        shell: bash
        run: |
          node - <<'NODE'
          const ROOT='https://scraper.vidbolt.xyz/scrape/Quasar/movie/';
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const ids=['tt0816692','tmdb157336','157336'];
          function expireOf(u){const m=String(u||'').match(/[?&]expire=(\d{10,13})/);return m?Number(m[1]):0;}
          async function probe(x){
            if(!x)return null;
            try{
              const r=await fetch(x.url,{headers:x.headers||{},signal:AbortSignal.timeout(12000)});
              const tx=await r.text();
              return {status:r.status,head:tx.slice(0,100),expire:expireOf(x.url),url:x.url};
            }catch(e){return {error:String(e?.message||e),expire:expireOf(x.url),url:x.url}}
          }
          async function run(){
            for(const id of ids){
              const u=ROOT+encodeURIComponent(id)+'?tmdbId=157336';
              try{
                const r=await fetch(u,{headers:{Accept:'application/json','User-Agent':UA,Referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(20000)});
                const tx=await r.text();
                let j={};try{j=JSON.parse(tx)}catch{}
                const rows=Array.isArray(j.sources)?j.sources:[];
                const hls=rows.filter(x=>String(x?.type||'').toLowerCase()==='m3u8'&&String(x?.name||'').includes('Interstellar'));
                console.log('ID',id,'STATUS',r.status,'COUNT',rows.length,'CACHED',j.cached,'HLS',hls.length,'EXPIRES',JSON.stringify(hls.map(x=>expireOf(x.url))));
                console.log('FIRST',id,JSON.stringify(await probe(hls[0])));
              }catch(e){console.log('ERR',id,String(e?.message||e))}
            }
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
