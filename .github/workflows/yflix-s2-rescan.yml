name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect active VidBolt provider modules
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          mkdir -p /tmp/vbmods
          mods='vaplayer-0F78SnNd.js fourkhdhub-DhLoTLQ0.js netnaija-fyGxFQcY.js vidlink-_TJ5hLAe.js vidr-_MrUkJWh.js localapiscraper-B_Gz3ANy.js oasis-Bg0zIFi7.js darkmatter-HpTILE1p.js playapi-Dh80i7LV.js allmovieland-CsLQcLP1.js callisto-Ud7vipgB.js scraperUrl-DC5Xrq2-.js'
          for m in $mods; do
            echo "=== $m ==="
            curl -fsSL --max-time 25 -A "$UA" -e 'https://vidbolt.xyz/movie/157336' "https://vidbolt.xyz/assets/$m" -o "/tmp/vbmods/$m" || true
            echo "SIZE $(wc -c < /tmp/vbmods/$m 2>/dev/null || echo 0)"
            cat "/tmp/vbmods/$m" | head -c 18000 || true
            echo
          done