name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe hidden VidBolt local scrapers
        shell: bash
        run: |
          node - <<'NODE'
          const UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36';
          const base='https://vidbolt.xyz/api/proxy?path=';
          const defs=[
            ['Halo','Flaxmovies',true],
            ['VidFastFirst','VidFastFirst',true],
            ['Vault4K','VidFastPro',true],
            ['Vidflix','Vidflix',true],
            ['ShowBox','ShowBox',true],
            ['Vertex','Peachify',false],
            ['Blaze','VidRift',true],
            ['Ember','FSonic',true],
            ['Omega','CineStream',true]
          ];
          function pathFor(scraper,type){
            const id=type==='movie'?'tt0816692':'tt9288030';
            const tmdb=type==='movie'?'157336':'108978';
            const title=type==='movie'?'Interstellar':'Reacher';
            const year=type==='movie'?'2014':'2022';
            let q='tmdbId='+tmdb;
            if(scraper!=='Peachify'){q+='&title='+encodeURIComponent(title)+'&year='+year;}
            if(type==='tv')q+='&season=1&episode=1';
            return '/scrape/'+scraper+'/'+type+'/'+id+'?'+q;
          }
          async function probe(label,scraper,type){
            const p=pathFor(scraper,type);
            const url=base+encodeURIComponent(p);
            const started=Date.now();
            try{
              const r=await fetch(url,{headers:{Accept:'application/json','User-Agent':UA,Referer:'https://vidbolt.xyz/'},signal:AbortSignal.timeout(12000)});
              const tx=await r.text();
              let summary={label,scraper,type,status:r.status,ms:Date.now()-started,len:tx.length};
              try{
                const j=JSON.parse(tx);
                summary.count=Array.isArray(j.sources)?j.sources.length:0;
                summary.rows=(j.sources||[]).slice(0,6).map(x=>({name:x.name,quality:x.quality,type:x.type,url:String(x.url||'').slice(0,220),workerProxyUrl:String(x.workerProxyUrl||'').slice(0,220),headers:x.headers}));
              }catch{summary.head=tx.slice(0,160)}
              console.log('RESULT',JSON.stringify(summary));
            }catch(e){
              console.log('RESULT',JSON.stringify({label,scraper,type,error:String(e.message||e),ms:Date.now()-started}));
            }
          }
          async function main(){
            const jobs=[];
            for(const [label,scraper,hasTv] of defs){
              jobs.push(probe(label,scraper,'movie'));
              if(hasTv&&scraper!=='FSonic')jobs.push(probe(label,scraper,'tv'));
            }
            await Promise.all(jobs);
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE