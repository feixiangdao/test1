name: YFlix S2 Rescan
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-rescan.yml'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current VidBolt embedded player module
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          curl -fsSL --max-time 25 -A "$UA" -e 'https://vidbolt.xyz/movie/157336' 'https://vidbolt.xyz/assets/EmbeddedOnlyEmbedPage-CxGTx3In.js' -o /tmp/embed.js
          echo 'SIZE' $(wc -c < /tmp/embed.js)
          echo '=== FULL EMBED MODULE ==='
          head -c 60000 /tmp/embed.js
          echo
          echo '=== JS ASSET REFERENCES ==='
          grep -oE '[A-Za-z0-9._-]+\.js' /tmp/embed.js | sort -u | head -300 || true
          echo '=== PROVIDER KEYWORDS ==='
          grep -oEi 'Callisto|Quasar|Saffron|Orion|FastVa|Ninetta|Naija|Nova|Vidlink|Vaplayer|MovieBoxV2|Allmovieland|Darkmatter|Fourkhdhub|PlayAPI|provider[A-Za-z0-9_-]*' /tmp/embed.js | sort -u || true