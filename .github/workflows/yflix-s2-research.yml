name: YFlix S2 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-research.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Smoke test YFlix S2 provider
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server2.js -o /tmp/yflix-s2.js
          node - <<'NODE'
          const p=require('/tmp/yflix-s2.js');
          async function check(url, headers){
            try{
              const r=await fetch(url,{headers:headers||{},signal:AbortSignal.timeout(12000)});
              const ct=r.headers.get('content-type')||'';
              const text=(ct.includes('mpegurl')||url.includes('.m3u8')||url.includes('workers.dev')) ? (await r.text()).slice(0,80) : '';
              return {status:r.status,ct,text};
            }catch(e){return {error:String(e.message||e)}}
          }
          async function run(){
            const m=await p.getStreams('157336','movie');
            console.log('MOVIE_COUNT',m.length);
            console.log('MOVIE_NAMES',m.slice(0,12).map(x=>x.name));
            const t=await p.getStreams('108978','tv',1,1);
            console.log('TV_COUNT',t.length);
            console.log('TV_NAMES',t.slice(0,12).map(x=>x.name));
            if(!m.length||!t.length) process.exit(2);
            const tests=[];
            for(const x of m.slice(0,3)) tests.push({name:x.name,result:await check(x.url,x.headers)});
            for(const x of t.slice(0,2)) tests.push({name:x.name,result:await check(x.url,x.headers)});
            console.log('PROBES',JSON.stringify(tests));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
