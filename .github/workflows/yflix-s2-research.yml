name: YFlix S2 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-research.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect VidBolt iframe response and scripts
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request, urllib.parse, json
          PAGE='https://vidbolt.xyz/movie/157336'
          REF='https://www.yflix.in/movies/watch/interstellar-157336'
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          def get(url, referer=REF):
              req=urllib.request.Request(url,headers={
                'User-Agent':UA,
                'Accept':'text/html,application/xhtml+xml,application/json,*/*',
                'Referer':referer,
                'Sec-Fetch-Dest':'iframe',
                'Sec-Fetch-Mode':'navigate',
                'Sec-Fetch-Site':'cross-site'
              })
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.geturl(), r.status, dict(r.headers), r.read().decode('utf-8','replace')
          final,status,hdr,html=get(PAGE)
          print('FINAL',final,'STATUS',status,'LEN',len(html))
          print('HTML_BEGIN')
          print(html[:50000])
          print('HTML_END')
          srcs=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)',html,re.I)
          print('SCRIPTS',srcs)
          for src in srcs:
              u=urllib.parse.urljoin(final,src)
              try:
                  fu,st,h,js=get(u,final)
              except Exception as e:
                  print('SCRIPT_FAIL',u,repr(e)); continue
              print('SCRIPT',fu,'STATUS',st,'LEN',len(js))
              needles=['fetch(','/api/','m3u8','mp4','source','server','provider','tmdb','episode','movie','vidsrc','vidlink','embed','decrypt','crypto','token']
              low=js.lower()
              seen=set()
              for n in needles:
                  start=0
                  while True:
                      i=low.find(n.lower(),start)
                      if i<0: break
                      frag=re.sub(r'\\s+',' ',js[max(0,i-280):min(len(js),i+700)])
                      if frag not in seen:
                          seen.add(frag); print('HIT['+n+']',frag[:1000])
                      start=i+len(n)
                      if len(seen)>120: break
                  if len(seen)>120: break
              urls=sorted(set(re.findall(r'https?://[^"\\\'\x60\\s<>]+',js)))
              print('URLS',urls[:120])
          PY
