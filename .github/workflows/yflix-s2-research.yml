name: YFlix S2 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s2-research.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect VidBolt app bundle only
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          U='https://vidbolt.xyz/assets/index-CWZT0e_1.js'
          H={
            'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36',
            'Referer':'https://vidbolt.xyz/movie/157336',
            'Accept':'*/*'
          }
          req=urllib.request.Request(U,headers=H)
          js=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          print('LEN',len(js))

          # Absolute URLs/domains
          urls=sorted(set(re.findall(r'https?://[^"\\\'\x60\\s<>]+',js)))
          print('ABS_URLS')
          for u in urls:
              if not any(x in u for x in ['google','cloudflare','fonts.','gstatic','themoviedb.org','image.tmdb.org','flagcdn']):
                  print(u[:500])

          # String literals containing likely API/media terms
          pats=[
            r'["\\\']([^"\\\']*(?:/api/|m3u8|mp4|playlist|source|stream|server|provider|tmdb|embed|vidsrc|vidlink|flix|dub)[^"\\\']*)["\\\']'
          ]
          vals=set()
          for pat in pats:
              for m in re.finditer(pat,js,re.I):
                  s=m.group(1)
                  if 2 < len(s) < 500:
                      vals.add(s)
          print('INTERESTING_STRINGS')
          for s in sorted(vals):
              print(s[:500])

          # Context around high-signal function calls / endpoints
          for needle in ['fetch(', 'axios', '/api/', 'sources', 'streams', 'providers', 'servers', 'm3u8', 'decrypt', 'atob(', 'CryptoJS', 'tmdbId']:
              print('===',needle,'===')
              start=0; count=0; low=js.lower(); nd=needle.lower()
              while count<20:
                  i=low.find(nd,start)
                  if i<0: break
                  frag=re.sub(r'\\s+',' ',js[max(0,i-350):min(len(js),i+900)])
                  print(frag[:1300])
                  start=i+len(nd); count+=1
          PY
