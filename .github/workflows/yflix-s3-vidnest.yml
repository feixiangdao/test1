name: YFlix S3 Provider Smoke
on:
  push:
    paths:
      - '.github/workflows/yflix-s3-vidnest.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test final S3 provider
        shell: bash
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server3.js -o /tmp/s3.js
          node -c /tmp/s3.js
          node - <<'NODE'
          const p=require('/tmp/s3.js');
          async function probe(x){
            const r=await fetch(x.url,{headers:x.headers||{},signal:AbortSignal.timeout(15000)});
            const tx=await r.text();
            return {name:x.name,status:r.status,ct:r.headers.get('content-type')||'',head:tx.slice(0,80).replace(/\n/g,'\\n')};
          }
          async function run(){
            const m=await p.getStreams('157336','movie');
            const t=await p.getStreams('108978','tv',1,1);
            console.log('MOVIE_COUNT',m.length);
            console.log('MOVIE_NAMES',m.map(x=>x.name));
            console.log('TV_COUNT',t.length);
            console.log('TV_NAMES',t.map(x=>x.name));
            if(!m.length)throw new Error('S3 movie empty');
            if(!t.length)throw new Error('S3 tv empty');
            console.log('MOVIE_PROBE',JSON.stringify(await probe(m[0])));
            console.log('TV_PROBE',JSON.stringify(await probe(t[0])));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
