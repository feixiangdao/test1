name: YFlix S4 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s4-research.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect FilmU TV-capable endpoints
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://embed.filmu.in/assets/servers-B7U1aDDl.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://embed.filmu.in/tv/108978/1/1'})
          s=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          terms=['MovieBoxV2','FilmU Nebula','/api/apollo?','singularity-tv','VidRock','PrimeVids','FilmU Hindi']
          for term in terms:
              print('\n=== '+term+' ===')
              pos=0
              for z in range(5):
                  i=s.find(term,pos)
                  if i<0:break
                  print(re.sub(r'\s+',' ',s[max(0,i-2000):i+3500])[:5500])
                  pos=i+len(term)
          PY
