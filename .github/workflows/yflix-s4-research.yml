name: YFlix S4 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s4-research.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract targeted FilmU provider definitions
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          U='https://embed.filmu.in/assets/servers-B7U1aDDl.js'
          req=urllib.request.Request(U,headers={
            'User-Agent':'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36',
            'Referer':'https://embed.filmu.in/movie/157336'
          })
          txt=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          print('LEN',len(txt))
          needles=[
            'Multi-language HD stream',
            'Premium HD streams',
            'PrimeVids',
            'StreamVault',
            'High quality Hindi stream',
            'High quality English stream',
            'Direct-play Hindi stream',
            'Top multi-server streaming',
            'Fast direct-play stream',
            'Reliable multi-title HD source',
            'https://api.filmu.in',
            'https://movieapi4.filmu.in',
            'https://ott.filmu.in',
            'https://box.filmu.in',
            'https://prime.filmu.in',
            'https://server2.filmu.in',
            'https://rive.filmu.in',
            'https://wormhole.filmu.in'
          ]
          for needle in needles:
              print('\n===== '+needle+' =====')
              low=txt.lower(); nd=needle.lower(); start=0; count=0
              while count<8:
                  i=low.find(nd,start)
                  if i<0: break
                  frag=re.sub(r'\s+',' ',txt[max(0,i-1400):min(len(txt),i+2500)])
                  print(frag[:3900])
                  start=i+len(nd); count+=1

          print('\n===== LIKELY PROVIDER OBJECTS =====')
          for m in re.finditer(r'(?:name|scraperName|label|description):["\'][^"\']*(?:PrimeVids|StreamVault|Multi-language|Hindi|English|multi-server)[^"\']*["\']',txt,re.I):
              i=m.start()
              print(re.sub(r'\s+',' ',txt[max(0,i-1800):min(len(txt),i+3500)])[:5300])
          PY
