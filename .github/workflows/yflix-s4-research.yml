name: YFlix S4 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s4-research.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Smoke test YFlix S4 provider
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/feixiangdao/test1/main/yflix-nuvio/providers/yflix-server4.js -o /tmp/yflix-s4.js
          node - <<'NODE'
          const p=require('/tmp/yflix-s4.js');
          async function probe(x){
            try{
              const r=await fetch(x.url,{headers:x.headers||{},signal:AbortSignal.timeout(12000)});
              const ct=r.headers.get('content-type')||'';
              const tx=await r.text();
              return {name:x.name,status:r.status,ct,head:tx.slice(0,60).replace(/\n/g,'\\n')};
            }catch(e){return {name:x.name,error:String(e.message||e)}}
          }
          async function run(){
            const m=await p.getStreams('157336','movie');
            const t=await p.getStreams('108978','tv',1,1);
            console.log('MOVIE_COUNT',m.length);
            console.log('MOVIE_NAMES',m.map(x=>x.name));
            console.log('TV_COUNT',t.length);
            console.log('TV_NAMES',t.map(x=>x.name));
            if(!m.length||!t.length) process.exit(2);
            for(const x of m.slice(0,3)) console.log('MOVIE_PROBE',JSON.stringify(await probe(x)));
            for(const x of t.slice(0,3)) console.log('TV_PROBE',JSON.stringify(await probe(x)));
          }
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
