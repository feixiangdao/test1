name: YFlix S4 Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s4-research.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Extract FilmU endpoint templates
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://embed.filmu.in/assets/servers-B7U1aDDl.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://embed.filmu.in/movie/157336'})
          s=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          terms=[
            '/api/singularity-',
            '/scrape/Citadel/',
            '/scrape/PrimeVids/',
            '/scrape/Quasar/',
            '/scrape/Nova/',
            '/scrape/Allmovieland/',
            '/stream/solstice/',
            '/stream/flowcast/',
            'movieapi4.filmu.in',
            'api.filmu.in',
            'ott.filmu.in',
            'box.filmu.in',
            'wormhole.filmu.in/proxy'
          ]
          for term in terms:
              print('\n=== '+term+' ===')
              pos=0
              for z in range(8):
                  i=s.find(term,pos)
                  if i<0: break
                  print(re.sub(r'\s+',' ',s[max(0,i-1200):i+2200])[:3400])
                  pos=i+len(term)
          PY
