name: YFlix S5 Probe
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test current native CineSrc resolver
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver.git /tmp/cs
          cd /tmp/cs
          npm ci --ignore-scripts=false
          cat > probe.mjs <<'JS'
          import { parseStreamQuery, fetchProviderCatalog, resolveProviderStream } from './src/resolve/live.js';
          const input=parseStreamQuery({id:'157336',type:'movie'});
          console.log('INPUT',JSON.stringify(input));
          const started=Date.now();
          const cat=await fetchProviderCatalog(input);
          console.log('CATALOG_MS',Date.now()-started);
          console.log('CATALOG',JSON.stringify(cat));
          for(const p of cat.providers.slice(0,4)){
            const t=Date.now();
            try{
              const r=await resolveProviderStream(input,p.id);
              console.log('PROVIDER',p.id,p.name,'MS',Date.now()-t,JSON.stringify(r));
              if(r?.ok && r?.url){
                try{
                  const pr=await fetch(r.url,{headers:{Referer:'https://cinesrc.st/'},signal:AbortSignal.timeout(15000)});
                  const tx=await pr.text();
                  console.log('PLAYLIST',pr.status,pr.headers.get('content-type'),tx.slice(0,220).replace(/\n/g,'\\n'));
                }catch(e){console.log('PLAYLIST_ERR',String(e?.message||e));}
                break;
              }
            }catch(e){console.log('PROVIDER_ERR',p.id,p.name,String(e?.message||e));}
          }
          JS
          node probe.mjs