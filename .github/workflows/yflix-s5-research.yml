name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test pure HTTP CineSrc challenge flow
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, requests, time

          ORIGIN="https://cinesrc.st"
          API="https://enc-dec.app/api"
          UA="Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Mobile Safari/537.36"
          BASE={
            "Accept":"text/x-component",
            "Accept-Language":"en-GB,en-US;q=0.9,en;q=0.8",
            "Content-Type":"text/plain;charset=UTF-8",
            "Origin":ORIGIN,
            "Referer":ORIGIN+"/",
            "User-Agent":UA,
            "sec-ch-ua":'"Chromium";v="137", "Not/A)Brand";v="24"',
            "sec-ch-ua-mobile":"?1",
            "sec-ch-ua-platform":'"Android"',
            "sec-fetch-dest":"empty",
            "sec-fetch-mode":"cors",
            "sec-fetch-site":"same-origin",
          }

          def u32(x): return x & 0xffffffff
          def rotl(x,n):
            n &= 31
            if n == 0: return u32(x)
            return u32((x << n) | (x >> (32-n)))
          def imul(a,b): return ((a & 0xffffffff)*(b & 0xffffffff)) & 0xffffffff
          def read_le32(b,p): return u32(b[p]|(b[p+1]<<8)|(b[p+2]<<16)|(b[p+3]<<24))
          def write_le32(b,p,x):
            x=u32(x); b[p]=x&255; b[p+1]=(x>>8)&255; b[p+2]=(x>>16)&255; b[p+3]=(x>>24)&255
          def b64d(s):
            s=s.replace("-","+").replace("_","/")
            s += "="*((-len(s))%4)
            return bytearray(base64.b64decode(s))
          def build(w,m):
            s=[0]*4096
            x=u32(w[m&3] ^ u32(imul(m,0x9e3779b1)-0x61c8864f) ^ 0xa5a5a5a5)
            y=0x85ebca6b
            for i in range(4096):
              x=u32(x+y+w[i&3]); x=u32(x^(x<<13)); x=u32(x^(x>>17)); x=u32(x^(x<<5))
              s[i]=u32(x+imul(i^m,0xc2b2ae35)+rotl(w[(i+m)&3],i+m))
              y=u32(y-0x7a143595)
            return s
          def mix(w,s,m,n):
            lo=n&0xffffffff; hi=(n>>32)&0xffffffff
            a=u32(w[0]^imul(m+1,0x27d4eb2d)^lo)
            b=u32(w[2]^rotl(lo,m+5))
            c=u32(hi^(w[1]^0x165667b1))
            d=u32(w[3]^rotl(u32(lo^hi),m+11))
            y=2667
            for rr in range(1,9):
              v=s[(imul(c,2481)^rotl(b,rr)^y^a)&4095]
              op=((rr+m-1)&7)-1
              if op==-1:
                a=rotl(u32(a+d+v),5); c=u32(imul(a^c,0x9e3779b1)+b)
              elif op==0:
                b=rotl(u32(b^c^v),11); d=u32(imul(b^a,0x85ebca6b)+d)
              elif op==1:
                c=rotl(u32(b+c+v),17); a=u32(imul(c^d,0xc2b2ae35)^a)
              elif op==2:
                d=rotl(u32(a^d^v),23); b=u32(imul(d^c,0x27d4eb2d)+b)
              elif op==3:
                a=u32(imul(a^v,0x165667b1)+rotl(b,7)); d=u32(rotl(u32(a+c),13)^d)
              elif op==4:
                c=u32(imul(u32(v+c),0xd3a2646c)^rotl(d,9)); b=u32(rotl(c^a,19)+b)
              elif op==5:
                b=u32(imul(b^v,0xfd7046c5)+rotl(a,3)); c=u32(rotl(u32(b+d),15)^c)
              else:
                d=u32(imul(u32(d+v),0xb55a4f09)^rotl(c,21)); a=u32(rotl(d^b,27)+a)
              y += 2667
            return lo,hi,a,c,b,d
          def diff(h,d):
            q=d>>3; r=d&7
            for i in range(q):
              if h[i]: return False
            return r==0 or (h[q]>>(8-r))==0
          def solve1(data):
            raw=b64d(data["w"]); d=raw[5]; m=raw[6]
            w=[read_le32(raw,8),read_le32(raw,12),read_le32(raw,16),read_le32(raw,20)]
            s=build(w,m); msg=bytearray(42); msg[0:16]=raw[8:24]; msg[40]=2; msg[41]=m
            n=0
            while True:
              lo,hi,a,c,b2,d2=mix(w,s,m,n)
              write_le32(msg,16,lo); write_le32(msg,20,hi); write_le32(msg,24,a); write_le32(msg,28,c); write_le32(msg,32,b2); write_le32(msg,36,d2)
              if diff(hashlib.sha256(msg).digest(),d): return f"m2.{n:x}"
              n+=1
          def b64url_text(s):
            s += "="*((-len(s))%4)
            return base64.urlsafe_b64decode(s).decode()
          def solve2(data):
            target=data["pack"][0][::-1]; salt=data["pack"][3][::-1]; rr=data["pack"][4][::-1]
            body=b64url_text(rr.split(".")[1]); payload=b64url_text(body.split(".",1)[1]); difficulty=json.loads(payload)["d"]
            width=(difficulty+3)//4
            for counter in range(1<<difficulty):
              key=format(counter,"x").zfill(width)
              if hashlib.sha256((salt+key).encode()).hexdigest()==target: return key
            raise RuntimeError("stage2 no solution")

          def validate_enc(obj,label):
            print(label,"status",obj.get("status"),"error",obj.get("error"))
            if obj.get("status") != 200 or "result" not in obj:
              raise RuntimeError(f"{label} failed {obj}")
            return obj["result"]

          def run(kind,tmdb,imdb,season=None,episode=None):
            is_tv=kind=="tv"
            embed=f"{ORIGIN}/embed/tv/{imdb}?s={season}&e={episode}" if is_tv else f"{ORIGIN}/embed/movie/{imdb}"
            fields=[kind,str(tmdb),str(season) if is_tv else None,str(episode) if is_tv else None]
            encoded=base64.urlsafe_b64encode(json.dumps(fields,separators=(",",":")).encode()).decode().rstrip("=")
            sess=requests.Session()
            h={**BASE,"x-cs-q":encoded}

            t=time.time()
            b=sess.post(ORIGIN+"/api/c/bootstrap",headers=h,timeout=20)
            print("\n",kind,"bootstrap",b.status_code,b.text[:300],"cookies",sess.cookies.get_dict())
            b.raise_for_status(); bj=b.json()
            ch={**BASE,"x-cs-q":encoded,"x-cs-r":bj["r"],"x-cs-p":bj["p"]}

            c1=sess.get(ORIGIN+"/api/c/issue",headers=ch,timeout=20)
            print(kind,"issue1",c1.status_code,c1.text[:180]); c1.raise_for_status(); j1=c1.json()
            s1=solve1(j1); print(kind,"solve1",s1,"ms",int((time.time()-t)*1000))

            c2=sess.get(ORIGIN+"/api/c/stage2/issue",headers=ch,timeout=20)
            print(kind,"issue2",c2.status_code,c2.text[:180]); c2.raise_for_status(); j2=c2.json()
            s2=solve2(j2); print(kind,"solve2",s2,"ms",int((time.time()-t)*1000))

            er=requests.post(API+"/enc-cinesrc",json={"url":embed,"agent":UA,"challenge_data":{"stage1":{"challenge":j1,"solution":s1},"stage2":{"challenge":j2,"solution":s2}}},timeout=30)
            print(kind,"enc HTTP",er.status_code,er.text[:500])
            er.raise_for_status(); enc=validate_enc(er.json(),"enc")
            fulltoken=f"{enc['token']}::c3::{bj['r']}"
            actions=enc["headers"]

            hp={**BASE,"Next-Action":actions["getProviderList"]}
            pr=sess.post(embed,headers=hp,data="[]",timeout=30)
            print(kind,"providers HTTP",pr.status_code,"len",len(pr.text),"head",pr.text[:700].replace("\n","\\n"))
            if pr.status_code != 200: return
            lines=pr.text.splitlines()
            plist=None
            for line in lines:
              if line.startswith("1:"):
                try: plist=json.loads(line[2:]); break
                except: pass
            if not isinstance(plist,list):
              print(kind,"provider parse failed"); return
            print(kind,"providers",[(x.get("id"),x.get("name"),x.get("rank")) for x in plist[:20]])

            for p in plist[:8]:
              pid=p.get("id")
              hs={**BASE,"Next-Action":actions["getStream"]}
              args=[str(tmdb),"show" if is_tv else "movie",str(season) if is_tv else "$undefined",str(episode) if is_tv else "$undefined",fulltoken,pid]
              sr=sess.post(embed,headers=hs,data=json.dumps(args,separators=(",",":")),timeout=30)
              print(kind,"provider",pid,"HTTP",sr.status_code,"len",len(sr.text),"head",sr.text[:220].replace("\n","\\n"))
              if sr.status_code != 200 or "invalid_challenge" in sr.text: continue
              line=(sr.text.splitlines()[1] if len(sr.text.splitlines())>1 else "")
              if "," not in line: continue
              encrypted=line.split(",",1)[1].split(":",1)[0]
              dr=requests.post(API+"/dec-cinesrc",json={"text":encrypted,"key":enc["key"]},timeout=30)
              print(kind,"dec",pid,dr.status_code,dr.text[:900])
              try:
                dj=dr.json()
                if dj.get("status")==200: break
              except: pass

          run("movie","157336","tt0816692")
          run("tv","108978","tt9288030","1","1")
          PY
