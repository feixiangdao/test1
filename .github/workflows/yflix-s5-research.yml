name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trace native Stage2 request headers
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"    const response = await fetch(url, { ...init, headers })\\n    captureSetCookies(response, cookies)\\n    return response\";new=\"    if (parsed.pathname === '/api/c/stage2/issue') console.log('STAGE2_REQ_HEADERS', JSON.stringify([...headers.entries()]))\\n    const response = await fetch(url, { ...init, headers })\\n    if (parsed.pathname === '/api/c/stage2/issue') { console.log('STAGE2_STATUS', response.status); try { console.log('STAGE2_BODY', (await response.clone().text()).slice(0,1200)) } catch {} }\\n    captureSetCookies(response, cookies)\\n    return response\";assert old in s;open(p,'w').write(s.replace(old,new))"
          npm ci >/dev/null
          cat > trace-stage2.mjs <<'NODE'
          import { createChallengeHost } from './src/protection/host.js';
          import { mintLockedSession } from './src/protection/session.js';
          let host;
          try{
            host=await createChallengeHost('/embed/movie/157336');
            console.log('HOST_READY');
            const session=await mintLockedSession(host,false);
            console.log('MINT_OK',session.token.length);
          }catch(e){
            console.log('ERR_TYPE',typeof e,e?.constructor?.name);
            console.log('ERR_STRING',String(e?.message||e));
          }finally{
            try{host?.release();}catch{}
          }
          process.exit(0);
          NODE
          node trace-stage2.mjs
