name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Directly trace CineSrc getStream Server Action
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"headers.set('x-cs-r', requestToken)\\n      }\";new=\"headers.set('x-cs-r', requestToken)\\n        if (protectionHeader) headers.set('x-cs-q', protectionHeader)\\n        if (requestPacket) headers.set('x-cs-p', requestPacket)\\n      }\";assert old in s;open(p,'w').write(s.replace(old,new))"
          npm ci >/dev/null
          cat > direct-action.mjs <<'NODE'
          import { parseStreamQuery } from './src/resolve/live.js';
          import { createChallengeHost } from './src/protection/host.js';
          import { mintLockedSession } from './src/protection/session.js';
          import { discoverServerActions } from './src/site/actions.js';
          import { buildActionHeaders, SITE_ORIGIN } from './src/site/config.js';

          const input=parseStreamQuery({id:'157336',type:'movie'});
          const actions=await discoverServerActions(input.embedPath);
          console.log('ACTIONS',JSON.stringify(actions));
          const host=await createChallengeHost(input.embedPath);
          console.log('HOST_READY');

          for(const pid of ['nebula','wave','surge','storm','pulse']){
            try{
              const m0=Date.now();
              const session=await mintLockedSession(host,true);
              console.log('MINTED',pid,'ms',Date.now()-m0,'tokenLen',session.token.length);
              const args=[String(input.id),'movie','$undefined','$undefined',session.token,pid];
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),12000);
              const p0=Date.now();
              try{
                console.log('POST_START',pid);
                const response=await session.fetch(SITE_ORIGIN+input.embedPath,{
                  method:'POST',
                  headers:buildActionHeaders(actions.fetchStream,input.route),
                  body:JSON.stringify(args),
                  signal:controller.signal
                });
                console.log('POST_HEADERS',pid,'ms',Date.now()-p0,'status',response.status);
                const raw=await response.text();
                console.log('POST_BODY',pid,'len',raw.length,'head',raw.slice(0,600).replace(/\n/g,'\\n'));
                const d0=Date.now();
                try{
                  const decoded=await Promise.race([
                    session.decode(raw),
                    new Promise((_,reject)=>setTimeout(()=>reject(new Error('decode_timeout')),5000))
                  ]);
                  console.log('DECODED',pid,'ms',Date.now()-d0,JSON.stringify(decoded).slice(0,2500));
                }catch(e){
                  console.log('DECODE_ERR',pid,String(e?.message||e));
                }
              }finally{
                clearTimeout(timer);
              }
            }catch(e){
              console.log('PROVIDER_ERR',pid,String(e?.name||''),String(e?.message||e));
            }
          }
          try{host.release();}catch{}
          process.exit(0);
          NODE
          node direct-action.mjs
