name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test patched CineSrc Surge with extended timeout
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"headers.set('x-cs-r', requestToken)\\n      }\";new=\"headers.set('x-cs-r', requestToken)\\n        if (protectionHeader) headers.set('x-cs-q', protectionHeader)\\n        if (requestPacket) headers.set('x-cs-p', requestPacket)\\n      }\";assert old in s;open(p,'w').write(s.replace(old,new))"
          sed -i 's/const FETCH_TIMEOUT_MS = 15_000/const FETCH_TIMEOUT_MS = 45_000/' src/resolve/live.js
          sed -i 's/const PROVIDER_TIMEOUT_MS = 15_000/const PROVIDER_TIMEOUT_MS = 55_000/' src/resolve/live.js
          npm ci >/dev/null
          cat > test-one.mjs <<'NODE'
          import { parseStreamQuery, fetchProviderCatalog, resolveProviderStream } from './src/resolve/live.js';
          function collectUrls(v,out){
            if(!v)return;
            if(typeof v==='string'){if(/^https?:\/\//i.test(v))out.push(v);return;}
            if(Array.isArray(v)){for(const x of v)collectUrls(x,out);return;}
            if(typeof v==='object'){for(const k of Object.keys(v))collectUrls(v[k],out);}
          }
          const input=parseStreamQuery({id:'157336',type:'movie'});
          const started=Date.now();
          try{
            const cat=await fetchProviderCatalog(input);
            console.log('CATALOG_MS',Date.now()-started);
            console.log('CATALOG',JSON.stringify(cat.providers));
            const p0=Date.now();
            const r=await resolveProviderStream(input,'surge');
            console.log('RESOLVE_MS',Date.now()-p0);
            console.log('RESULT_JSON',JSON.stringify(r,null,2));
            const urls=[]; collectUrls(r,urls);
            console.log('URLS',JSON.stringify(urls));
            for(const u of urls.filter(x=>/m3u8|playlist/i.test(x)).slice(0,3)){
              try{
                const pr=await fetch(u,{
                  headers:{
                    Referer:'https://cinesrc.st/',
                    'User-Agent':'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/137.0.0.0 Mobile Safari/537.36'
                  },
                  signal:AbortSignal.timeout(15000)
                });
                const t=await pr.text();
                console.log('HLS',pr.status,pr.headers.get('content-type'),u,t.slice(0,220).replace(/\n/g,'\\n'));
              }catch(e){console.log('HLS_ERR',String(e?.message||e));}
            }
          }catch(e){
            console.log('TOTAL_MS',Date.now()-started);
            console.log('ERR_TYPE',typeof e,e?.constructor?.name);
            try{console.log('ERR_JSON',JSON.stringify(e,null,2));}catch{}
            try{console.log('ERR_KEYS',Object.getOwnPropertyNames(e));}catch{}
            try{for(const k of Object.getOwnPropertyNames(e)){console.log('ERR_FIELD',k,JSON.stringify(e[k]));}}catch{}
            console.log('ERR_STRING',String(e?.message||e));
          }
          process.exit(0);
          NODE
          node test-one.mjs
