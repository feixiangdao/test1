name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose patched CineSrc Surge
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"headers.set('x-cs-r', requestToken)\n      }\";new=\"headers.set('x-cs-r', requestToken)\n        if (protectionHeader) headers.set('x-cs-q', protectionHeader)\n        if (requestPacket) headers.set('x-cs-p', requestPacket)\n      }\";assert old in s;open(p,'w').write(s.replace(old,new))"
          npm ci >/dev/null
          node --input-type=module <<'NODE'
          import { parseStreamQuery, fetchProviderCatalog, resolveProviderStream } from './src/resolve/live.js';
          const input=parseStreamQuery({id:'157336',type:'movie'});
          const cat=await fetchProviderCatalog(input);
          console.log('CATALOG',JSON.stringify(cat.providers));
          try {
            const r=await resolveProviderStream(input,'surge');
            console.log('RESULT',JSON.stringify(r,null,2));
          } catch(e) {
            console.log('ERR_TYPE',typeof e,e?.constructor?.name);
            try{console.log('ERR_JSON',JSON.stringify(e,null,2));}catch(x){console.log('ERR_JSON_FAIL',String(x));}
            try{console.log('ERR_KEYS',Object.getOwnPropertyNames(e));}catch{}
            try{for(const k of Object.getOwnPropertyNames(e)){console.log('ERR_FIELD',k,JSON.stringify(e[k]));}}catch{}
            console.log('ERR_STRING',String(e));
          }
          NODE
