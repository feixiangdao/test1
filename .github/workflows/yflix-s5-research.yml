name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Isolate CineSrc token mint
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"headers.set('x-cs-r', requestToken)\\n      }\";new=\"headers.set('x-cs-r', requestToken)\\n        if (protectionHeader) headers.set('x-cs-q', protectionHeader)\\n        if (requestPacket) headers.set('x-cs-p', requestPacket)\\n      }\";assert old in s;open(p,'w').write(s.replace(old,new))"
          python3 -c "p='src/protection/session.js';s=open(p).read();old=\"  const stageOneToken = await host.stageOne.gc()\\n  const stageTwoToken = await host.window.__ss2_challenge.gc()\";new=\"  const __t0=Date.now()\\n  const stageOneToken = await host.stageOne.gc()\\n  const __t1=Date.now()\\n  const stageTwoToken = await host.window.__ss2_challenge.gc()\\n  const __t2=Date.now()\\n  console.log('MINT_PARTS', JSON.stringify({stage1Ms:__t1-__t0,stage2Ms:__t2-__t1,stage1Len:String(stageOneToken).length,stage2Len:String(stageTwoToken).length,stage1Prefix:String(stageOneToken).slice(0,24),stage2Prefix:String(stageTwoToken).slice(0,48)}))\";assert old in s;open(p,'w').write(s.replace(old,new))"
          npm ci >/dev/null
          cat > test-mint.mjs <<'NODE'
          import { createChallengeHost } from './src/protection/host.js';
          import { mintLockedSession } from './src/protection/session.js';

          const started=Date.now();
          let host;
          try {
            host=await createChallengeHost('/embed/movie/157336');
            console.log('HOST_MS',Date.now()-started);
            const m0=Date.now();
            const session=await mintLockedSession(host,false);
            console.log('MINT_MS',Date.now()-m0);
            const parts=String(session.token||'').split('::');
            console.log('TOKEN_TOTAL_LEN',String(session.token||'').length);
            console.log('TOKEN_SEGMENTS',JSON.stringify(parts.map(x=>({prefix:x.slice(0,48),len:x.length}))));
          } catch(e) {
            console.log('ERR_TYPE',typeof e,e?.constructor?.name);
            try{console.log('ERR_JSON',JSON.stringify(e,null,2));}catch{}
            console.log('ERR_STRING',String(e?.message||e));
          } finally {
            try{host?.release();}catch{}
          }
          process.exit(0);
          NODE
          node test-mint.mjs
