name: YFlix S5 CineSrc Research
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-research.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test patched CineSrc Surge with normal module runner
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/sharoon7171/cinesrc-stream-resolver /tmp/cs
          cd /tmp/cs
          python3 -c "p='src/protection/host.js';s=open(p).read();old=\"headers.set('x-cs-r', requestToken)\n      }\";new=\"headers.set('x-cs-r', requestToken)\n        if (protectionHeader) headers.set('x-cs-q', protectionHeader)\n        if (requestPacket) headers.set('x-cs-p', requestPacket)\n      }\";assert old in s;open(p,'w').write(s.replace(old,new))"
          npm ci >/dev/null
          cat > /tmp/cs/test-surge.mjs <<'NODE'
          import { parseStreamQuery, fetchProviderCatalog, resolveProviderStream } from './src/resolve/live.js';

          function walkUrls(v, out) {
            if (!v) return;
            if (typeof v === 'string') {
              if (/^https?:\/\//i.test(v)) out.push(v);
              return;
            }
            if (Array.isArray(v)) {
              for (const x of v) walkUrls(x, out);
              return;
            }
            if (typeof v === 'object') {
              for (const k of Object.keys(v)) walkUrls(v[k], out);
            }
          }

          async function test(label, query) {
            const input=parseStreamQuery(query);
            const cat=await fetchProviderCatalog(input);
            console.log('CATALOG',label,JSON.stringify(cat.providers));
            for (const id of ['surge','nebula','wave']) {
              try {
                const r=await resolveProviderStream(input,id);
                console.log('RESULT',label,id,JSON.stringify(r,null,2));
                const urls=[]; walkUrls(r,urls);
                console.log('URLS',label,id,JSON.stringify(urls));
                for (const u of urls.filter(x=>/m3u8|playlist/i.test(x)).slice(0,3)) {
                  try {
                    const p=await fetch(u,{headers:{Referer:'https://cinesrc.st/','User-Agent':'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 Chrome/137.0.0.0 Mobile Safari/537.36'},signal:AbortSignal.timeout(15000)});
                    const t=await p.text();
                    console.log('HLS',label,id,p.status,p.headers.get('content-type'),u,t.slice(0,180).replace(/\n/g,'\\n'));
                  } catch(e) {
                    console.log('HLS_ERR',label,id,String(e?.message||e));
                  }
                }
                if (r?.ok) return;
              } catch(e) {
                console.log('ERR_TYPE',label,id,typeof e,e?.constructor?.name);
                try{console.log('ERR_JSON',label,id,JSON.stringify(e,null,2));}catch{}
                console.log('ERR_STRING',label,id,String(e?.message||e));
              }
            }
          }

          await test('MOVIE',{id:'157336',type:'movie'});
          await test('TV',{id:'108978',type:'tv',season:'1',episode:'1'});
          NODE
          node /tmp/cs/test-surge.mjs
