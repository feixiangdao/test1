name: YFlix S5 CineSrc Trace
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace current CineSrc bundles
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/cs
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          curl -fsSL --max-time 30 -A "$UA" -e 'https://www.yflix.in/' 'https://cinesrc.st/embed/movie/157336' -o /tmp/cs/page.html
          echo '=== PAGE SIZE ==='
          wc -c /tmp/cs/page.html
          echo '=== NEXT ASSETS ==='
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/cs/page.html | sed -E 's/src="([^"]+)"/\1/' | sort -u | tee /tmp/cs/assets.txt
          n=0
          while read -r p; do
            [ -z "$p" ] && continue
            n=$((n+1))
            case "$p" in
              http*) u="$p" ;;
              /*) u="https://cinesrc.st$p" ;;
              *) u="https://cinesrc.st/$p" ;;
            esac
            f="/tmp/cs/a$n.js"
            echo "FETCH $u"
            curl -fsSL --max-time 30 -A "$UA" -e 'https://cinesrc.st/embed/movie/157336' "$u" -o "$f" || true
            echo "SIZE $(wc -c < "$f" 2>/dev/null || echo 0)"
          done < /tmp/cs/assets.txt
          echo '=== CHALLENGE SIGNALS ==='
          grep -RinoE 'api/c/[A-Za-z0-9_./?&=-]+|stage[12]|bootstrap|playlist|x-cs-[A-Za-z0-9_-]+|Server Action|next-action|pow|nonce|challenge|Nebula|serverAction|actionId' /tmp/cs/*.js | head -800 || true
          echo '=== URL SIGNALS ==='
          grep -RhoE 'https?://[^"'"'"'[:space:]<>]+' /tmp/cs/*.js | grep -Ei 'cine|enc-dec|api|playlist|challenge|worker|stream|server' | sort -u | head -400 || true