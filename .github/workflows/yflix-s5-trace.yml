name: YFlix S5 CineSrc Trace
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact CineSrc challenge contexts
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36'
          curl -fsSL --max-time 30 -A "$UA" -e 'https://cinesrc.st/embed/movie/157336' 'https://cinesrc.st/_next/static/chunks/f32ba640f0b58282.js' -o /tmp/cs.js
          python3 - <<'PY'
          import re
          s=open('/tmp/cs.js',encoding='utf-8',errors='replace').read()
          print('LEN',len(s))
          terms=['/api/c/bootstrap','/api/c/issue','/api/c/stage2/issue','x-cs-q','x-cs-r','x-cs-p','next-action','actionId','/api/playlist/','playlist','Nebula']
          for term in terms:
              print('\n===== '+term+' =====')
              pos=0
              for _ in range(12):
                  i=s.find(term,pos)
                  if i<0: break
                  frag=re.sub(r'\s+',' ',s[max(0,i-2600):min(len(s),i+5200)])
                  print(frag[:7800])
                  pos=i+len(term)
          print('\n===== ACTION-LIKE 40-80 HEX =====')
          vals=sorted(set(re.findall(r'["\']([0-9a-f]{40,80})["\']',s,re.I)))
          for v in vals: print(v)
          PY