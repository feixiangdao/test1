name: YFlix S5 CineSrc E2E
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-trace.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test current CineSrc end to end
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/aloysiuschewzhiyong/notflix.git /tmp/notflix >/dev/null 2>&1
          cd /tmp/notflix
          cat > test-cinesrc.ts <<'TS'
          import { fetchCinesrcStream } from './lib/sources/cinesrc';
          function abs(base:string,ref:string){try{return new URL(ref,base).toString()}catch{return ref}}
          async function duration(url:string,headers:Record<string,string>,depth=0):Promise<any>{
            if(depth>4)return {ok:false,error:'depth'};
            const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
            const t=await r.text();
            if(!r.ok||!t.startsWith('#EXTM3U'))return {ok:false,status:r.status,head:t.slice(0,100)};
            let total=0,count=0,m; const re=/#EXTINF:([0-9.]+)/g;
            while((m=re.exec(t))){total+=Number(m[1])||0;count++;}
            if(count)return {ok:true,status:r.status,minutes:total/60,count};
            const lines=t.replace(/\r/g,'').split('\n');
            let next=''; for(const line0 of lines){const line=line0.trim();if(line&&!line.startsWith('#')){next=abs(url,line);break;}}
            if(!next)return {ok:false,error:'no-child'};
            return duration(next,headers,depth+1);
          }
          async function check(label:string,params:any){
            const trace:string[]=[]; const started=Date.now();
            const r=await fetchCinesrcStream(params,trace);
            console.log('RESULT',label,JSON.stringify(r));
            console.log('TRACE',label,JSON.stringify(trace));
            console.log('MS',label,Date.now()-started);
            if(r?.url){
              const d=await duration(r.url,{Referer:r.referer,'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.37 Chrome/137.0.0.0 Safari/537.37'}).catch(e=>({ok:false,error:String(e.message||e)}));
              console.log('DURATION',label,JSON.stringify(d));
            }
          }
          async function main(){
            await check('MOVIE',{tmdbId:'157336',imdbId:'tt0816692',mediaType:'movie'});
            await check('TV',{tmdbId:'108978',imdbId:'tt9288030',mediaType:'tv',season:'1',episode:'1'});
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          TS
          npx -y tsx test-cinesrc.ts