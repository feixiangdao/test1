name: YFlix S5 Browser Trace
on:
  push:
    paths:
      - '.github/workflows/yflix-s5-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trace CineSrc in real Chromium
        shell: bash
        run: |
          set -e
          CHROME=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)
          echo "CHROME=$CHROME"
          mkdir -p /tmp/cs-browser && cd /tmp/cs-browser
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 >/dev/null 2>&1
          cat > trace.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const chrome=process.env.CHROME_PATH;
          const browser=await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
          async function run(label,url){
            const page=await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/138 Mobile Safari/537.36');
            page.on('request',req=>{
              const u=req.url();
              if(u.includes('/api/c/')||u.includes('/embed/')||u.includes('/api/playlist/')){
                const h=req.headers();
                console.log('REQ',label,req.method(),u,JSON.stringify({nextAction:h['next-action'],xcsq:h['x-cs-q'],xcsr:h['x-cs-r'],xcsp:h['x-cs-p']}));
                const pd=req.postData(); if(pd) console.log('POSTDATA',label,pd.slice(0,4000));
              }
            });
            page.on('response',async res=>{
              const u=res.url();
              if(u.includes('/api/c/')||u.includes('/embed/')||u.includes('/api/playlist/')){
                console.log('RESP',label,res.status(),u);
                if(u.includes('/api/c/')||u.includes('/api/playlist/')){
                  try{const t=await res.text(); console.log('BODY',label,u,t.slice(0,4000).replace(/\n/g,'\\n'));}catch{}
                }
              }
            });
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await new Promise(r=>setTimeout(r,25000));
            const state=await page.evaluate(()=>({
              href:location.href,
              video:document.querySelector('video')?.currentSrc||document.querySelector('video')?.src||'',
              text:document.body?.innerText?.slice(0,3000)||'',
              hls:window.__cinesrcHls?.url||window.__cinesrcHls?._url||'',
              shaka:!!window.__cinesrcShaka
            }));
            console.log('STATE',label,JSON.stringify(state));
            await page.close();
          }
          await run('MOVIE','https://cinesrc.st/embed/movie/157336');
          await run('TV','https://cinesrc.st/embed/tv/108978?s=1&e=1');
          await browser.close();
          JS
          CHROME_PATH="$CHROME" node trace.mjs