<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050816" />
  <title>烟花夜空</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 120%, rgba(67, 84, 176, .22), transparent 38%),
        linear-gradient(180deg, #02040c 0%, #07101f 58%, #101728 100%);
    }

    body {
      position: relative;
      touch-action: manipulation;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background-repeat: repeat;
    }

    .stars {
      opacity: .75;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(151,192,255,.72) 0 1px, transparent 1.4px);
      background-size: 150px 150px, 230px 230px;
      background-position: 11px 19px, 76px 103px;
    }

    .stars::before {
      opacity: .44;
      background-image: radial-gradient(circle, rgba(255,255,255,.92) 0 1px, transparent 1.3px);
      background-size: 310px 310px;
      background-position: 155px 72px;
    }

    .stars::after {
      opacity: .28;
      background-image: radial-gradient(circle, rgba(255,220,160,.96) 0 1px, transparent 1.3px);
      background-size: 420px 420px;
      background-position: 30px 210px;
    }

    .horizon {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 21vh;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 0%, rgba(5, 9, 20, .35) 15%, rgba(1, 3, 9, .96) 100%);
      clip-path: polygon(0 57%, 8% 52%, 13% 59%, 21% 45%, 29% 56%, 37% 42%, 47% 54%, 56% 38%, 65% 49%, 74% 36%, 84% 53%, 92% 46%, 100% 58%, 100% 100%, 0 100%);
    }

    .panel {
      position: fixed;
      top: clamp(18px, 3vw, 34px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      width: min(92vw, 660px);
      padding: 18px 22px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(12, 18, 38, .62), rgba(6, 9, 22, .42));
      box-shadow: 0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }

    .panel h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 800;
      letter-spacing: .12em;
      text-shadow: 0 0 28px rgba(132, 180, 255, .35);
    }

    .panel p {
      margin: 9px 0 0;
      color: rgba(225, 235, 255, .72);
      font-size: clamp(13px, 2vw, 15px);
      letter-spacing: .06em;
    }

    .controls {
      position: fixed;
      z-index: 4;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: min(92vw, 720px);
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 11px 16px;
      color: rgba(255,255,255,.9);
      background: rgba(7, 12, 30, .6);
      box-shadow: 0 8px 24px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(25, 38, 76, .72);
      border-color: rgba(255,255,255,.28);
    }

    button:active { transform: translateY(0) scale(.98); }

    button[aria-pressed="true"] {
      background: rgba(50, 74, 142, .72);
      border-color: rgba(142, 182, 255, .48);
    }

    .hint {
      position: fixed;
      z-index: 2;
      right: 18px;
      bottom: 18px;
      color: rgba(255,255,255,.38);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .panel { padding: 15px 16px; border-radius: 18px; }
      .controls { bottom: max(14px, env(safe-area-inset-bottom)); }
      button { padding: 10px 13px; font-size: 13px; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .panel, button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <canvas id="fireworks" aria-label="可交互烟花动画区域"></canvas>
  <div class="horizon" aria-hidden="true"></div>

  <section class="panel" id="panel">
    <h1>烟花夜空</h1>
    <p>点击或触摸夜空任意位置 · 在你指定的位置绽放烟花</p>
  </section>

  <div class="controls" aria-label="烟花控制">
    <button id="burstBtn" type="button">来一场烟花秀</button>
    <button id="autoBtn" type="button" aria-pressed="true">自动燃放：开</button>
    <button id="soundBtn" type="button" aria-pressed="false">音效：关</button>
  </div>

  <div class="hint">Space：随机烟花 · A：自动燃放</div>

  <script>
    (() => {
      const canvas = document.getElementById('fireworks');
      const ctx = canvas.getContext('2d', { alpha: true });
      const autoBtn = document.getElementById('autoBtn');
      const burstBtn = document.getElementById('burstBtn');
      const soundBtn = document.getElementById('soundBtn');
      const panel = document.getElementById('panel');

      const TAU = Math.PI * 2;
      const rockets = [];
      const particles = [];
      const flashes = [];
      const colors = [
        [255, 84, 116], [255, 166, 66], [255, 223, 84], [102, 255, 176],
        [84, 201, 255], [132, 117, 255], [221, 119, 255], [255, 255, 255]
      ];

      let width = 0;
      let height = 0;
      let dpr = 1;
      let autoMode = true;
      let soundOn = false;
      let lastTime = performance.now();
      let nextAutoLaunch = 0;
      let audioCtx = null;
      let interactionCount = 0;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function rand(min, max) { return Math.random() * (max - min) + min; }
      function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

      function rgba(rgb, alpha) {
        return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
      }

      class Rocket {
        constructor(targetX, targetY, delay = 0) {
          this.x = targetX + rand(-70, 70);
          this.y = height + 12;
          this.targetX = targetX;
          this.targetY = targetY;
          this.delay = delay;
          this.elapsed = 0;
          this.speed = rand(7.8, 10.8);
          const angle = Math.atan2(targetY - this.y, targetX - this.x);
          this.vx = Math.cos(angle) * this.speed;
          this.vy = Math.sin(angle) * this.speed;
          this.trail = [];
          this.color = pick(colors);
          this.dead = false;
        }

        update(dt) {
          this.elapsed += dt;
          if (this.elapsed < this.delay) return;

          this.trail.push([this.x, this.y]);
          if (this.trail.length > 10) this.trail.shift();

          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.hypot(dx, dy);

          this.x += this.vx * dt * 0.06;
          this.y += this.vy * dt * 0.06;
          this.vy += 0.005 * dt;

          if (dist < Math.max(16, this.speed * 2) || this.y <= this.targetY + 5) {
            this.dead = true;
            explode(this.targetX, this.targetY, this.color);
          }
        }

        draw() {
          if (this.elapsed < this.delay) return;
          if (this.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(this.trail[0][0], this.trail[0][1]);
            for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i][0], this.trail[i][1]);
            const gradient = ctx.createLinearGradient(this.x, this.y + 30, this.x, this.y);
            gradient.addColorStop(0, rgba(this.color, 0));
            gradient.addColorStop(1, rgba(this.color, .9));
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(this.x, this.y, 2.2, 0, TAU);
          ctx.fillStyle = '#fff';
          ctx.shadowBlur = 12;
          ctx.shadowColor = rgba(this.color, 1);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      class Particle {
        constructor(x, y, color, angle, speed, life, size, glitter = false) {
          this.x = x;
          this.y = y;
          this.prevX = x;
          this.prevY = y;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.color = color;
          this.life = life;
          this.maxLife = life;
          this.size = size;
          this.glitter = glitter;
          this.drag = rand(.973, .986);
          this.gravity = rand(.055, .085);
        }

        update(dt) {
          const t = dt * 0.06;
          this.prevX = this.x;
          this.prevY = this.y;
          this.vx *= Math.pow(this.drag, t);
          this.vy *= Math.pow(this.drag, t);
          this.vy += this.gravity * t;
          this.x += this.vx * t;
          this.y += this.vy * t;
          this.life -= dt;
        }

        draw() {
          const alpha = Math.max(0, this.life / this.maxLife);
          if (alpha <= 0) return;

          ctx.beginPath();
          ctx.moveTo(this.prevX, this.prevY);
          ctx.lineTo(this.x, this.y);
          const flicker = this.glitter && Math.random() < .25 ? .2 : 1;
          ctx.strokeStyle = rgba(this.color, alpha * flicker);
          ctx.lineWidth = this.size * Math.max(.45, alpha);
          ctx.shadowBlur = 8 * alpha;
          ctx.shadowColor = rgba(this.color, alpha);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }

      function explode(x, y, baseColor) {
        const style = (Math.random() * 4) | 0;
        const count = reducedMotion ? 40 : Math.floor(rand(72, 126));
        const secondColor = pick(colors);

        flashes.push({ x, y, life: 150, maxLife: 150, color: baseColor });
        playBoom();

        for (let i = 0; i < count; i++) {
          let angle = rand(0, TAU);
          let speed = rand(2.5, 8.5);

          if (style === 1) {
            const ringStep = TAU / count;
            angle = ringStep * i + rand(-.035, .035);
            speed = rand(5.5, 7.5);
          } else if (style === 2) {
            speed = rand(2.7, 10.8) * Math.pow(Math.random(), .22);
          } else if (style === 3) {
            angle = rand(0, TAU);
            speed = rand(4, 9.5);
            if (Math.random() < .28) speed *= .55;
          }

          const color = Math.random() < .22 ? secondColor : baseColor;
          particles.push(new Particle(
            x,
            y,
            color,
            angle,
            speed,
            rand(900, 1550),
            rand(1.1, 2.2),
            Math.random() < .55
          ));
        }

        if (style === 3 && !reducedMotion) {
          setTimeout(() => {
            if (document.hidden) return;
            const miniCount = 4;
            for (let j = 0; j < miniCount; j++) {
              const a = TAU * j / miniCount + rand(-.3, .3);
              explode(x + Math.cos(a) * 45, y + Math.sin(a) * 45, pick(colors));
            }
          }, 170);
        }
      }

      function launch(targetX = rand(width * .18, width * .82), targetY = rand(height * .16, height * .56), delay = 0) {
        targetX = Math.max(30, Math.min(width - 30, targetX));
        targetY = Math.max(55, Math.min(height * .72, targetY));
        rockets.push(new Rocket(targetX, targetY, delay));
      }

      function launchShow() {
        const n = reducedMotion ? 4 : 9;
        for (let i = 0; i < n; i++) {
          launch(rand(width * .12, width * .88), rand(height * .14, height * .58), i * rand(70, 130));
        }
      }

      function setAuto(value) {
        autoMode = value;
        autoBtn.setAttribute('aria-pressed', String(value));
        autoBtn.textContent = `自动燃放：${value ? '开' : '关'}`;
        nextAutoLaunch = performance.now() + rand(300, 900);
      }

      function setSound(value) {
        soundOn = value;
        soundBtn.setAttribute('aria-pressed', String(value));
        soundBtn.textContent = `音效：${value ? '开' : '关'}`;
        if (value) ensureAudio();
      }

      function ensureAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playBoom() {
        if (!soundOn) return;
        ensureAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const duration = .45;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          const t = i / data.length;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.8);
        }

        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(rand(180, 320), now);
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(.16, now + .01);
        gain.gain.exponentialRampToValueAtTime(.0001, now + duration);
        source.buffer = buffer;
        source.connect(filter).connect(gain).connect(audioCtx.destination);
        source.start(now);
      }

      function drawFlash(flash) {
        const alpha = flash.life / flash.maxLife;
        const radius = (1 - alpha) * 90 + 10;
        const gradient = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, radius);
        gradient.addColorStop(0, rgba([255,255,255], alpha * .5));
        gradient.addColorStop(.18, rgba(flash.color, alpha * .32));
        gradient.addColorStop(1, rgba(flash.color, 0));
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(flash.x, flash.y, radius, 0, TAU);
        ctx.fill();
      }

      function animate(now) {
        const dt = Math.min(34, now - lastTime || 16.67);
        lastTime = now;

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(2, 5, 15, 0.19)';
        ctx.fillRect(0, 0, width, height);
        ctx.globalCompositeOperation = 'lighter';

        for (let i = flashes.length - 1; i >= 0; i--) {
          const f = flashes[i];
          f.life -= dt;
          if (f.life <= 0) flashes.splice(i, 1);
          else drawFlash(f);
        }

        for (let i = rockets.length - 1; i >= 0; i--) {
          const rocket = rockets[i];
          rocket.update(dt);
          rocket.draw();
          if (rocket.dead) rockets.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update(dt);
          p.draw();
          if (p.life <= 0 || p.y > height + 60) particles.splice(i, 1);
        }

        if (autoMode && now >= nextAutoLaunch && !document.hidden) {
          if (Math.random() < .16 && !reducedMotion) {
            launchShow();
            nextAutoLaunch = now + rand(2600, 4200);
          } else {
            launch();
            nextAutoLaunch = now + rand(reducedMotion ? 1900 : 850, reducedMotion ? 3000 : 1750);
          }
        }

        requestAnimationFrame(animate);
      }

      function handlePointer(event) {
        if (event.target.closest?.('button')) return;
        ensureAudio();
        interactionCount++;
        if (interactionCount === 1) {
          panel.style.opacity = '.55';
          panel.style.transform = 'translateX(-50%) translateY(-6px)';
        }
        launch(event.clientX, event.clientY);
      }

      canvas.addEventListener('pointerdown', handlePointer);
      burstBtn.addEventListener('click', () => {
        ensureAudio();
        launchShow();
      });
      autoBtn.addEventListener('click', () => setAuto(!autoMode));
      soundBtn.addEventListener('click', () => setSound(!soundOn));

      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault();
          launch();
        } else if (event.key.toLowerCase() === 'a') {
          setAuto(!autoMode);
        }
      });

      window.addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => {
        lastTime = performance.now();
        nextAutoLaunch = lastTime + 800;
      });

      resize();
      setAuto(true);
      requestAnimationFrame(animate);

      setTimeout(() => {
        launch(width * .38, height * .37);
        launch(width * .62, height * .31, 240);
      }, 450);
    })();
  </script>
</body>
</html>
